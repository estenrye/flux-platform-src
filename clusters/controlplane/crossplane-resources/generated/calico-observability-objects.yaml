apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: deployment-tigera-operator
spec:
  forProvider:
    manifest:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        annotations:
          checkov.io/skip1: CKV_K8S_38=The tigera operator requires the service account
            token to install and manage Calico cluster resources.
          checkov.io/skip2: CKV_K8S_8=The tigera operator exposes no HTTP health endpoint;
            kubelet process supervision is the upstream liveness mechanism.
          checkov.io/skip3: CKV_K8S_9=The tigera operator serves no traffic; readiness
            is not a functional gate.
          checkov.io/skip4: CKV_K8S_19=The tigera operator runs with hostNetwork because
            it must reach the apiserver before any CNI exists.
          ignore-check.kube-linter.io/host-network: "The tigera operator runs with\
            \ hostNetwork because it must reach the apiserver before any CNI exists\
            \ \u2014 it is the component that installs the CNI."
          ignore-check.kube-linter.io/minimum-three-replicas: The tigera operator
            is a single-instance controller with leader election; replicas are active/standby,
            not active/active.
          ignore-check.kube-linter.io/no-liveness-probe: The tigera operator exposes
            no HTTP health endpoint; kubelet process supervision is the upstream-supported
            liveness mechanism.
          ignore-check.kube-linter.io/no-node-affinity: Single-host homelab cluster;
            no zone or role topology to express affinity against.
          ignore-check.kube-linter.io/no-readiness-probe: The tigera operator serves
            no traffic; readiness is not a functional gate for it.
          ignore-check.kube-linter.io/non-isolated-pod: The operator is hostNetwork
            (pre-CNI bootstrap); pod-network NetworkPolicy does not apply to it.
        labels:
          k8s-app: tigera-operator
        name: tigera-operator
        namespace: tigera-operator
      spec:
        replicas: 1
        selector:
          matchLabels:
            name: tigera-operator
        strategy:
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 1
          type: RollingUpdate
        template:
          metadata:
            labels:
              k8s-app: tigera-operator
              name: tigera-operator
          spec:
            containers:
            - args:
              - -manage-crds=true
              command:
              - operator
              env:
              - name: WATCH_NAMESPACE
                value: ''
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: OPERATOR_NAME
                value: tigera-operator
              - name: TIGERA_OPERATOR_INIT_IMAGE_VERSION
                value: v1.42.3
              envFrom:
              - configMapRef:
                  name: kubernetes-services-endpoint
                  optional: true
              image: quay.io/tigera/operator@sha256:4f32a054d5da52731f5f633816ac29cd98ffe97f69903cc04ec5ac60c86e6a02
              imagePullPolicy: IfNotPresent
              name: tigera-operator
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
              volumeMounts:
              - mountPath: /var/lib/calico
                name: var-lib-calico
                readOnly: true
            dnsPolicy: ClusterFirstWithHostNet
            hostNetwork: true
            nodeSelector:
              kubernetes.io/os: linux
            restartPolicy: Always
            securityContext:
              runAsNonRoot: true
              runAsUser: 10001
              seccompProfile:
                type: RuntimeDefault
            serviceAccountName: tigera-operator
            terminationGracePeriodSeconds: 60
            tolerations:
            - effect: NoExecute
              operator: Exists
            - effect: NoSchedule
              operator: Exists
            volumes:
            - hostPath:
                path: /var/lib/calico
              name: var-lib-calico
  providerConfigRef:
    kind: ClusterProviderConfig
    name: observability
  managementPolicies:
  - '*'
