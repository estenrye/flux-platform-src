# M4 step 3: per-cluster network allocation for claim-managed talos-kvm
# clusters, hand-curated like providers/kvm/network.yaml is for
# `controlplane` -- no algorithmic derivation (docs/memory/m4-design.md).
# `cluster-talos-kvm-composition` looks up `data.clusters["<claim name>"]`
# and fails the claim with a readable ClaimConditions error if it's
# missing, rather than guessing an allocation.
#
# Schema per cluster entry (documented here since there's no XRD-backed
# schema for EnvironmentConfig data):
#   apiserverVip:          ULA, e.g. "fd97:45c2:b3a1:200::10"
#   infraSubnet:           ULA /64, e.g. "fd97:45c2:b3a1:200::/64"
#   podCidr:                Calico pool /56, distinct from controlplane's
#   serviceCidr:            kube service network /112, distinct from controlplane's
#   bgpAsn:                 distinct from controlplane's 64513 -- this cluster's
#                            own Calico BGP session with the gateway
#   controlPlaneNodeUlas:   {"<name>": "<ULA>", ...} -- fully-qualified names,
#                            e.g. "observability-cp-1" (matches
#                            providers/kvm/network.yaml's convention, and
#                            talos-cluster module's variable "hosts" doc)
#   workerNodeUlas:         same shape, may be {}
#   vlanId:                 OPTIONAL, legacy -- only meaningful for a cluster
#                            with its own dedicated VLAN/bridge (the original
#                            M4 step 5 design). Never actually read by
#                            cluster-talos-kvm-composition (confirmed live
#                            2026-08-06) -- the bridge a cluster's VMs land on
#                            comes from the claim's own spec.vlanRef, not
#                            this EnvironmentConfig. Omit entirely for a
#                            cluster sharing an existing segment (e.g.
#                            observability on VLAN 100, Approach 1,
#                            docs/memory/m4-network-architecture-no-
#                            isolation-requirement.md).
#
# M4 step 5: `observability` populated 2026-08-01, next free block after
# controlplane's fd97:45c2:b3a1:100::/64 / ASN 64513 in network.yaml.
# Human prerequisite tracked separately (not GitOps-managed): a static
# route / BGP peering update on the UniFi gateway for this new /64,
# mirroring what controlplane's own bootstrap prerequisites document
# (.bin/create-controlplane-cluster.sh's header) -- the apiserver VIP
# itself is L2, not BGP-dependent, so VM creation and Talos bootstrap can
# proceed regardless, but full external reachability needs this.
#
# SUPERSEDED 2026-08-04: the static-route approach above caused a real
# outage, not just a documented gap -- both clusters' VMs sharing VLAN
# 100's physical bridge (br0) meant the gateway had to hairpin-route
# between them, which triggers ICMPv6 Redirects; `observability`'s replies
# started bypassing the gateway asymmetrically while `controlplane`'s
# requests kept routing through it every time, breaking the Talos API's
# TLS handshake outright (confirmed via packet capture: TCP completes,
# TLS never does). Fix in progress: `vlanId` below + the
# create-network-segment composition step give `observability` its own
# bridge instead. The static-route entry on the gateway becomes dead
# config once that lands (not yet removed -- cleanup tracked with the
# rest of this migration, docs/memory/m4-step-tracker.md).
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: platform-kvm-network
data:
  clusters:
    # CORRECTED 2026-08-01 (M4 step 5, caught live): the original ::211/
    # ::212/::213 suffixes are 3 hex digits (0x211 = 529 decimal) once fed
    # through the MAC-octet derivation (parseint of the ULA host part,
    # see providers/kvm/modules/talos-cluster/locals.tf) -- MUCH bigger
    # than a single byte. Terraform's own `check` block validates this
    # range but only *warns* on failure, it doesn't block the apply
    # (unlike `precondition`/`postcondition`) -- the invalid MAC sailed
    # through to a real libvirt XML error at domain-creation time instead
    # of failing cleanly at plan time. Fixed to 2-hex-digit suffixes,
    # mirroring controlplane's own convention (network.yaml: ::10 VIP,
    # ::11-13 CP, ::21-23 workers) -- and deliberately DISJOINT from
    # controlplane's actual octets (0x10-0x13, 0x21-0x23) and the NAT64
    # appliance's 0x64, since both clusters' VMs currently share the same
    # physical bridge (D1) and identical suffixes would produce identical,
    # colliding MAC addresses despite living in different /64s.
    # RE-ADDED 2026-08-06 (Approach 1, docs/memory/
    # m4-network-architecture-no-isolation-requirement.md): observability
    # now shares controlplane's own VLAN 100 / fd97:45c2:b3a1:100::/64
    # instead of a dedicated VLAN -- infraSubnet is genuinely
    # controlplane's own infra_subnet (providers/kvm/network.yaml), not a
    # new block. apiserverVip/node octets (0x30/0x31-33) are disjoint from
    # controlplane's own (0x10-13, 0x21-23) and NAT64's (0x64), same MAC-
    # collision reasoning as the comment above -- both clusters' VMs
    # genuinely share the same physical bridge (br0) now, not just
    # incidentally during a bug. No vlanId field: unlike the old
    # dedicated-VLAN entry, this cluster's bridge comes from
    # spec.vlanRef (pointing at the live `vlan100` XNetworkSegment claim,
    # applications/crossplane-resources/xnetworksegment/examples/
    # example-claim.yaml), which cluster-talos-kvm-composition's
    # create-workspace step actually reads -- confirmed live 2026-08-06
    # that this EnvironmentConfig's own vlanId/bgpAsn fields are never
    # consumed by the Composition at all, purely human documentation for
    # the still-manual gateway BGP peering step (bgpAsn kept below for
    # that reason).
    observability:
      apiserverVip: "fd97:45c2:b3a1:100::30"
      infraSubnet: "fd97:45c2:b3a1:100::/64"
      podCidr: "fd97:45c2:b3a1:1200::/56"
      serviceCidr: "fd97:45c2:b3a1:2100::/112"
      bgpAsn: 64514
      controlPlaneNodeUlas:
        observability-cp-1: "fd97:45c2:b3a1:100::31"
        observability-cp-2: "fd97:45c2:b3a1:100::32"
        observability-cp-3: "fd97:45c2:b3a1:100::33"
      workerNodeUlas: {}
    # M4 step 6 (2026-08-15): fixture for tests/xkubernetescluster-lifecycle
    # (Tier B) -- a real, minimal (1 CP node) end-to-end provision+teardown
    # chainsaw suite, manual-only (see that suite's README for the real
    # KVM/AWS/Cloudflare cost before running it). This entry alone doesn't
    # provision anything -- nothing reads it until a claim named
    # xkc-lifecycle-test actually exists. Reuses controlplane's shared VLAN
    # 100 bridge (no vlanId), same approach as observability. Next free
    # block after observability's 0x30-33: apiserverVip/node octets are
    # disjoint from controlplane's (0x10-13, 0x21-23), NAT64's (0x64), and
    # observability's (0x30-33) -- same MAC-collision reasoning as the
    # comments above. podCidr/serviceCidr continue the existing
    # 0x1200->0x1300 / 0x2100->0x2200 increment pattern; bgpAsn is next in
    # sequence after observability's 64514.
    xkc-lifecycle-test:
      apiserverVip: "fd97:45c2:b3a1:100::40"
      infraSubnet: "fd97:45c2:b3a1:100::/64"
      podCidr: "fd97:45c2:b3a1:1300::/56"
      serviceCidr: "fd97:45c2:b3a1:2200::/112"
      bgpAsn: 64515
      controlPlaneNodeUlas:
        xkc-lifecycle-test-cp-1: "fd97:45c2:b3a1:100::41"
      workerNodeUlas: {}
