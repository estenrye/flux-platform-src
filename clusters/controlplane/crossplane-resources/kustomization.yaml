apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../applications/crossplane-providers/provider-aws-iam/provider-config
  - ../../../applications/crossplane-providers/provider-aws-rolesanywhere/provider-config
  - ../../../applications/crossplane-providers/provider-aws-route53/provider-config
  - ../../../applications/crossplane-providers/provider-github/provider-config
  - ../../../applications/crossplane-providers/provider-kubernetes/provider-config
  - ../../../applications/crossplane-providers/family-cloudflare/provider-config
  # M4 step 1.
  - ../../../applications/crossplane-providers/provider-terraform/provider-config
  # M4: bridge-creation AnsibleRuns (cluster-talos-kvm-composition).
  - ../../../applications/crossplane-providers/provider-ansible/provider-config
  # M4: per-cluster VLAN Workspaces (cluster-talos-kvm-composition).
  - provider-config.unifi.yaml
  - crossplane.environment-config.yaml
  - crossplane.environment-config.kvm-hosts.yaml
  # M4 step 3.
  - crossplane.environment-config.kvm-network.yaml
  - delegated-hosted-zone-aws.controlplane-rye-ninja.yaml
  # M4 step 3b (CNI): remote-cluster manifest delivery -- observability has
  # no Flux instance of its own yet, so Calico is applied via generated
  # provider-kubernetes Objects instead (.bin/render/render-remote-objects.sh,
  # applications/calico/observability). See docs/memory/
  # remote-cluster-manifest-delivery.md.
  - provider-config.kubernetes.observability.yaml
  - generated/calico-observability-objects.yaml
