apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../applications/crossplane-resources/delegated-hosted-zone-aws
  # M4 step 3.
  - ../../../applications/crossplane-resources/xkubernetescluster
