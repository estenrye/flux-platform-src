# M4 step 1: KVM SSH private key for provider-terraform's libvirt
# ProviderConfig (applications/crossplane-providers/provider-terraform/
# provider-config/provider-config.yaml). Minted by
# .bin/bootstrap-provider-terraform-kvm-key.sh -- a new, dedicated
# credential, not the human operator's own interactive ssh-agent key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: provider-terraform-kvm-ssh-key
  namespace: crossplane-system
spec:
  secretStoreRef:
    name: openbao-provider-terraform
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  target:
    name: provider-terraform-kvm-ssh-key
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: id_ed25519
      remoteRef:
        key: provider-terraform/kvm-ssh-key
        property: id_ed25519
