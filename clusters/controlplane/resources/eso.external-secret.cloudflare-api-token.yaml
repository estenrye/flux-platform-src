# M3 step 9a: Cloudflare API token for cert-manager-acme's letsencrypt-*
# ClusterIssuers (DNS-01 solver). Same underlying 1Password item as
# crossplane's cloudflare-creds, different OpenBao KV path/policy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token-secret
  namespace: cert-manager
spec:
  secretStoreRef:
    name: openbao-cert-manager
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  target:
    name: cloudflare-api-token-secret
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: api-token
      remoteRef:
        key: cert-manager/cloudflare-api-token
        property: api_token
