# M3 step 9a: ESO -> OpenBao wiring for cert-manager-acme's Cloudflare
# token. Separate ClusterSecretStore (own Kubernetes-auth role/policy)
# from the crossplane one (step 6) to keep least-privilege scoping crisp
# per consumer — see docs/memory/m3-step6-secret-migration-eligibility.md
# for why this is clean of circularity (the letsencrypt-* ClusterIssuers
# are entirely separate from the csi-driver-spiffe-ca issuer OpenBao's own
# Certificate uses). Policy/role configured by
# .bin/configure-openbao-cert-manager-secrets.sh, not by any manifest here
# (OpenBao has no CRD-based config surface).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-cert-manager
  namespace: external-secrets-operator
spec:
  conditions:
    - namespaces:
        - cert-manager
  provider:
    vault:
      server: "https://openbao.openbao.svc:8200"
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: ryezone-labs-intermediate-controlplane
        key: intermediate.crt
        namespace: external-secrets-operator
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-cert-manager
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets-operator
