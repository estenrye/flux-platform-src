# M4: UniFi API key for provider-terraform's `unifi` ClusterProviderConfig
# (clusters/controlplane/crossplane-resources/provider-config.unifi.yaml).
# Reuses the EXISTING openbao-provider-terraform ClusterSecretStore --
# its policy already covers secret/data/provider-terraform/* (M4 step 1),
# and this key lives at provider-terraform/unifi-api-key, under that same
# prefix, so no new policy/role/ClusterSecretStore is needed. Minted by
# .bin/bootstrap-provider-terraform-unifi-key.sh -- unlike the KVM SSH
# key, the UniFi API key itself can't be generated by that script (no CLI/
# API to mint one; it's a UniFi Site Manager UI flow), only stored once
# you have it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: provider-terraform-unifi-api-key
  namespace: crossplane-system
spec:
  secretStoreRef:
    name: openbao-provider-terraform
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  target:
    name: provider-terraform-unifi-api-key
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: api-key
      remoteRef:
        key: provider-terraform/unifi-api-key
        property: api-key
