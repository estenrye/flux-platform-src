# M4 step 1: ESO -> OpenBao wiring for provider-terraform's KVM SSH key.
# Separate ClusterSecretStore (own Kubernetes-auth role/policy) from the
# other per-consumer stores (crossplane, cert-manager) to keep
# least-privilege scoping crisp per consumer -- same reasoning as
# docs/memory/m3-step6-secret-migration-eligibility.md. Policy/role
# configured by .bin/bootstrap-provider-terraform-kvm-key.sh, not by any
# manifest here (OpenBao has no CRD-based config surface).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-provider-terraform
  namespace: external-secrets-operator
spec:
  conditions:
    - namespaces:
        - crossplane-system
  provider:
    vault:
      server: "https://openbao.openbao.svc:8200"
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: ryezone-labs-intermediate-controlplane
        key: intermediate.crt
        namespace: external-secrets-operator
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-provider-terraform
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets-operator
