# Same fix as clusters/controlplane/patches/envoy-proxy.ipfamily.yaml: the
# EnvoyProxy fleet defaults to IPv4-only listeners; on this v6-only cluster
# the proxy's readiness listener would bind v4-any and kubelet's probe to
# the pod's v6 IP would be refused. Cluster-level patch: the base is shared
# with the v4 Spot cluster.
- op: add
  path: /spec/ipFamily
  value: IPv6
