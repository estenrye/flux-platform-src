apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthchecks-ping-gitea-repos
  namespace: gitea
spec:
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  target:
    name: healthchecks-ping-gitea-repos
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      metadata:
        annotations:
          description: "Ping URL of the gitea-repos capacity check on the self-hosted Healthchecks (healthchecks.rye.ninja), managed by External Secrets Operator"
  data:
    - secretKey: capacity
      remoteRef:
        key: healthchecks-ping-gitea-repos/capacity
