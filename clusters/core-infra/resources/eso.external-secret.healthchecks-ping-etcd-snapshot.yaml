apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthchecks-ping-etcd-snapshot
  namespace: etcd-backup
spec:
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  target:
    name: healthchecks-ping-etcd-snapshot
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      metadata:
        annotations:
          description: "Ping URL of the etcd-snapshot check on the self-hosted Healthchecks (healthchecks.rye.ninja), managed by External Secrets Operator"
  data:
    - secretKey: url
      remoteRef:
        key: healthchecks-ping-etcd-snapshot/url
