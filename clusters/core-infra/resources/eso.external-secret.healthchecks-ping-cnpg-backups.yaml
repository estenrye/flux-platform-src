apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthchecks-ping-cnpg-backups
  namespace: cnpg-backup-monitor
spec:
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  target:
    name: healthchecks-ping-cnpg-backups
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      metadata:
        annotations:
          description: "Ping URLs of the cnpg-backup-* checks on the self-hosted Healthchecks (healthchecks.rye.ninja), managed by External Secrets Operator"
  data:
    - secretKey: keycloak-db
      remoteRef:
        key: healthchecks-ping-cnpg-backups/keycloak-db
    - secretKey: grafana-db
      remoteRef:
        key: healthchecks-ping-cnpg-backups/grafana-db
    - secretKey: seaweedfs-db
      remoteRef:
        key: healthchecks-ping-cnpg-backups/seaweedfs-db
