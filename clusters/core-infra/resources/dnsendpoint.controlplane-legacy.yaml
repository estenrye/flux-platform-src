# Names controlplane publishes into UniFi from its own Gateways. core-infra's UniFi
# external-dns (applications/external-dns/unifi/core-infra) only reads DNSEndpoints and
# the pdns4-shim route in this namespace, so without this entry bao.rye.ninja and
# ca.rye.ninja would be deleted from UniFi at cutover (policy: sync, registry: noop).
# Values are controlplane's merged-eg Gateway address (verified against UniFi 2026-11-10).
# Delete each entry when its service leaves controlplane.
#
# core-infra's Cloudflare external-dns also reads this object; the Cloudflare records for
# these names are owned by controlplane (TXT owner), so it skips them.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: controlplane-legacy
  namespace: external-dns
spec:
  endpoints:
    - dnsName: bao.rye.ninja
      recordType: AAAA
      recordTTL: 300
      targets:
        - 2607:3640:1064:27f::9280
    - dnsName: ca.rye.ninja
      recordType: AAAA
      recordTTL: 300
      targets:
        - 2607:3640:1064:27f::9280
