apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-r2-etcd-snapshots
  namespace: etcd-backup
spec:
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  target:
    name: cloudflare-r2-etcd-snapshots
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      metadata:
        annotations:
          description: "Cloudflare R2 credentials for the core-infra etcd snapshot CronJob, managed by External Secrets Operator (provisioned by .bin/provision-cloudflare-r2-bucket.sh)"
  data:
    - secretKey: access-key-id
      remoteRef:
        key: cloudflare-r2-etcd-snapshots/access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: cloudflare-r2-etcd-snapshots/secret-access-key
    - secretKey: endpoint
      remoteRef:
        key: cloudflare-r2-etcd-snapshots/endpoint
    - secretKey: bucket
      remoteRef:
        key: cloudflare-r2-etcd-snapshots/bucket
