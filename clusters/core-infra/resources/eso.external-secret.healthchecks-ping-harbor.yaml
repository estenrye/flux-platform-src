apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthchecks-ping-harbor
  namespace: harbor
spec:
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  target:
    name: healthchecks-ping-harbor
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      metadata:
        annotations:
          description: "Ping URL of the harbor-warmup check on the self-hosted Healthchecks (healthchecks.rye.ninja), managed by External Secrets Operator"
  data:
    - secretKey: warmup
      remoteRef:
        key: healthchecks-ping-harbor/warmup
