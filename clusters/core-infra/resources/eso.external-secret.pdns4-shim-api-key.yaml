apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pdns4-shim-api-key
  namespace: external-dns
spec:
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  target:
    name: pdns4-shim-api-key
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      metadata:
        annotations:
          description: "Shared secret Designate's pdns4 target sends as X-API-Key to the pdns4-shim, managed by External Secrets Operator"
  data:
    - secretKey: API_KEY
      remoteRef:
        key: pdns4-shim-api-key/API_KEY
