# Recommendation-only VPAs (updateMode Off) for core-infra workloads that have no
# VPA of their own. Read with: kubectl get vpa -A -o yaml. Nothing here evicts or
# resizes pods; copy the targets into each app's values by hand.
# Operator-owned workloads (calico-system, the otelcol target allocator) are left
# out: VPA rejects targets that have a parent controller (ConfigUnsupported).
