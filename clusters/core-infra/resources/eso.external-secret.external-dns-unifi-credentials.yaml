apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-unifi-credentials
  namespace: external-dns
spec:
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  target:
    name: external-dns-unifi-credentials
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      metadata:
        annotations:
          description: "UniFi controller host and API key for the external-dns UniFi webhook, managed by External Secrets Operator"
  data:
    - secretKey: host
      remoteRef:
        key: external-dns-unifi-credentials/host
    - secretKey: api-key
      remoteRef:
        key: external-dns-unifi-credentials/api-key
