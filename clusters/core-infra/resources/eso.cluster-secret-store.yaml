apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: 1password-sdk
  namespace: external-secrets-operator
spec:
  conditions:
    - namespaces:
      - crossplane-system
      - cert-manager
      - external-dns
      - netdata
      # minecraft instances (applications/minecraft/<instance>)
      - arrendelle-winter
      - mermaid-cove-dev
      - baked-goods
      - family-minecraft
  provider:
    onepasswordSDK:
      vault: core-infra
      auth:
        serviceAccountSecretRef:
          name: onepassword-sdk-token
          namespace: external-secrets-operator
          key: token
      integrationInfo:
        name: integration-info
        version: v1
