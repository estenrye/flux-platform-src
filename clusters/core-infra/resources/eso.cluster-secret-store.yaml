apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: 1password-sdk
  namespace: external-secrets-operator
spec:
  conditions:
    - namespaces:
      - crossplane-system
      - cert-manager
      - external-dns
      - netdata
      - seaweedfs
      # grafana-secret-key backup (applications/grafana PushSecret)
      - grafana
      # Gitea's Keycloak client secret: generated and pushed from keycloak
      # (keycloak-gitea-client PushSecret), read back in gitea
      # (applications/gitea gitea-oidc-client ExternalSecret).
      - keycloak
      - gitea
      # Gitea Actions runner registration token (applications/gitea-runner)
      - gitea-runner
      # Harbor registry S3 key (applications/harbor; the same key is an identity in
      # seaweedfs-s3-config)
      - harbor
      # minecraft instances (applications/minecraft/<instance>)
      - arrendelle-winter
      - mermaid-cove-dev
      - baked-goods
      - family-minecraft
      # etcd snapshot R2 credentials (applications/etcd-snapshot)
      - etcd-backup
      # CNPG backup watcher Healthchecks ping URLs (applications/cnpg-backup-watcher)
      - cnpg-backup-monitor
  provider:
    onepasswordSDK:
      vault: core-infra
      auth:
        serviceAccountSecretRef:
          name: onepassword-sdk-token
          namespace: external-secrets-operator
          key: token
      integrationInfo:
        name: integration-info
        version: v1
