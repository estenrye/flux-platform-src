# Lets unauthenticated callers read the apiserver's OIDC discovery document and
# JWKS (/.well-known/openid-configuration, /openid/v1/jwks). SeaweedFS fetches
# the JWKS to validate ServiceAccount tokens for STS AssumeRoleWithWebIdentity
# (applications/seaweedfs/base/resources/eso.external-secret.iam-config.yaml)
# and cannot present a token to do so. Only public signing keys are exposed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: service-account-issuer-discovery-unauthenticated
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:unauthenticated
