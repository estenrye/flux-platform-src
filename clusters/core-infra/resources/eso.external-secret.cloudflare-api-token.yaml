# Cloudflare API token for cert-manager-acme's letsencrypt-* ClusterIssuers
# (DNS-01 solver).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token-secret
  namespace: cert-manager
spec:
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  target:
    name: cloudflare-api-token-secret
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare-api-token/credential
