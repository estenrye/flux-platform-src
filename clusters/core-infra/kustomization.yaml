apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../applications/priority-classes
- ../../applications/prometheus-operator-crds/base
- ../../applications/external-secrets-operator/base
- ../../applications/flux/base
- resources/eso.service-account-secret.yaml
- resources/eso.cluster-secret-store.yaml
- resources/flux.ssh-key-generator.yaml
- resources/flux.ssh-key-secret.yaml
- resources/flux.source.git.yaml
- resources/flux.kustomization.yaml
- ../../applications/calico/base
- resources/calico.bgp-configuration.yaml
- resources/calico.bgp-peer.gateway.yaml
- resources/calico.ippool.lb-internal-routed.yaml
- resources/calico.ippool.lb-ingress-routed.yaml
- ../../applications/openstack-cloud-controller-manager/base
- ../../applications/spegel/base
- ../../applications/cinder-csi/base
- resources/storageclass.csi-cinder-sc-delete.yaml
- resources/storageclass.csi-cinder-sc-retain.yaml
- ../../applications/external-csi-snapshotter/base
- ../../applications/kubelet-serving-cert-approver/base
- ../../applications/metrics-server/base
- ../../applications/opentelemetry-operator/base
- ../../applications/cert-manager/base
- ../../applications/cert-manager-approver-policy/base
- ../../applications/cert-manager-spiffe-issuer/base
- ../../applications/cert-manager-spiffe-csi-driver/base
- ../../applications/cert-manager-trust-manager/base
- ../../applications/vertical-pod-autoscaler/v1.8
- ../../applications/cert-manager-acme/base
- ../../applications/external-dns/cloudflare/base
# pdns4-shim (Designate pdns4 backend impersonator), migrated from controlplane.
# Plan: docs/superpowers/plans/2026-11-10-pdns4-shim-to-core-infra.md
- ../../applications/pdns4-shim/base
- resources/eso.external-secret.pdns4-shim-api-key.yaml
- resources/eso.external-secret.cloudflare-api-token.yaml
- resources/eso.external-secret.cloudflare-dns.yaml
# UniFi DNS publisher (DORMANT, replicas 0, until the cutover in
# docs/runbooks/external-dns-unifi-cutover.md).
- ../../applications/external-dns/unifi/core-infra
- resources/eso.external-secret.external-dns-unifi-credentials.yaml
- ../../applications/netdata/base
- ../../applications/victoria-metrics/base
- ../../applications/grafana/base
- resources/grafana.client-traffic-policy.yaml
- ../../applications/opentelemetry-collector-daemonset/base
- ../../applications/opentelemetry-collector-cluster/base
- ../../applications/openstack-cloud-controller-manager-otel/base
- ../../applications/reloader/base
- ../../applications/keda/base
- ../../applications/kubernetes-descheduler/base
- ../../applications/flux-monitoring/base
- ../../applications/vpa-monitoring/base
- ../../applications/control-plane-monitoring/base
# Minecraft instances migrated from the cd-homelab ArgoCD ApplicationSet (the
# four it deployed). Other overlays under applications/minecraft/ are
# committed but not wired: arrendelle-winter-dev, bakery, mermaid-cove,
# pokehaan-craft.
# - ../../applications/minecraft/arrendelle-winter
# - ../../applications/minecraft/mermaid-cove-dev
# - ../../applications/minecraft/baked-goods
- ../../applications/minecraft/family-minecraft
# CNPG resources
- ../../applications/cnpg/base
- ../../applications/cnpg-barman-plugin/base
# SeaweedFS resources
- ../../applications/seaweedfs-db/base
- ../../applications/seaweedfs/base
# Keycloak (id.rye.ninja); keycloak-db owns the keycloak namespace and backs up
# to SeaweedFS, so it follows seaweedfs.
- ../../applications/keycloak-db/base
- ../../applications/keycloak/base
# Kubernetes API access for Keycloak groups (API server JWT authentication, ADR 30).
- resources/rbac.kubernetes-groups.yaml
# grafana-db backs up to SeaweedFS and serves Grafana (applications/grafana).
- ../../applications/grafana-db/base
# Gitea (git.rye.ninja). The gitea app owns the gitea namespace; gitea-db backs
# up to SeaweedFS (bucket gitea-db-barman, role GiteaDbBarman) and its server
# certificate comes from cert-manager. The OIDC client lives in keycloak.
- ../../applications/gitea/base
- ../../applications/gitea-db/base
# Gitea Actions runners: temporarily decommissioned to recreate the StatefulSet
# (volumeClaimTemplates are immutable). Re-added in the follow-up PR.
- resources/gitea.client-traffic-policy.yaml
- resources/eso.external-secret.healthchecks-ping-gitea-repos.yaml
# etcd snapshots to Cloudflare R2 (needs Talos kubernetesTalosAPIAccess and the
# cloudflare-r2-etcd-snapshots 1Password item; docs/runbooks/etcd-snapshot-core-infra.md)
- ../../applications/etcd-snapshot/base
- resources/eso.external-secret.cloudflare-r2-etcd-snapshots.yaml
- resources/eso.external-secret.healthchecks-ping-etcd-snapshot.yaml
# CNPG backup watcher: reports backup/WAL-archiving health of each CNPG database
# to Healthchecks (docs/runbooks/healthchecks-self-hosted.md)
- ../../applications/cnpg-backup-watcher/base
- resources/eso.external-secret.healthchecks-ping-cnpg-backups.yaml
# VPA Recommendations
- resources/vpa.recommendations.yaml

patches:
- path: patches/netdata.gateway.hostname.yaml
  target:
    kind: Gateway
    name: netdata-gateway
    namespace: netdata
- path: patches/netdata.httproute.hostname.yaml
  target:
    kind: HTTPRoute
    name: netdata
    namespace: netdata
- path: patches/grafana.gateway.hostname.yaml
  target:
    kind: Gateway
    name: grafana-gateway
    namespace: grafana
- path: patches/grafana.httproute.hostname.yaml
  target:
    kind: HTTPRoute
    name: grafana
    namespace: grafana
- path: patches/grafana.site.configmap.yaml
  target:
    kind: ConfigMap
    name: grafana-site
    namespace: grafana
- path: patches/external-dns.txt-owner-id.yaml
  target:
    kind: Deployment
    name: external-dns
    namespace: external-dns
- path: patches/openstack-ccm.otel-sidecar.yaml
  target:
    kind: DaemonSet
    name: openstack-cloud-controller-manager
    namespace: kube-system
- path: patches/spiffe-csi.trust-domain.deployment.yaml
  target:
    kind: Deployment
    name: cert-manager-csi-driver-spiffe-approver
    namespace: cert-manager
- path: patches/spiffe-csi.trust-domain.daemonset.yaml
  target:
    kind: DaemonSet
    name: cert-manager-csi-driver-spiffe-driver
    namespace: cert-manager
- path: patches/seaweedfs-db-barman.yaml
  target:
    kind: ObjectStore
    name: seaweedfs-db-barman
    namespace: seaweedfs
