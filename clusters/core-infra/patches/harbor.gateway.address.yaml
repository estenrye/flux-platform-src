# Pin harbor-gateway's VIP. Envoy Gateway ignores Gateway.spec.addresses here
# (it never sets the proxy Service's loadBalancerIP), so the pin is Calico's own
# annotation, passed to the proxy Service through spec.infrastructure. Calico's
# LB IPAM then allocates exactly this address from the lb-ingress-routed pool.
# The same address is published to UniFi LAN DNS by
# applications/external-dns/unifi/core-infra/resources/dnsendpoint.harbor.yaml;
# change both together.
- op: add
  path: /spec/infrastructure
  value:
    annotations:
      projectcalico.org/loadBalancerIPs: '["2607:3640:1064:27f::1:928a"]'
