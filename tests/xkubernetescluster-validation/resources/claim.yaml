# cheap and near-instant, unlike tests/xkubernetescluster-lifecycle's real
# VM/Talos provision.
apiVersion: platform.rye.ninja/v1alpha1
kind: XKubernetesCluster
metadata:
  name: chainsaw-validate-xkc
  namespace: crossplane-system
spec:
  subdomain: chainsaw-validate-xkc
