name: Build Image estenrye/provider-terraform-libvirt
on:
  push:
    branches: [main]
    paths:
      - 'images/docker/provider-terraform-libvirt/**'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'images/docker/provider-terraform-libvirt/**'

jobs:
  call-workflow:
    uses: estenrye/.github/.github/workflows/docker-multiarch-slsa-releaser.yml@main
    permissions:
      contents: read # for checking out the repository.
      actions: read # for detecting the Github Actions environment.
      id-token: write # for creating OIDC tokens for signing.
      packages: write # for uploading attestations.
    with:
      push: true
      image_name: provider-terraform-libvirt
      context: images/docker/provider-terraform-libvirt
      provenance_generation: false
      private_repository: true
      # Same pre-existing bug as build-talos-cluster-bootstrap.yml: the
      # shared workflow's `tag` input defaults to github.ref_name, which
      # on a pull_request event is "<PR_NUMBER>/merge" -- invalid as a
      # Docker tag.
      tag: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
