apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otelcol-ds
  annotations:
    ignore-check.kube-linter.io/sorted-keys: kube-linter walks spec.config as an unordered map, so the reported key order changes between runs even though the keys in this file are already sorted.
spec:
  mode: daemonset
  terminationGracePeriodSeconds: 600
  hostNetwork: true
  # hostNetwork pods default to the node's resolver; this lets them resolve
  # cluster Service names such as the netdata-otel exporter endpoint.
  dnsPolicy: ClusterFirstWithHostNet
  image: otel/opentelemetry-collector-k8s:0.163.2
  serviceAccount: opentelemetry-collector
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 256Mi
  # Control-plane nodes are tainted NoSchedule; tolerate only that taint so the
  # collector also covers them.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  # The pod log files under /var/log/pods are root-owned and not world-readable.
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  # Resolves PodMonitor/ServiceMonitor resources into scrape targets. per-node
  # hands each daemonset collector only the targets on its own node, matching
  # the node-local view of the k8sattributes processor.
  targetAllocator:
    enabled: true
    serviceAccount: opentelemetry-targetallocator
    allocationStrategy: per-node
    prometheusCR:
      enabled: true
      podMonitorSelector: {}
      serviceMonitorSelector: {}
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  config:
    receivers:
      filelog/pods:
        include: [/var/log/pods/*/*/*.log]
        # Skip the collector's own logs so exporter errors cannot feed back
        # into the pipeline, and netdata-otel's, whose log lines for every
        # query of the stored logs would otherwise be ingested again.
        exclude:
          - /var/log/pods/netdata_netdata-otel-*/*/*.log
          - /var/log/pods/opentelemetry-collector_*/*/*.log
        # Only tail new lines; replaying every pod log on each restart would
        # overrun the memory limit.
        start_at: end
        include_file_path: true
        operators:
          # Parses the CRI log line format and derives k8s.namespace.name,
          # k8s.pod.name, k8s.pod.uid and k8s.container.name from the path.
          - type: container
      hostmetrics:
        collection_interval: 10s
        scrapers:
          cpu:
            metrics:
              system.cpu.time:
                enabled: true
              system.cpu.frequency:
                enabled: false
              system.cpu.logical.count:
                enabled: true
              system.cpu.physical.count:
                enabled: false
              system.cpu.utilization:
                enabled: true
          # system.cpu.load_average.{1m,5m,15m} are all enabled by default
          # (loadscraper metadata.yaml), so they are not listed. Listing them
          # made every render flip: kustomize re-sorts a map of these three
          # keys inconsistently from run to run, whatever order they are written
          # in. If a collector upgrade changes those defaults, set them here.
          load: {}
          memory: {}
          network:
            # Calico adds a cali* veth per pod plus several unused tunnel and
            # dummy devices; per-interface series blow up chart cardinality in
            # netdata. Keep physical NICs (eth*, ens*, ...).
            exclude:
              match_type: regexp
              interfaces:
                - ^cali.*
                - ^lo$
                - ^tunl\d+$
                - ^ip6tnl\d+$
                - ^sit\d+$
                - ^dummy\d+$
                - ^bond\d+$
                - ^teql\d+$
      # Applications on the node send OTLP traces here (gRPC). The collector is
      # hostNetwork, so clients reach it at the node IP (status.hostIP).
      otlp:
        protocols:
          grpc:
            endpoint: "[::]:4317"
      # Scrape targets come from the target allocator (PodMonitor/ServiceMonitor
      # resources); the operator injects the http_sd config into this receiver.
      prometheus:
        config:
          scrape_configs:
            # Per-container usage and CPU/memory saturation from each node's
            # kubelet. Node-role discovery runs in the target allocator, which
            # (per-node strategy) hands each collector only its own node's
            # target. Only the series needed to judge resource allocation are
            # kept: the full endpoint is ~3.8k series per node.
            - job_name: kubelet-cadvisor
              scheme: https
              metrics_path: /metrics/cadvisor
              scrape_interval: 60s
              authorization:
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              kubernetes_sd_configs:
                - role: node
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|memory_rss|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|cpu_cfs_throttled_seconds_total|oom_events_total)
                  action: keep
                # Drop the pod-level cgroup rollups and pause containers
                # (empty container label); per-container series are what matter.
                - source_labels: [container]
                  regex: .+
                  action: keep
                - regex: (id|name|image)
                  action: labeldrop
            # The kubelet's own metrics (same discovery, auth and TLS as the cAdvisor
            # job above): PVC usage, pod start latency, PLEG, container runtime
            # errors, evictions and image pulls. Allowlist only; histograms keep
            # count/sum plus a +Inf bucket so the collector accepts them.
            - job_name: kubelet
              scheme: https
              metrics_path: /metrics
              scrape_interval: 60s
              authorization:
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              kubernetes_sd_configs:
                - role: node
              metric_relabel_configs:
                - source_labels: [__name__, le]
                  regex: '(kubelet_volume_stats_(available_bytes|capacity_bytes|used_bytes|inodes_free|inodes)|kubelet_(pod_start_duration|pod_start_sli_duration|pleg_relist_duration|pleg_relist_interval|runtime_operations_duration|image_pull_duration)_seconds_(count|sum)|kubelet_runtime_operations_(total|errors_total)|kubelet_(running_pods|running_containers|evictions|started_pods_errors_total|started_containers_errors_total)|kubelet_certificate_manager_server_ttl_seconds);|kubelet_(pod_start_duration|pod_start_sli_duration|pleg_relist_duration|pleg_relist_interval|runtime_operations_duration|image_pull_duration)_seconds_bucket;\+Inf'
                  action: keep
            # Control-plane components, scraped by the collector on the same node. An
            # unfiltered API server exposes ~94k series, so only the golden signals
            # (traffic, errors, latency via a few SLI buckets, saturation, etcd client,
            # KMS) are kept. The serving certificate is verified against the cluster CA
            # (server name "kubernetes").
            - job_name: kube-apiserver
              scheme: https
              metrics_path: /metrics
              scrape_interval: 60s
              authorization:
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                server_name: kubernetes
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane]
                  regex: "true"
                  action: keep
                # The collector is hostNetwork, so the node's loopback reaches
                # the control-plane component running on the same node.
                - target_label: __address__
                  replacement: "127.0.0.1:6443"
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: instance
              metric_relabel_configs:
                - source_labels: [__name__, le]
                  regex: '(apiserver_request_total|apiserver_request_sli_duration_seconds_(count|sum)|apiserver_current_inflight_requests|apiserver_flowcontrol_(current_executing_requests|current_inqueue_requests|rejected_requests_total|request_wait_duration_seconds_(count|sum))|apiserver_storage_size_bytes|etcd_request_duration_seconds_(count|sum)|etcd_request_errors_total|apiserver_client_certificate_expiration_seconds_(count|sum)|apiserver_tls_handshake_errors_total|apiserver_admission_webhook_request_total|apiserver_envelope_encryption_(dek_cache_fill_percent|dek_source_cache_size|key_id_hash_last_timestamp_seconds|key_id_hash_total|kms_operations_latency_seconds_(count|sum))|apiserver_storage_envelope_transformation_cache_misses_total|process_(resident_memory_bytes|cpu_seconds_total|open_fds)|go_goroutines);|apiserver_request_sli_duration_seconds_bucket;(0\.1|0\.4|1|5|\+Inf)|(etcd_request_duration_seconds|apiserver_flowcontrol_request_wait_duration_seconds|apiserver_client_certificate_expiration_seconds)_bucket;\+Inf|apiserver_envelope_encryption_kms_operations_latency_seconds_bucket;(0\.0128|0\.1024|0\.8192|\+Inf)'
                  action: keep
            # The scheduler and controller-manager bind 127.0.0.1 only and serve a
            # self-signed certificate, so verification is skipped; the connection never
            # leaves the node's loopback. Auth is the service account token.
            - job_name: kube-scheduler
              scheme: https
              metrics_path: /metrics
              scrape_interval: 60s
              authorization:
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                insecure_skip_verify: true
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane]
                  regex: "true"
                  action: keep
                # The collector is hostNetwork, so the node's loopback reaches
                # the control-plane component running on the same node.
                - target_label: __address__
                  replacement: "127.0.0.1:10259"
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: instance
              metric_relabel_configs:
                - source_labels: [__name__, le]
                  regex: '(scheduler_(schedule_attempts_total|pending_pods|unschedulable_pods|preemption_attempts_total|preemption_victims_(count|sum)|queue_incoming_pods_total|scheduling_attempt_duration_seconds_(count|sum)|pod_scheduling_sli_duration_seconds_(count|sum)|pod_scheduling_attempts_(count|sum))|leader_election_master_status|process_(resident_memory_bytes|cpu_seconds_total)|go_goroutines);|scheduler_(scheduling_attempt_duration_seconds|pod_scheduling_sli_duration_seconds|pod_scheduling_attempts|preemption_victims)_bucket;\+Inf'
                  action: keep
            - job_name: kube-controller-manager
              scheme: https
              metrics_path: /metrics
              scrape_interval: 60s
              authorization:
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                insecure_skip_verify: true
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane]
                  regex: "true"
                  action: keep
                # The collector is hostNetwork, so the node's loopback reaches
                # the control-plane component running on the same node.
                - target_label: __address__
                  replacement: "127.0.0.1:10257"
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: instance
              metric_relabel_configs:
                - source_labels: [__name__, le]
                  regex: '(workqueue_(depth|adds_total|retries_total|queue_duration_seconds_(count|sum)|work_duration_seconds_(count|sum)|unfinished_work_seconds|longest_running_processor_seconds)|node_collector_(evictions_total|unhealthy_nodes_in_zone|zone_health|zone_size)|leader_election_master_status|garbagecollector_controller_resources_sync_error_total|process_(resident_memory_bytes|cpu_seconds_total)|go_goroutines);|workqueue_(queue|work)_duration_seconds_bucket;\+Inf'
                  action: keep
            # Talos etcd metrics (plain HTTP, no auth). If the port is closed the job
            # reports up=0 and the apiserver's own etcd_request_* series remain.
            - job_name: etcd
              scheme: http
              metrics_path: /metrics
              scrape_interval: 60s
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane]
                  regex: "true"
                  action: keep
                # The collector is hostNetwork, so the node's loopback reaches
                # the control-plane component running on the same node.
                - target_label: __address__
                  replacement: "127.0.0.1:2381"
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: instance
              metric_relabel_configs:
                - source_labels: [__name__, le]
                  regex: '(etcd_server_(has_leader|is_leader|leader_changes_seen_total|proposals_(failed|pending|committed|applied)_total|slow_apply_total|slow_read_indexes_total|quota_backend_bytes|heartbeat_send_failures_total|health_failures)|etcd_mvcc_db_total_size_(in_bytes|in_use_in_bytes)|etcd_network_(peer_sent_failures_total|active_peers)|etcd_disk_(wal_fsync_duration_seconds|backend_commit_duration_seconds)_(count|sum)|etcd_network_peer_round_trip_time_seconds_(count|sum)|process_(resident_memory_bytes|cpu_seconds_total|open_fds)|go_goroutines);|etcd_disk_(wal_fsync_duration_seconds|backend_commit_duration_seconds)_bucket;(0\.004|0\.008|0\.016|0\.064|0\.256|\+Inf)|etcd_network_peer_round_trip_time_seconds_bucket;\+Inf'
                  action: keep
    processors:
      # Tag every metric with the node it came from; without this the three
      # collectors' series are indistinguishable and merge into one chart.
      resource/node:
        attributes:
          - key: k8s.node.name
            value: ${env:K8S_NODE_NAME}
            action: upsert
          - key: host.name
            value: ${env:K8S_NODE_NAME}
            action: upsert
      # Adds the owning workload (k8s.deployment.name, k8s.daemonset.name, ...)
      # to pod logs. Each collector only watches pods on its own node.
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.cronjob.name
            - k8s.daemonset.name
            - k8s.deployment.name
            - k8s.job.name
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.statefulset.name
        filter:
          node_from_env_var: K8S_NODE_NAME
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          # Traces carry no pod UID; match on the sender's IP instead.
          - sources:
              - from: connection
      # Netdata files logs without service.name under "unattributed". Use the
      # owning workload, falling back to the container name for bare pods, and
      # the pod's namespace as service.namespace.
      transform/service:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["service.name"] == nil and attributes["k8s.deployment.name"] != nil
              - set(attributes["service.name"], attributes["k8s.daemonset.name"]) where attributes["service.name"] == nil and attributes["k8s.daemonset.name"] != nil
              - set(attributes["service.name"], attributes["k8s.statefulset.name"]) where attributes["service.name"] == nil and attributes["k8s.statefulset.name"] != nil
              - set(attributes["service.name"], attributes["k8s.cronjob.name"]) where attributes["service.name"] == nil and attributes["k8s.cronjob.name"] != nil
              - set(attributes["service.name"], attributes["k8s.job.name"]) where attributes["service.name"] == nil and attributes["k8s.job.name"] != nil
              - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil and attributes["k8s.container.name"] != nil
              - set(attributes["service.namespace"], attributes["k8s.namespace.name"]) where attributes["service.namespace"] == nil and attributes["k8s.namespace.name"] != nil
    exporters:
      otlp_grpc/netdata:
        endpoint: "netdata-otel.netdata.svc.cluster.local:4317"
        tls:
          insecure: true
      # PromQL store behind Grafana. OTLP/HTTP appends /v1/metrics, giving
      # VictoriaMetrics' /opentelemetry/v1/metrics ingest path.
      otlphttp/victoria-metrics:
        endpoint: "http://victoria-metrics.victoria-metrics.svc.cluster.local:8428/opentelemetry"
        tls:
          insecure: true
    service:
      pipelines:
        metrics:
          receivers: [hostmetrics, prometheus, otlp]
          processors: [resource/node]
          exporters: [otlp_grpc/netdata, otlphttp/victoria-metrics]
        logs:
          receivers: [filelog/pods]
          processors: [k8sattributes, resource/node, transform/service]
          exporters: [otlp_grpc/netdata]
        traces:
          receivers: [otlp]
          processors: [k8sattributes, resource/node]
          exporters: [otlp_grpc/netdata]
      # Self-metrics pushed straight to netdata-otel and VictoriaMetrics, bypassing the pipelines
      # above so they still arrive when a processor or exporter is backing up.
      telemetry:
        metrics:
          level: normal
          readers:
            - periodic:
                interval: 30000
                exporter:
                  otlp:
                    protocol: grpc
                    endpoint: http://netdata-otel.netdata.svc.cluster.local:4317
            # Same self-metrics to VictoriaMetrics for Grafana. The collector's
            # Prometheus pull endpoint (:8888) is not served when readers are
            # configured, so push; OTLP/HTTP endpoints are the full signal URL.
            - periodic:
                interval: 30000
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://victoria-metrics.victoria-metrics.svc.cluster.local:8428/opentelemetry/v1/metrics
        resource:
          k8s.node.name: ${env:K8S_NODE_NAME}
          host.name: ${env:K8S_NODE_NAME}