apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otelcol-ds
spec:
  mode: daemonset
  terminationGracePeriodSeconds: 600
  hostNetwork: true
  # hostNetwork pods default to the node's resolver; this lets them resolve
  # cluster Service names such as the netdata-otel exporter endpoint.
  dnsPolicy: ClusterFirstWithHostNet
  image: otel/opentelemetry-collector-k8s:0.157.0
  serviceAccount: opentelemetry-collector
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  config:
    receivers:
      filelog/pods:
        include: [/var/log/pods/*/*/*.log]
        start_at: beginning
        operators:
          - type: regex_parser
            regex: '^(?P<time>\S+) (?P<stream>stdout|stderr) (?P<logtag>\w) (?P<log>.*)$'
            timestamp:
              parse_from: time
              layout: "%Y-%m-%dT%H:%M:%S.%LZ"
          - type: json_parser
            parse_from: log
          - type: resource
            attributes:
              - key: k8s.pod.name
                from: resource.attributes["file.name"]
                regex: '/var/log/pods/(?P<namespace>.*)/(?P<pod>.*)/.*\.log'
      hostmetrics:
        collection_interval: 10s
        scrapers:
          cpu:
            metrics:
              system.cpu.time:
                enabled: true
              system.cpu.frequency:
                enabled: false
              system.cpu.logical.count:
                enabled: true
              system.cpu.physical.count:
                enabled: false
              system.cpu.utilization:
                enabled: true
          load:
            metrics:
              system.cpu.load_average.1m:
                enabled: true
              system.cpu.load_average.5m:
                enabled: true
              system.cpu.load_average.15m:
                enabled: true
          memory: {}
          network:
            # Calico adds a cali* veth per pod plus several unused tunnel and
            # dummy devices; per-interface series blow up chart cardinality in
            # netdata. Keep physical NICs (eth*, ens*, ...).
            exclude:
              match_type: regexp
              interfaces:
                - ^cali.*
                - ^lo$
                - ^tunl\d+$
                - ^ip6tnl\d+$
                - ^sit\d+$
                - ^dummy\d+$
                - ^bond\d+$
                - ^teql\d+$
    processors:
      # Tag every metric with the node it came from; without this the three
      # collectors' series are indistinguishable and merge into one chart.
      resource/node:
        attributes:
          - key: k8s.node.name
            value: ${env:K8S_NODE_NAME}
            action: upsert
          - key: host.name
            value: ${env:K8S_NODE_NAME}
            action: upsert
    exporters:
      otlp_grpc/netdata:
        endpoint: "netdata-otel.netdata.svc.cluster.local:4317"
        tls:
          insecure: true
    service:
      pipelines:
        metrics:
          receivers: [hostmetrics, filelog/pods]
          processors: [resource/node]
          exporters: [otlp_grpc/netdata]