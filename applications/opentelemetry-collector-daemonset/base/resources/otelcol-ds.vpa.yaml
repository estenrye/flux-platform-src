apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: otelcol-ds
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: otelcol-ds-collector
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: otc-container
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsAndLimits
        minAllowed:
          cpu: 10m
          memory: 64Mi
        maxAllowed:
          cpu: 500m
          memory: 512Mi
