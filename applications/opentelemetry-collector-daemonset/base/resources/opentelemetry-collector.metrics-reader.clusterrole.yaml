# Lets the collector's service account scrape /metrics endpoints that sit behind
# delegated authorization (e.g. metrics-server), and each node's kubelet
# (/metrics/cadvisor is authorized as the nodes/metrics subresource).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opentelemetry-collector-metrics-reader
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
