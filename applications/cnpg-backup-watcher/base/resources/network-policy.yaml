apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-backup-watcher
  namespace: cnpg-backup-monitor
  annotations:
    ignore-check.kube-linter.io/dangling-networkpolicy: "CronJob creates Job pods dynamically; the podSelector label is valid but no pod exists in the static rendered manifest."
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cnpg-backup-watcher
  policyTypes:
    - Egress
  egress:
    # Kubernetes API server (Calico evaluates post-DNAT: the control-plane
    # nodes' kube-apiserver port).
    - ports:
        - protocol: TCP
          port: 6443
    # healthchecks.rye.ninja (HTTPS).
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
