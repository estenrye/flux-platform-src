# Break-glass local admin. Generated once; read it from the gitea-admin Secret
# if SSO is unavailable (passwordMode initialOnlyNoReset: later edits in Gitea
# are not overwritten).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-admin
  namespace: gitea
spec:
  refreshPolicy: CreatedOnce
  target:
    name: gitea-admin
    creationPolicy: Owner
    template:
      data:
        username: gitea_admin
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: gitea-admin-password
