# Gitea's instance SSH signing key (AP-D6: signs PR merge commits so applier-01 can verify
# them). Generated by hand with `ssh-keygen -t ed25519 -N ""` and stored in the core-infra
# 1Password vault as `gitea-signing-key` (fields private-key, public-key); never in git.
# Mounted at /etc/gitea-signing for [repository.signing] (see values.yaml). Rotation:
# docs/runbooks/gitea.md "Merge signing".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-signing-key
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: gitea-signing-key
    creationPolicy: Owner
    template:
      data:
        # OpenSSH needs the trailing newline on the private key.
        signing-key: "{{ .private }}\n"
        signing-key.pub: "{{ .public }}\n"
  data:
    - secretKey: private
      remoteRef:
        key: gitea-signing-key/private-key
    - secretKey: public
      remoteRef:
        key: gitea-signing-key/public-key
