# Marks the Healthchecks check for the gitea-repos volume failed at 75% or more
# of the dataset quota, and succeeded below it. Create the check on
# healthchecks.rye.ninja with period 1 hour and grace 30 minutes, and put its
# ping URL in 1Password (core-infra/healthchecks-ping-gitea-repos, field
# `capacity`); clusters/core-infra/resources/eso.external-secret.healthchecks-ping-gitea-repos.yaml
# syncs it into the healthchecks-ping-gitea-repos Secret.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitea-repos-capacity
  namespace: gitea
  annotations:
    ignore-check.kube-linter.io/no-node-affinity: "Homelab cluster; no zone or role topology to express affinity against."
    ignore-check.kube-linter.io/no-liveness-probe: "Batch workload; liveness probes are not meaningful."
    ignore-check.kube-linter.io/no-readiness-probe: "Batch workload; readiness probes are not meaningful."
    ignore-check.kube-linter.io/env-value-from: "The Healthchecks ping URL comes from an ExternalSecret-managed Secret."
    ignore-check.kube-linter.io/read-secret-from-env-var: "The ping URL is a capability URL consumed by the script as an environment variable."
    ignore-check.kube-linter.io/default-service-account: "The job makes no Kubernetes API calls; automountServiceAccountToken is false."
    checkov.io/skip01: "CKV_K8S_35=The ping URL is a capability URL consumed by the script as an environment variable."
    checkov.io/skip02: "CKV_K8S_40=65532 is the conventional nonroot UID; the volume is mapped to the NAS gitea user server-side."
    checkov.io/skip03: "CKV_K8S_11=Memory limits are set; CPU limits only add throttling for a tiny hourly job."
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gitea-repos-capacity
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: capacity
              # python:3.13-alpine
              image: "python@sha256:1e1f6334529d1fb26a2ef619d7cffb30a7c7d7cc1cc7338ebee283a58d1aeaca"
              imagePullPolicy: IfNotPresent
              command: ["python", "/scripts/repos-capacity.py"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: MOUNT
                  value: /repos
                - name: THRESHOLD_PERCENT
                  value: "75"
                # Keep in step with tofu-truenas var.gitea_repos_quota_gib.
                - name: EXPECTED_SIZE_GIB
                  value: "50"
                - name: PING_URL
                  valueFrom:
                    secretKeyRef:
                      name: healthchecks-ping-gitea-repos
                      key: capacity
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: repos
                  mountPath: /repos
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: gitea-repos-capacity-script
            - name: repos
              persistentVolumeClaim:
                claimName: gitea-repos
                readOnly: true
