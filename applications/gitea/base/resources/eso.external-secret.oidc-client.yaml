# Gitea's Keycloak client credentials. The secret is generated in the keycloak
# namespace (applications/keycloak: keycloak-gitea-client), backed up to the
# core-infra 1Password vault by a PushSecret, and read back here, so Keycloak's
# realm import and Gitea always agree on it. key = client id, secret = client
# secret (the key names the Gitea chart expects).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-oidc-client
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: gitea-oidc-client
    creationPolicy: Owner
    template:
      data:
        key: gitea
        secret: "{{ .secret }}"
  data:
    - secretKey: secret
      remoteRef:
        key: gitea-oidc-client/client-secret
