apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The gitea namespace is owned by applications/gitea/base.
resources:
  - resources/network-policy.yaml
  - resources/tls.issuers.yaml
  - resources/tls.certificates.yaml
  - resources/tls.certificate-request-policies.yaml
  - resources/gitea-db.cluster.yaml
  - resources/barman-objectstore.yaml
  - resources/scheduled-backup.yaml
