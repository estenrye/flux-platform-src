apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: gitea-db-backup
  namespace: gitea
spec:
  # Staggered from step-ca-db (03:00), keycloak-db (03:15), openbao-db (03:30)
  # and grafana-db (03:45).
  schedule: "0 0 4 * * *"
  backupOwnerReference: self
  cluster:
    name: gitea-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  target: primary
  immediate: true
