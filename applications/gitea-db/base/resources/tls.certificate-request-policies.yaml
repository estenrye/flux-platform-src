# cert-manager-approver-policy is cluster-wide and the built-in approver is
# disabled, so these Certificates sit WaitingForApproval forever unless a
# CertificateRequestPolicy matches them AND cert-manager's ServiceAccount has
# the `use` grant (same pattern as applications/vertical-pod-autoscaler).
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: gitea-db-ca
spec:
  allowed:
    commonName:
      required: true
      value: gitea-db-ca
    isCA: true
    usages:
      - digital signature
      - cert sign
      - crl sign
  selector:
    issuerRef:
      group: cert-manager.io
      kind: Issuer
      name: gitea-db-selfsigned
    namespace:
      matchNames:
        - gitea
---
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: gitea-db-server
spec:
  allowed:
    commonName:
      required: true
      value: gitea-db-rw
    dnsNames:
      required: true
      values:
        - gitea-db-r
        - gitea-db-r.gitea
        - gitea-db-r.gitea.svc
        - gitea-db-r.gitea.svc.cluster.local
        - gitea-db-ro
        - gitea-db-ro.gitea
        - gitea-db-ro.gitea.svc
        - gitea-db-ro.gitea.svc.cluster.local
        - gitea-db-rw
        - gitea-db-rw.gitea
        - gitea-db-rw.gitea.svc
        - gitea-db-rw.gitea.svc.cluster.local
    isCA: false
    usages:
      - digital signature
      - key encipherment
      - server auth
  selector:
    issuerRef:
      group: cert-manager.io
      kind: Issuer
      name: gitea-db-ca
    namespace:
      matchNames:
        - gitea
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-policy:gitea-db
rules:
  - apiGroups: ["policy.cert-manager.io"]
    resources: ["certificaterequestpolicies"]
    verbs: ["use"]
    resourceNames: ["gitea-db-ca", "gitea-db-server"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-policy:gitea-db
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-policy:gitea-db
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
