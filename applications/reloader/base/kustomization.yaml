apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: reloader

resources:
  - resources/namespace.yaml

helmCharts:
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    version: 2.2.19
    releaseName: reloader
    namespace: reloader
    includeCRDs: true
    valuesFile: values.yaml

patches:
  - target:
      kind: NetworkPolicy
    path: patches/network-policy.yaml
  - target:
      kind: Deployment
    path: patches/deployment.yaml
  
  - target:
      kind: ClusterRoleBinding
    path: patches/clusterRoleBinding.yaml

images:
  - name: ghcr.io/stakater/reloader
    newTag: v1.4.23
    digest: sha256:82c80a15fdba22f738642553159f9fb37baf9e4d1edfeb798e8c48d87767f410