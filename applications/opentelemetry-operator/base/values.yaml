# Overrides only: Helm merges these onto the chart's own defaults. This file
# used to be a full copy of the chart-0.109 defaults, which went stale (and
# stopped validating) when the chart moved on, so keep it to what is changed.

replicaCount: 3

# Allows for pod scheduler prioritisation
priorityClassName: "opentelemetry"

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: "app.kubernetes.io/name"
                operator: In
                values:
                  - opentelemetry-operator
          topologyKey: "kubernetes.io/hostname"

manager:
  collectorImage:
    tag: 0.163.1

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 50Mi
    requests:
      cpu: 100m
      memory: 64Mi
      ephemeral-storage: 50Mi

  # Whether the operator should create RBAC permissions for collectors.
  createRbacPermissions: true

  securityContext:
    readOnlyRootFilesystem: true

  # Lint exceptions for the manager Deployment (chart 0.109 emitted these itself).
  deploymentAnnotations:
    checkov.io/skip1: CKV_K8S_38=opentelemetry-operator requires the service account token to manage OpenTelemetryCollector and Instrumentation resources.
    ignore-check.kube-linter.io/no-node-affinity: No zone or role topology to express node affinity against.

  # Plain-HTTP metrics on 8080, as before. Since chart 0.110 the
  # kube-rbac-proxy sidecar is gone; the default is now authenticated HTTPS on
  # 8443 (see the chart's UPGRADING.md), which the collectors' ServiceMonitor
  # scrape would then need a bearer token for.
  ports:
    metricsPort: 8080
  metrics:
    secure: false

  serviceMonitor:
    enabled: true
    metricsEndpoints:
      - port: metrics

# cert-manager issues the webhook certificate (the chart default, which also
# takes precedence over autoGenerateCert).
admissionWebhooks:
  certManager:
    enabled: true
  autoGenerateCert:
    enabled: false

testFramework:
  image:
    tag: 1.37.0
  securityContext:
    readOnlyRootFilesystem: true
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
