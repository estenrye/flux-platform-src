apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opentelemetry-operator-system

helmCharts:
  - name: opentelemetry-operator
    repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: 0.127.1
    releaseName: opentelemetry-operator
    namespace: opentelemetry-operator-system
    includeCRDs: true
    # Helm test-hook Pods reference a ServiceAccount created in the same Flux
    # apply, so their dry-run fails and blocks the whole Kustomization.
    skipTests: true
    valuesFile: values.yaml

patches:
  - target:
      kind: Deployment
    path: patches/deployment.yaml
  - target:
      kind: ClusterRole
      name: opentelemetry-operator-manager
    path: patches/clusterrole-httproutes.yaml
  - target:
      kind: ClusterRoleBinding
    path: patches/clusterRoleBinding.yaml
  - target:
      kind: RoleBinding
    path: patches/clusterRoleBinding.yaml

resources:
  - resources/namespace.yaml
  - resources/networkpolicy.deployment.yaml
  - resources/certificate-request-policy.yaml
  - resources/certificate-request-policy-rbac.yaml

images:
  # newTag and digest together: Renovate then tracks this image by tag (and
  # refreshes the digest of that tag) instead of following the digest of
  # `latest`, and kustomize resolves the image by digest. Keep newTag equal to
  # the chart's appVersion; renovate.json updates the chart and this image in
  # one PR.
  - name: ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-operator
    newTag: 0.162.0
    digest: sha256:771d341d89b2c0a31580293c0a9e09598e2c425b6cf342d31b91da16c2b952d9
