# Package path/tag follow this repo's crossplane-contrib registry-host
# convention (matching provider-kubernetes, function-*), but are NOT yet
# confirmed to resolve -- the xpkg.crossplane.io registry returned 401
# UNAUTHORIZED when probed unauthenticated (no anonymous tag listing), so
# this couldn't be verified the way M3 verified adorsys/keycloak-config-cli
# tags directly against Docker Hub. v1.1.1 is upstream's latest GitHub
# release (crossplane-contrib/provider-terraform) as of 2026-07-27. Verify
# with `crossplane xpkg` or a live `kubectl describe provider
# provider-terraform` before treating M4 step 1 as mergeable — see
# docs/memory/m4-design.md D4.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-terraform
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-terraform:v1.1.1
  runtimeConfigRef:
    name: provider-terraform
    kind: DeploymentRuntimeConfig
