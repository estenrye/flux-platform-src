# Shared by every Workspace that doesn't override providerConfigRef.
#
# KNOWN LIMITATION (single-host fleet, docs/memory/m4-design.md D1): the
# libvirt provider's `uri` below is hardcoded to the one KVM host that
# exists today. Every Workspace using this ProviderConfig therefore
# provisions onto that same host, regardless of claim. When a second host
# is added, this needs to become host-aware per-Workspace (either multiple
# ProviderConfigs, one per host, selected per claim, or moving host
# selection into the module itself) -- not solved in M4 step 1.
#
# Credential file (`kvm-ssh-key`): the `automation-user` SSH private key
# used interactively via ssh-agent from a workstation today has no
# unattended equivalent -- this is a *new* dedicated key, minted by
# .bin/bootstrap-provider-terraform-kvm-key.sh (M4 step 1) and stored in
# OpenBao, synced here via ESO (see
# clusters/controlplane/resources/eso.cluster-secret-store.openbao-provider-terraform.yaml
# and eso.external-secret.provider-terraform-kvm-ssh-key.yaml). Two
# follow-ups noted in the design doc (D4), not resolved here: whether
# provider-terraform writes this file at a mode SSH's client will accept
# (0600), and `no_verify=1` skipping the SSH host-key check.
#
# NO `terraform { backend "kubernetes" {...} }` block here, deliberately.
# `configuration` is static HCL shared by every Workspace using this
# ProviderConfig (every cluster, until we have a reason to split), so a
# single hardcoded `secret_suffix` here would make every Workspace's state
# collide on the same Kubernetes Secret name. Each cluster's own Workspace
# (M4 step 3, one per claim) must declare its own backend block with a
# secret_suffix derived from the claim (e.g. the cluster name) inside its
# own module content instead.
#
# CORRECTED 2026-08-01 (M4 step 5, caught live): `XKubernetesCluster` is a
# namespaced XR (v2), and Crossplane v2 categorically forbids a namespaced
# XR from composing a cluster-scoped resource -- confirmed against
# crossplane/crossplane's own source
# (internal/controller/apiextensions/composite/composition_functions.go,
# errFmtNamespacedXRClusterResource), not an opt-out-able policy. The
# plain `tf.upbound.io/v1beta1 Workspace`/`ProviderConfig` pair is
# cluster-scoped only; `tf.m.upbound.io/v1beta1` is the namespace-aware
# variant this provider also ships (confirmed live via `kubectl
# api-resources`). A namespaced `Workspace` can still reference a
# cluster-scoped `ClusterProviderConfig` (same group) via
# `providerConfigRef.kind` -- same pattern `delegated-hosted-zone-aws`
# already uses for its own `.m.upbound.io` managed resources. This
# `ClusterProviderConfig` replaces what was a `tf.upbound.io/v1beta1
# ProviderConfig` of the same name -- nothing else in this repo referenced
# the old one.
apiVersion: tf.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  credentials:
    - filename: kvm-ssh-key
      source: Secret
      secretRef:
        namespace: crossplane-system
        name: provider-terraform-kvm-ssh-key
        key: id_ed25519
  # CORRECTED 2026-08-01 (M4 step 5, caught live): the FQDN resolved to the
  # wrong address entirely from inside this pod --
  # `dial tcp [64:ff9b::a05:b001]:22: i/o timeout`, a NAT64-synthesized
  # answer for some unrelated IPv4 (10.5.176.1), not the host's real ULA
  # (fd97:45c2:b3a1:100::2000, per providers/kvm/hosts.yaml). Whatever
  # resolves this hostname correctly on a workstation (likely a
  # split-horizon/local override) isn't reachable from a cluster pod's
  # DNS path. Fixed by connecting to the raw ULA literal, bypassing DNS
  # entirely -- matches the NetworkPolicy's existing ipBlock scoping
  # exactly (applications/crossplane-providers/provider-terraform/
  # resources/network-policy.yaml), which was already IP-based, not
  # hostname-based.
  configuration: |
    provider "libvirt" {
      uri = "qemu+ssh://automation-user@[fd97:45c2:b3a1:100::2000]/system?keyfile=kvm-ssh-key&no_verify=1"
    }
