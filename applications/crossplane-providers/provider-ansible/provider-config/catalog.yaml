apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: crossplane-provider-ansible-config
  description: |-
    ProviderConfig for the Crossplane Ansible provider, split into its own
    directory so it can be applied by the crossplane-resources Flux
    Kustomization once the provider itself is Healthy (docs/memory/
    crossplane-bootstrap-phasing.md). Supplies the KVM host SSH credential
    every AnsibleRun using this ProviderConfig inherits.
  tags:
    - crossplane
    - crossplane-provider
    - ansible
    - kvm
spec:
  type: operator
  lifecycle: production
  owner: platform-engineering
  subcomponentOf: crossplane-provider-ansible
