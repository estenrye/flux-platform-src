apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - resources/namespace.yaml
  - resources/provider.yaml
  - resources/network-policy.yaml
  - resources/provider-runtime-config.yaml
  # provider-config.yaml deliberately not included here — same phasing
  # reason as provider-terraform's own kustomization.yaml: it's applied by
  # the crossplane-resources Flux Kustomization instead, gated on this
  # provider being Healthy (docs/memory/crossplane-bootstrap-phasing.md).
