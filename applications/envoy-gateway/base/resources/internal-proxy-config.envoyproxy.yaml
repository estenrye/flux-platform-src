apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal-proxy-config
  namespace: envoy-gateway-system
spec:
  mergeGateways: true
  # Root cause found live 2026-09-09 (docs/memory/node-gua-onlink-reply-unreliable.md):
  # EnvoyProxy.spec.ipFamily defaults to IPv4-only if unset -- on this
  # IPv6-only cluster that meant every listener (including the readiness
  # probe on 19003) bound to 0.0.0.0 instead of [::], so kubelet's probe
  # (hitting the pod's real IPv6 address) could never connect, and neither
  # could real client traffic. custom-proxy-config's fleet only avoided
  # this because it carries the same setting live but undeclared in git
  # (now fixed alongside this).
  ipFamily: IPv6
  # LAN-internal-only Envoy fleet, separate from custom-proxy-config
  # (merged-eg's GUA-ingress fleet). Pinning the shared Service's
  # LoadBalancer IP to Calico's lb-internal-ula-routed IPPool means every
  # hostname on this GatewayClass draws a ULA VIP, never a GUA-ingress one --
  # so VLAN-100-resident clients (e.g. pdns4-shim's pcd-ce-lab consumer)
  # never source or target the delegated GUA /64 and can't hit the on-link
  # reply bug root-caused in docs/memory/node-gua-onlink-reply-unreliable.md.
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # Pool-selection annotation for Services is "projectcalico.org/..."
        # (no "cni." prefix -- that prefix is for pod IPAM, a different
        # mechanism). Confirmed live 2026-09-09: the "cni."-prefixed form is
        # silently ignored, and Calico falls back to its default pool
        # (which landed on the GUA pool, defeating the point).
        annotations:
          projectcalico.org/ipv6pools: '["lb-internal-ula-routed"]'
        # Cluster (not the envoyDeployment default of Local): this fleet is
        # low-traffic and internal-only (pdns4-shim/pcd-ce-lab today), so
        # kube-proxy's cross-node redirect is an acceptable cost -- it
        # avoids the ECMP-locality bug custom-proxy-config's 6-replica/
        # full-node-anti-affinity mitigates for the GUA-ingress fleet
        # (docs/memory/vip-renumber-flakiness-investigation.md), so this
        # fleet doesn't need to mirror that expensive workaround. Confirmed
        # live 2026-09-09: mirroring it here (replicas: 6 + required
        # anti-affinity) starved node CPU and left one pod permanently
        # Pending -- oversized for what this fleet actually needs.
        externalTrafficPolicy: Cluster
      envoyDeployment:
        replicas: 2
