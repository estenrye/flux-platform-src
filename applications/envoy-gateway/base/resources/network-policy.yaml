apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-gateway-controller-allow
  namespace: envoy-gateway-system
  annotations:
    ignore-check.kube-linter.io/dangling-networkpolicypeer-podselector: "Envoy proxy pods are created dynamically by the controller; the app.kubernetes.io/component=proxy label is valid but pods do not exist in the static rendered manifest."
spec:
  podSelector:
    matchLabels:
      control-plane: envoy-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
      ports:
        - protocol: TCP
          port: 18000
        - protocol: TCP
          port: 18001
        - protocol: TCP
          port: 18002
    - ports:
        - protocol: TCP
          port: 9443
        - protocol: TCP
          port: 19001
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-proxy-allow
  namespace: envoy-gateway-system
  annotations:
    ignore-check.kube-linter.io/dangling-networkpolicy: "Envoy proxy pods are created dynamically by the Envoy Gateway controller; they are not present in the static rendered manifest but exist at runtime."
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 10443
        - protocol: TCP
          port: 10080
        - protocol: TCP
          port: 19001
        # pdns4-shim's UDPRoute listener (dns/53) -- external clients
        # (Designate) connecting to the merged internal-eg Service's UDP
        # port, same "no `from:` restriction" shape as the TCP listeners
        # above, since this Envoy fleet is externally reachable by design.
        # Port 10053, NOT 53 -- confirmed live 2026-09-09 via `envoy
        # /listeners` admin API and the Service's own port spec
        # (port: 53, targetPort: 10053): Envoy Gateway internally binds
        # every listener at 10000+<logical port> (443->10443, matching
        # the TCP rule above, which is why this file already used 10443/
        # 10080 instead of 443/80). My first attempt at this rule used 53
        # by mistake and the fix in PR #203 didn't actually unblock the
        # UDPRoute path -- this corrects it.
        - protocol: UDP
          port: 10053
  egress:
    - to:
        - podSelector:
            matchLabels:
              control-plane: envoy-gateway
      ports:
        - protocol: TCP
          port: 18000
        - protocol: TCP
          port: 18001
        - protocol: TCP
          port: 18002
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
        # M3 step 9b: Keycloak backend (id.rye.ninja HTTPS-terminate).
        - protocol: TCP
          port: 8080
        # M3 step 10: Pinniped Supervisor backend (sso.rye.ninja
        # TLS-passthrough -- still the pod's real port, not the Service's
        # declared 443, since Calico evaluates egress post-DNAT).
        - protocol: TCP
          port: 8443
        # pdns4-shim backend (pdns4-shim.rye.ninja HTTPS-terminate).
        - protocol: TCP
          port: 8081
        # pdns4-shim's DNS NOTIFY/SOA backend (UDPRoute -> Service dns/53 ->
        # pod's real containerPort 10053, not 53 -- same post-DNAT
        # convention as the TCP rules above). Confirmed live 2026-09-09:
        # without this, the UDPRoute path times out identically to the
        # earlier missing-8081 gap on the HTTPS path -- Envoy's proxy pod
        # can't originate the packet to pdns4-shim's pod at all.
        - protocol: UDP
          port: 10053
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
---
# The certgen Job's pods carry no labels the controller policy selects, so
# under default-deny (ADR-17) the job cannot reach the apiserver to write
# its TLS secrets (found at controlplane bring-up; latent on any fresh
# cluster). Namespace-wide apiserver+DNS egress is additive and safe: this
# namespace only runs envoy-gateway components.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-gateway-system-apiserver-allow
  namespace: envoy-gateway-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
        # apiserver targetPort — Calico evaluates egress post-DNAT
        # (docs/memory/calico-networkpolicy-dnat.md)
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
