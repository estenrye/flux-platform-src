apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: seaweedfs-db-backup
  namespace: seaweedfs
spec:
  # Staggered from the controlplane clusters (03:00, 03:15, 03:30).
  schedule: "0 45 3 * * *"
  backupOwnerReference: self
  cluster:
    name: seaweedfs-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  target: primary
  immediate: true
