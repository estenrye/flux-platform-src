apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: seaweedfs-db-barman
  namespace: seaweedfs
spec:
  configuration:
    destinationPath: s3://seaweedfs-db-barman/
    # TODO: replace CF_ACCOUNT_ID with the Cloudflare account id; it is the
    # "endpoint" field of the cloudflare-r2-seaweedfs-db-barman 1Password item.
    endpointURL: https://CF_ACCOUNT_ID.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId:
        name: seaweedfs-db-barman-credentials
        key: access-key-id
      secretAccessKey:
        name: seaweedfs-db-barman-credentials
        key: secret-access-key
      region:
        name: seaweedfs-db-barman-credentials
        key: region
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: "30d"
