# R2 credentials minted by .bin/provision-cloudflare-r2-bucket.sh, which
# stores them in the 1Password item cloudflare-r2-<bucket> (vault core-infra).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-db-barman-credentials
  namespace: seaweedfs
spec:
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  target:
    name: seaweedfs-db-barman-credentials
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      data:
        access-key-id: "{{ .accessKeyId }}"
        secret-access-key: "{{ .secretAccessKey }}"
        # R2 ignores the region but barman's S3 client requires one.
        region: auto
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: cloudflare-r2-seaweedfs-db-barman/access-key-id
    - secretKey: secretAccessKey
      remoteRef:
        key: cloudflare-r2-seaweedfs-db-barman/secret-access-key
