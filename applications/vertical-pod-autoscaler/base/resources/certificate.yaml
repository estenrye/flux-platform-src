apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vpa-admission-controller
spec:
  secretName: vpa-admission-controller-tls
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: vertical-pod-autoscaler-selfsigned-issuer
  dnsNames:
    - vpa-webhook.kube-system.svc
    - vpa-webhook.kube-system.svc.cluster.local
  subject:
    organizationalUnits:
      - vertical-pod-autoscaler
  isCA: false
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
