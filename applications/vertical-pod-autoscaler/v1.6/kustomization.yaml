# VPA 1.6.0 — supports Kubernetes 1.34 – 1.36.
# Built from the static manifests published with the upstream release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Upstream hardcodes kube-system; this sets it explicitly for every namespaced resource.
namespace: kube-system

resources:
  - https://raw.githubusercontent.com/kubernetes/autoscaler/vertical-pod-autoscaler-1.6.0/vertical-pod-autoscaler/deploy/vpa-v1-crd-gen.yaml
  - https://raw.githubusercontent.com/kubernetes/autoscaler/vertical-pod-autoscaler-1.6.0/vertical-pod-autoscaler/deploy/vpa-rbac.yaml
  - https://raw.githubusercontent.com/kubernetes/autoscaler/vertical-pod-autoscaler-1.6.0/vertical-pod-autoscaler/deploy/admission-controller-deployment.yaml
  - https://raw.githubusercontent.com/kubernetes/autoscaler/vertical-pod-autoscaler-1.6.0/vertical-pod-autoscaler/deploy/admission-controller-service.yaml
  - https://raw.githubusercontent.com/kubernetes/autoscaler/vertical-pod-autoscaler-1.6.0/vertical-pod-autoscaler/deploy/recommender-deployment.yaml
  - https://raw.githubusercontent.com/kubernetes/autoscaler/vertical-pod-autoscaler-1.6.0/vertical-pod-autoscaler/deploy/updater-deployment.yaml

components:
  - ../base

# Pinned by digest, as elsewhere in this repo.
images:
  - name: registry.k8s.io/autoscaling/vpa-admission-controller
    newTag: 1.6.0
    digest: sha256:80e487edff0202b657afccac35db68c06e964cb8568c75bdfe1f6363e69a0781
  - name: registry.k8s.io/autoscaling/vpa-recommender
    newTag: 1.6.0
    digest: sha256:4af365370c187e4eb60302e937b18a188774698b049a1bfdd77d43e51b30abec
  - name: registry.k8s.io/autoscaling/vpa-updater
    newTag: 1.6.0
    digest: sha256:b39d1dfa19cb3f8b02454ec9c5c560e4266602f322623d5d3cfd5351be0c4f7b
