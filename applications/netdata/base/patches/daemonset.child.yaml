apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netdata-child
  namespace: netdata
  annotations:
    ignore-check.kube-linter.io/no-node-affinity: No zone or role topology to express node affinity against.
    ignore-check.kube-linter.io/no-read-only-root-fs: Netdata writes its config, cache and runtime state under /etc/netdata, /var/lib/netdata and /var/cache/netdata inside the container.
    ignore-check.kube-linter.io/writable-host-mount: Netdata needs /sys, /etc/os-release, /var/log and its persistence directory mounted from the host; the chart does not offer read-only mounts for these.
    ignore-check.kube-linter.io/run-as-non-root: The child agent runs as root to read host process, cgroup and network data.
    ignore-check.kube-linter.io/privilege-escalation-container: The child agent requires SYS_ADMIN and SYS_PTRACE to read host process, cgroup and network data.
    ignore-check.kube-linter.io/sensitive-host-mounts: The child agent monitors the node via /proc, /sys and the host root filesystem.
    ignore-check.kube-linter.io/host-ipc: The child agent shares the host IPC namespace to monitor host IPC resources.
    ignore-check.kube-linter.io/host-network: The child agent uses host networking to collect node network metrics.
    ignore-check.kube-linter.io/host-pid: The child agent shares the host PID namespace to monitor host processes (apps.plugin).
    ignore-check.kube-linter.io/drop-net-raw-capability: The chart does not drop NET_RAW; Netdata's network probes may rely on it.
    checkov.io/skip1: CKV_K8S_22=Netdata writes its config, cache and runtime state inside the container; the root filesystem cannot be read-only.
    checkov.io/skip2: CKV_K8S_38=The netdata service account token is required to discover pods and services and to read Kubernetes state.
    checkov.io/skip3: CKV_K8S_35=Netdata only reads the Netdata Cloud claim token from environment variables (NETDATA_CLAIM_TOKEN / NETDATA_CLAIM_ROOMS), sourced from the netdata-claim Secret synced by ESO.
    checkov.io/skip4: CKV_K8S_40=Netdata's image does not support a configurable high UID; the container's user is set by the upstream image.
    checkov.io/skip5: CKV_K8S_23=The netdata container starts as root so its entrypoint can fix ownership of its state directories.
    checkov.io/skip6: CKV_K8S_20=Netdata's entrypoint requires root; allowPrivilegeEscalation is not set to false by the chart.
    checkov.io/skip7: CKV_K8S_28=The chart does not drop NET_RAW; Netdata's network probes (e.g. fping) may rely on it.
    checkov.io/skip8: CKV_K8S_37=The chart does not drop capabilities; Netdata's plugins rely on defaults.
    checkov.io/skip9: CKV_K8S_30=The chart does not set a container security context.
    checkov.io/skip10: CKV_K8S_31=The chart does not set a seccomp profile.
    checkov.io/skip11: CKV_K8S_29=The chart does not set a pod security context for the child DaemonSet.
    checkov.io/skip12: CKV_K8S_17=The child agent shares the host PID namespace to monitor host processes (apps.plugin).
    checkov.io/skip13: CKV_K8S_18=The child agent shares the host IPC namespace to monitor host IPC resources.
    checkov.io/skip14: CKV_K8S_19=The child agent uses host networking to collect node network metrics.
    checkov.io/skip15: CKV_K8S_25=The child agent adds SYS_PTRACE and SYS_ADMIN to read host process and cgroup data.
    checkov.io/skip16: CKV_K8S_39=The child agent requires CAP_SYS_ADMIN to read host cgroup and network namespace data.
    ignore-check.kube-linter.io/sorted-keys: Annotation keys include checkov.io/skip10+, which sort before skip2; the skip annotations are numbered sequentially.
spec:
  template:
    spec:
      initContainers:
      - name: init-persistence
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
