apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netdata-claim
  namespace: netdata
spec:
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  target:
    name: netdata-claim
    creationPolicy: Owner
    deletionPolicy: Delete
  # Consumed via envFrom by both the parent Deployment and the child DaemonSet.
  data:
    - secretKey: NETDATA_CLAIM_TOKEN
      remoteRef:
        key: netdata-claim/credential
    - secretKey: NETDATA_CLAIM_ROOMS
      remoteRef:
        key: netdata-claim/room_id
