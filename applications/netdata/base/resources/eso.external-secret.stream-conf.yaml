# Netdata streaming API key shared by the parent (receiver) and the child and
# k8s-state agents (senders). The UUID is generated once -- CreatedOnce keeps
# it stable across refreshes -- and rendered into both stream.conf variants,
# which are mounted over the chart's (disabled) stream configs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netdata-stream-conf
  namespace: netdata
spec:
  refreshPolicy: CreatedOnce
  target:
    name: netdata-stream-conf
    creationPolicy: Owner
    template:
      data:
        parent.conf: |
          [{{ .uuid }}]
            enabled = yes
            history = 3600
            default memory mode = dbengine
            health enabled by default = auto
            allow from = *
        sender.conf: |
          [stream]
            enabled = yes
            destination = netdata:19999
            api key = {{ .uuid }}
            timeout seconds = 60
            buffer size bytes = 1048576
            reconnect delay seconds = 5
            initial clock resync iterations = 60
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: UUID
          name: netdata-stream-key
