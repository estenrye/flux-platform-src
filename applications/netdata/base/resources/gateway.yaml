apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: netdata
  namespace: netdata
  annotations:
    # cert-manager's Gateway API shim (config.enableGatewayAPI is on) creates
    # the Certificate for the https listener's certificateRef.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: external-dedicated
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: netdata.example
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: netdata-tls
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
