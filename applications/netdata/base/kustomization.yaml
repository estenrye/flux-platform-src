apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: netdata

helmCharts:
  - name: netdata
    repo: https://netdata.github.io/helmchart/
    version: 3.7.177
    releaseName: netdata
    namespace: netdata
    includeCRDs: true
    valuesFile: values.yaml

resources:
  - resources/namespace.yaml
  - resources/gateway.yaml
  - resources/eso.external-secret.claim.yaml
  - resources/eso.uuid-generator.stream-key.yaml
  - resources/eso.external-secret.stream-conf.yaml
  - resources/network-policy.yaml
  - resources/vpa.yaml

patches:
  - path: patches/daemonset.child.yaml
  - path: patches/deployment.parent.yaml
  - path: patches/deployment.k8s-state.yaml
  - path: patches/deployment.otel.yaml
  - path: patches/clusterrolebinding.yaml

images:
  # Digest-pinned for reproducibility (ADR-13). v2.12.2 fixes the remote code
  # execution flaw in v2.12.1 (https://status.netdata.cloud/incidents/d17pqkt1s8rr)
  # and is what chart 3.7.177 (appVersion v2.12.2) ships, so this is no longer an
  # override of an older chart default.
  #
  # Do not pin the digest of `latest`: on Docker Hub `latest` and `edge` are the
  # nightly build. Renovate did that on 2026-10-28 (#224) and the whole fleet ran
  # v2.12.0-307-nightly until this was restored.
  - name: netdata/netdata
    newTag: v2.12.2
    digest: sha256:3d00de3756e1e9150c6121080934168ab5f2ceffce6d494573316c09c18adf83
  # Init container. alpine 3.24, the build that was already running; the chart
  # default is 3.22 (values.yaml says 3.24 to match).
  - name: alpine
    newTag: "3.24"
    digest: sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
