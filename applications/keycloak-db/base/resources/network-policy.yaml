apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-db
  namespace: keycloak
  annotations:
    ignore-check.kube-linter.io/dangling-networkpolicy: "CNPG creates PostgreSQL pods dynamically; the cnpg.io/cluster label is valid but pods do not exist in the static rendered manifest."
    ignore-check.kube-linter.io/dangling-networkpolicypeer-podselector: "CNPG creates PostgreSQL pods dynamically; the cnpg.io/cluster label is valid but pods do not exist in the static rendered manifest."
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: keycloak-db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # M3 step 9b: Keycloak server pods connecting to Postgres. Label is a
    # placeholder matching the common Keycloak Helm chart convention
    # (app.kubernetes.io/name: keycloak) -- verify/adjust once that chart
    # is actually vendored, same as openbao-db's equivalent rule.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: keycloak-db
      ports:
        - protocol: TCP
          port: 5432
    # Metrics scrape from the OpenTelemetry collector daemonset (PodMonitor).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otelcol-ds-collector
      ports:
        - protocol: TCP
          port: 9187
  egress:
    # apiserver targetPort -- Calico evaluates egress post-DNAT
    # (docs/memory/calico-networkpolicy-dnat.md). Talos serves 6443.
    - ports:
        - protocol: TCP
          port: 6443
    # streaming replication to peer instances
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: keycloak-db
      ports:
        - protocol: TCP
          port: 5432
    # barman WAL archiving / base backups and STS token exchange: SeaweedFS
    # filer-embedded S3 gateway.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs
          podSelector:
            matchLabels:
              app.kubernetes.io/name: seaweedfs
              app.kubernetes.io/component: filer
      ports:
        - protocol: TCP
          port: 8333
    - ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
