apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitea-runner

resources:
  - resources/namespace.yaml
  - resources/eso.external-secret.registration-token.yaml
  - resources/network-policy.yaml
  - resources/eso.external-secret.scaler-token.yaml
  - resources/trigger-authentication.yaml
  - resources/scaledjob.yaml
  - resources/eso.external-secret.cache.yaml
  - resources/eso.external-secret.harbor.yaml
  - resources/cache-server.yaml
  - resources/eso.external-secret.cleaner-token.yaml
  - resources/cleaner.cronjob.yaml
  - resources/device-plugin.daemonset.yaml

# The ScaledJob's pod template is inside a custom resource, so kustomize cannot
# rewrite the ConfigMap names it references to the hashed ones.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: gitea-runner-config
    files:
      - config.yaml=resources/config.yaml
  # Sub-ID ranges for rootless dockerd inside the pod's user namespace.
  - name: gitea-runner-subid
    files:
      - subuid=resources/subuid
      - subgid=resources/subgid

images:
  - name: docker.io/library/python
    newTag: 3.14-alpine
    digest: sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
  # newTag + digest: Renovate follows the image by version.
  - name: docker.io/gitea/runner
    newTag: 6.0.0
    digest: sha256:f9a1f17484398b861c25a763b81febfb394b17b72e0522c25d8067d7b484f347
  - name: docker.io/library/docker
    newTag: 29.9.3-dind-rootless
    digest: sha256:707a099b8ddd86306eb28c8b1775264a3ee0135b16dc505b7b48ffb328edf8d0
  - name: docker.io/squat/generic-device-plugin
    newTag: f7c3291
    digest: sha256:8dc84958301f054bf72d9753a7a2c9af3d6642a9844b34d1171b3f2cdb4a15f6
