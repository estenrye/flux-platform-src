apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitea-runner

resources:
  - resources/namespace.yaml
  - resources/eso.external-secret.registration-token.yaml
  - resources/network-policy.yaml
  - resources/statefulset.yaml

configMapGenerator:
  - name: gitea-runner-config
    files:
      - config.yaml=resources/config.yaml

images:
  # newTag + digest: Renovate follows the image by version.
  - name: docker.io/gitea/act_runner
    newTag: 0.6.1
    digest: sha256:b5c35d6bdbb9bb25e531230bfc7cc663cb751406cbec90a2a891b85fea54de86
  - name: docker.io/library/docker
    newTag: 29.9.3-dind
    digest: sha256:7bf70dcb85c822e3fa6f2d332143e474b99147b9d7b39102b0cfe8b04a7dd61b
