# Instance-wide runner registration token. Generate it once on the Gitea pod
#   gitea actions generate-runner-token
# and store it in 1Password (core-infra vault, item gitea-runner-registration,
# field token). Every ephemeral runner pod registers with it, takes one job and
# is deregistered by Gitea afterwards.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-runner-registration
  namespace: gitea-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: gitea-runner-registration
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: gitea-runner-registration/token
