apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: gitea-runner
  namespace: gitea-runner
  annotations:
    ignore-check.kube-linter.io/no-node-affinity: "Homelab cluster; no zone or role topology to express affinity against."
    ignore-check.kube-linter.io/minimum-three-replicas: "CI capacity, not an availability tier; two runners."
    ignore-check.kube-linter.io/no-read-only-root-fs: "The Docker daemon writes under /var/lib/docker and act_runner under /data."
    ignore-check.kube-linter.io/env-value-from: "The registration token comes from the ESO-managed gitea-runner-registration Secret."
    ignore-check.kube-linter.io/read-secret-from-env-var: "act_runner reads its registration token from the environment on first start."
    ignore-check.kube-linter.io/privilege-escalation-container: "Rootless dockerd needs newuidmap/newgidmap (file capabilities), which need allowPrivilegeEscalation; the container is neither privileged nor root on the node (hostUsers: false)."
    ignore-check.kube-linter.io/unsafe-proc-mount: "Rootless dockerd writes /proc/sys in its own network namespace. Unmasked /proc is only allowed with hostUsers: false, so it is scoped to a pod user namespace."
    ignore-check.kube-linter.io/no-liveness-probe: "Runner and daemon exit on failure and are restarted."
    ignore-check.kube-linter.io/no-readiness-probe: "Nothing sends traffic to a runner."
    checkov.io/skip01: "CKV_K8S_35=act_runner reads its registration token from the environment on first start."
    checkov.io/skip03: "CKV_K8S_11=Memory limits are set; CPU limits only throttle builds."
    checkov.io/skip04: "CKV_K8S_22=Rootless dockerd and act_runner write to their home and data volumes."
    checkov.io/skip17: "CKV_K8S_25=Rootless dockerd needs CAP_SETUID and CAP_SETGID."
    checkov.io/skip12: "CKV_K8S_20=Rootless dockerd needs newuidmap/newgidmap, which need allowPrivilegeEscalation."
    checkov.io/skip13: "CKV_K8S_28=Rootless dockerd needs CAP_SETUID and CAP_SETGID for newuidmap/newgidmap."
    checkov.io/skip14: "CKV_K8S_30=Rootless dockerd needs Unconfined seccomp/AppArmor and an unmasked /proc, which requires hostUsers: false."
    checkov.io/skip15: "CKV_K8S_31=Rootless dockerd needs an Unconfined seccomp profile."
    checkov.io/skip16: "CKV_K8S_40=UID 1000 is the upstream rootless Docker user."
    checkov.io/skip06: "CKV_K8S_15=Images are pinned by digest."
    checkov.io/skip10: "CKV_K8S_8=Runner and daemon exit on failure and are restarted."
    checkov.io/skip11: "CKV_K8S_9=Nothing sends traffic to a runner."
spec:
  pollingInterval: 10
  maxReplicaCount: 4
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  # "accurate" subtracts pods that are still starting, so a slow cold start does
  # not make the next poll create another pod for the same queued job.
  scalingStrategy:
    strategy: accurate
  triggers:
    # Queued Actions jobs, from the Gitea admin API.
    - type: metrics-api
      metadata:
        url: http://gitea-http.gitea.svc.cluster.local:3000/api/v1/admin/actions/jobs?status=queued
        valueLocation: total_count
        targetValue: "1"
        authMode: bearer
      authenticationRef:
        name: gitea-runner-scaler
  jobTargetRef:
    backoffLimit: 0
    # Backstop for a runner that never gets a job (another pod took it) or hangs.
    activeDeadlineSeconds: 10800
    ttlSecondsAfterFinished: 300
    template:
      metadata:
        labels:
          app.kubernetes.io/name: gitea-runner
      spec:
        priorityClassName: application
        automountServiceAccountToken: false
        # Own user namespace: root in the pod is an unprivileged UID on the node.
        # Required for procMount: Unmasked below (rootless dockerd writes /proc/sys).
        hostUsers: false
        # Only the rootless pool has user.max_user_namespaces raised and the TUN
        # device plugin: pcd-ce-deploy tofu-pcd-talos-cluster/rootless_test_node.tf.
        nodeSelector:
          pool: rootless-test
        tolerations:
          - key: pool
            operator: Equal
            value: rootless-test
            effect: NoSchedule
        # One job per pod; the Job controller replaces it, not the kubelet.
        restartPolicy: Never
        terminationGracePeriodSeconds: 20
        # Jobs from every repo run here, so spread the runners over nodes.
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: gitea-runner
        securityContext:
          fsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        initContainers:
          - name: docker
            image: docker.io/library/docker
            imagePullPolicy: IfNotPresent
            # Native sidecar: the runner container starts only after the startup probe
            # passes, so it no longer crash-restarts while dockerd comes up.
            restartPolicy: Always
            # Rootless Docker-in-Docker with IPv6. The nodes are IPv6-only behind
            # DNS64/NAT64, so job containers need IPv6 addresses (an IPv4-only host
            # resolves to 64:ff9b::/96). slirp4netns (--ipv6) gives the daemon's
            # network namespace an IPv6 address but no default route, so one is added
            # (and re-asserted) through nsenter. The default bridge and the
            # `gitea-actions` network (act_runner's container.network) are dual-stack
            # ULA /64s that ip6tables masquerades. --dns=fd00::3 is slirp4netns' IPv6
            # DNS forwarder: by default Docker's embedded resolver also tries 10.0.2.3
            # first, which cannot reach the (IPv6-only) pod resolver and costs every
            # lookup a 5 s timeout. Tested on the pool's node with github.com (NAT64),
            # a native-IPv6 and an IPv6-only site.
            command:
              - sh
              - -c
              - |
                dockerd-entrypoint.sh --ipv6 --ip6tables --fixed-cidr-v6=fd00:d0c:a::/64 --dns=fd00::3 &
                pid=$!
                export DOCKER_HOST=unix:///run/user/1000/docker.sock
                until docker info >/dev/null 2>&1; do sleep 1; done
                route() {
                  nsenter -t "$(pgrep -x dockerd | head -1)" -U -n --preserve-credentials \
                    ip -6 route replace default via fd00::2 dev tap0
                }
                route
                docker network inspect gitea-actions >/dev/null 2>&1 || \
                  docker network create --ipv6 --subnet fd00:d0c:b::/64 gitea-actions
                # Re-assert the route every 30s.
                while kill -0 "$pid" 2>/dev/null; do sleep 30; route || true; done
                wait "$pid"
            env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
              - name: DOCKERD_ROOTLESS_ROOTLESSKIT_FLAGS
                value: --ipv6
            securityContext:
              allowPrivilegeEscalation: true
              procMount: Unmasked
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              # newuidmap/newgidmap carry file capabilities and need these two in the
              # bounding set; nothing else is granted.
              capabilities:
                drop: ["ALL"]
                add: ["SETUID", "SETGID"]
              seccompProfile:
                type: Unconfined
              appArmorProfile:
                type: Unconfined
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
                ephemeral-storage: 5Gi
              limits:
                # slirp4netns needs /dev/net/tun, exposed by the device plugin
                # (resources/device-plugin.daemonset.yaml).
                devic.es/tun: "1"
                memory: 6Gi
                ephemeral-storage: 30Gi
            volumeMounts:
              - name: docker-run
                mountPath: /run/user/1000
              # One level above docker/: the emptyDir root is not owned by UID 1000
              # and dockerd chmods its data dir.
              - name: docker-data
                mountPath: /home/rootless/.local/share
              # The user namespace has 65536 IDs; the image's 100000:65536 does not fit.
              - name: subid
                mountPath: /etc/subuid
                subPath: subuid
                readOnly: true
              - name: subid
                mountPath: /etc/subgid
                subPath: subgid
                readOnly: true
            startupProbe:
              exec:
                command:
                  - docker
                  - -H
                  - unix:///run/user/1000/docker.sock
                  - network
                  - inspect
                  - gitea-actions
              periodSeconds: 2
              timeoutSeconds: 5
              failureThreshold: 90
        containers:
          - name: runner
            image: docker.io/gitea/act_runner
            imagePullPolicy: IfNotPresent
            # act_runner has no idle timeout. KEDA can start a second pod while the
            # first is still claiming the (still queued) job; that pod would idle until
            # activeDeadlineSeconds. Exit cleanly if no task arrives within 5 minutes.
            command:
              - /sbin/tini
              - --
              - bash
              - -c
              - |
                touch /data/runner.log
                /opt/act/run.sh >>/data/runner.log 2>&1 &
                pid=$!
                tail -f /data/runner.log &
                ( sleep 300
                  if ! grep -q ' repo is ' /data/runner.log; then
                    echo "no job within 300s, exiting" >> /data/runner.log
                    touch /data/idle
                    kill "$pid"
                  fi ) &
                wait "$pid"; rc=$?
                [ -e /data/idle ] && exit 0
                exit "$rc"
            env:
              - name: GITEA_INSTANCE_URL
                value: http://gitea-http.gitea.svc.cluster.local:3000
              - name: GITEA_RUNNER_REGISTRATION_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: gitea-runner-registration
                    key: token
              # One job, then the runner deregisters itself and the pod exits.
              - name: GITEA_RUNNER_EPHEMERAL
                value: "true"
              - name: GITEA_RUNNER_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: CONFIG_FILE
                value: /config/config.yaml
              # UID 1000 has no passwd entry in this image, so HOME would be /: the action
              # cache (/.cache/act) and the cache server could not be created.
              - name: HOME
                value: /data
              - name: DOCKER_HOST
                value: unix:///run/user/1000/docker.sock
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi
            volumeMounts:
              - name: data
                mountPath: /data
              - name: config
                mountPath: /config
                readOnly: true
              - name: docker-run
                mountPath: /run/user/1000
        volumes:
          - name: config
            configMap:
              name: gitea-runner-config
          - name: subid
            configMap:
              name: gitea-runner-subid
          - name: docker-run
            emptyDir:
              sizeLimit: 16Mi
          # Nothing survives the job: image layers, build cache and the workspace are
          # discarded with the pod, so no job sees another's state.
          - name: docker-data
            emptyDir:
              sizeLimit: 30Gi
          - name: data
            emptyDir:
              sizeLimit: 2Gi
