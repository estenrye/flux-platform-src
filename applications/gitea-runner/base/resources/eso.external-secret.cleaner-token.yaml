# Gitea access token (scope write:admin, name runner-cleaner, owner gitea_admin)
# for the cleaner CronJob that deletes offline ephemeral runner records. Stored in
# 1Password (core-infra vault, item gitea-runner-cleaner, field token). Only the
# cleaner pod mounts it; runner pods never see it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-runner-cleaner
  namespace: gitea-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: gitea-runner-cleaner
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: gitea-runner-cleaner/token
