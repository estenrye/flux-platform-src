# What the runners need to pull job images through Harbor
# (applications/harbor, docs/runbooks/harbor.md):
#   config.json  registry login for the read-only robot robot$runner-pull
#                (1Password core-infra/harbor-robot-runner, field secret)
#   ca.crt       the CA of harbor.harbor.svc.cluster.local
#                (1Password core-infra/harbor-ca, field ca.crt)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-runner-harbor
  namespace: gitea-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: gitea-runner-harbor
    creationPolicy: Owner
    template:
      data:
        config.json: |-
          {"auths":{"harbor.harbor.svc.cluster.local":{"auth":"{{ printf "robot$runner-pull:%s" .robotSecret | b64enc }}"}}}
        ca.crt: "{{ .caCrt }}"
  data:
    - secretKey: robotSecret
      remoteRef:
        key: harbor-robot-runner/secret
    - secretKey: caCrt
      remoteRef:
        key: harbor-ca/ca.crt
