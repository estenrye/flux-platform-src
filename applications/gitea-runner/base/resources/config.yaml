log:
  level: info
runner:
  file: /data/.runner
  capacity: 1
  timeout: 3h
  # `uses: owner/repo@ref` is cloned from github.com by default (slow, per job, over
  # NAT64). Rewrite it to the in-cluster Gitea, which holds pull mirrors of the actions
  # we use (orgs actions, docker, dtolnay, Swatinem, golangci, goreleaser, azure, helm,
  # pypa, astral-sh; docs/runbooks/gitea.md). An action that is not mirrored fails to
  # resolve: mirror it first, or use a full URL.
  github_mirror: http://gitea-http.gitea.svc.cluster.local:3000
  fetch_timeout: 5s
  fetch_interval: 2s
  labels:
    # Job images come through Harbor's proxy-cache project `gitea` (docker.gitea.com);
    # dockerd trusts its CA and the runner logs in with the read-only robot
    # (resources/eso.external-secret.harbor.yaml).
    - "ubuntu-latest:docker://harbor.harbor.svc.cluster.local/gitea/runner-images:ubuntu-latest"
    - "ubuntu-24.04:docker://harbor.harbor.svc.cluster.local/gitea/runner-images:ubuntu-24.04"
    - "ubuntu-22.04:docker://harbor.harbor.svc.cluster.local/gitea/runner-images:ubuntu-22.04"
cache:
  enabled: true
  # The runner's local cache endpoint (it forwards to the shared server below). Node's HTTP
  # client cannot dial an http://[ipv6]:port URL (getaddrinfo ENOTFOUND [fd00:...]), so jobs
  # reach it by name; container.options maps the name to the pod's address at start.
  host: runner-cache.internal
  # Shared server (resources/cache-server.yaml). The secret is substituted into a copy of
  # this file at pod start (scaledjob.yaml) so it stays out of the ConfigMap.
  external_server: http://gitea-runner-cache.gitea-runner.svc.cluster.local:8088/
  external_secret: __CACHE_SECRET__
container:
  # Dual-stack bridge created by the docker sidecar (scaledjob.yaml).
  network: gitea-actions
  privileged: false
  options: --add-host=runner-cache.internal:__POD_IP__
  workdir_parent:
  valid_volumes: []
  docker_host: ""
  force_pull: false
  force_rebuild: false
