# Gitea access token (scope read:admin, name keda-runner-scaler, owner gitea_admin)
# that the KEDA ScaledJob uses to count queued Actions jobs. Stored in 1Password
# (core-infra vault, item gitea-runner-scaler, field token). Rotate by creating a
# new token in Gitea and updating the item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-runner-scaler
  namespace: gitea-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: gitea-runner-scaler
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: gitea-runner-scaler/token
