# Shared secret between the runners and the cache server (cache.external_secret).
# 1Password: core-infra vault, item gitea-runner-cache, field secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-runner-cache
  namespace: gitea-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: gitea-runner-cache
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: gitea-runner-cache/secret
