# applications/crossplane-resources/xunifinetwork/examples/vlan179-bgp.yaml
#
# NOT YET APPLIED via kubectl (2026-09-08): see the matching note in
# ../../xnetworksegment/examples/vlan179-bgp.yaml. The UniFi network
# object this claim describes gets created manually via a standalone
# `tofu apply` against the `filipowm/unifi` provider instead. This file
# is the accurate declarative record of that manual state -- apply it for
# real once a working kubeconfig is available.
apiVersion: platform.rye.ninja/v1alpha1
kind: XUnifiNetwork
metadata:
  name: vlan179-bgp
  labels:
    rye.ninja/component: xunifinetwork
    rye.ninja/owner: platform-engineering
    platform.rye.ninja/unifi-network-name: vlan179-bgp
spec:
  vlanId: 179
  infraSubnet: "fd97:45c2:b3a1:179::/64"
  ipv4Subnet: "10.179.0.1/16" # UniFi requires an IPv4 subnet to claim router ownership; DHCP stays disabled, nothing ever gets a lease.
  # firewallZone left at default (DMZ-Kubernetes) -- same zone VLAN 100 and
  # VLAN 64 are already in (docs/memory/unifi-zone-firewall.md).
