apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: crossplane-xnetworksegment
  description: |-
    XNetworkSegment XRD + network-segment-kvm-unifi Composition. Gives a
    talos-kvm cluster its own VLAN-tagged bridge (Ansible, on the KVM host).
    Cluster-scoped (not namespaced) so its Composition can compose
    ansible.crossplane.io's cluster-scoped AnsibleRun -- XKubernetesCluster
    (namespaced) references a claim of this kind by name (spec.vlanRef)
    rather than composing it directly. Optionally references a separate
    XUnifiNetwork claim (spec.unifiNetworkRef) for the matching UniFi
    network/VLAN object -- split out 2026-08-06 so a segment reusing an
    already-existing UniFi network (e.g. VLAN 100) doesn't need one at all,
    and so a future non-UniFi backend can exist as a sibling XRD. Exists
    because sharing a physical bridge between clusters (via a nested,
    off-link static route -- not simply sharing the VLAN itself) triggers
    ICMPv6 Redirect hairpin routing that silently breaks the Talos API's
    TLS handshake -- see docs/memory/m4-step-tracker.md.
  tags:
    - crossplane
    - crossplane-resource
    - kvm
    - unifi
    - networking
  links:
    - url: https://docs.crossplane.io/latest/composition/composite-resource-definitions/
      title: Crossplane Composite Resource Definitions
      icon: docs
      type: documentation
spec:
  type: service
  lifecycle: production
  owner: platform-engineering
