apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: network-segment-kvm-unifi
  labels:
    substrate: kvm-unifi
spec:
  compositeTypeRef:
    apiVersion: platform.rye.ninja/v1alpha1
    kind: XNetworkSegment

  mode: Pipeline
  pipeline:
  - step: environmentConfigs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Reference
          ref:
            name: platform-kvm-hosts

  - step: create-bridge-and-vlan
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{ $name := .observed.composite.resource.metadata.name }}
          {{ $vlanId := .observed.composite.resource.spec.vlanId }}
          {{ $infraSubnet := .observed.composite.resource.spec.infraSubnet }}
          {{ $ipv4Subnet := .observed.composite.resource.spec.ipv4Subnet }}
          {{ $environment := index .context "apiextensions.crossplane.io/environment" }}
          {{ $bridgeName := printf "br%d" (int $vlanId) }}

          {{ if $environment.hosts }}
          {{ $host := index $environment.hosts 0 }}
          ---
          apiVersion: ansible.crossplane.io/v1alpha1
          kind: AnsibleRun
          metadata:
            name: {{ $name }}-bridge
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: bridge
          spec:
            forProvider:
              inventoryInline: |
                {{ $host.fqdn }} ansible_host={{ $host.ula }} ansible_user=automation-user ansible_ssh_private_key_file=kvm-ssh-key ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
              # Deliberately not byte-identical to providers/kvm/ansible/
              # roles/bridge/tasks/main.yml -- that role uses real Jinja2
              # vars for standalone/reusable runs; here vlan_id/bridge_name
              # are substituted by THIS Go template instead. Go's
              # text/template and Jinja2 use the same double-brace marker
              # for their own expressions (confirmed the hard way: an
              # earlier version of THIS comment typed that marker out
              # literally as an example and broke the template it was
              # explaining -- "missing value for command" -- since Go
              # tokenizes the raw string before any YAML-comment awareness
              # exists). A Jinja2-parameterized playbook embedded verbatim
              # here would hit the identical problem for real. Same
              # accepted-drift tradeoff as talos-cluster's embedded
              # Terraform module vs. the real one.
              playbookInline: |
                - hosts: all
                  become: true
                  tasks:
                    - name: Write netplan config for {{ $bridgeName }}
                      ansible.builtin.copy:
                        dest: /etc/netplan/60-{{ $bridgeName }}.yaml
                        mode: "0600"
                        content: |
                          network:
                            version: 2
                            vlans:
                              bond0.{{ $vlanId }}:
                                id: {{ $vlanId }}
                                link: bond0
                            bridges:
                              {{ $bridgeName }}:
                                interfaces: ["bond0.{{ $vlanId }}"]
                      register: netplan_config
                    - name: Apply netplan
                      ansible.builtin.command:
                        cmd: netplan apply
                      when: netplan_config.changed
                      changed_when: true
            providerConfigRef:
              name: default
          ---
          apiVersion: tf.m.upbound.io/v1beta1
          kind: Workspace
          metadata:
            name: {{ $name }}-vlan
            # tf.m.upbound.io's Workspace is namespaced (that's the whole
            # point of the .m. group) -- XNetworkSegment itself is
            # cluster-scoped (xrd.yaml's spec.scope: Cluster) so there's
            # no namespace to implicitly inherit. Confirmed live 2026-08-04:
            # omitting this produced "an empty namespace may not be set
            # when a resource name is provided". crossplane-system matches
            # where every other Workspace/ProviderConfig in this repo
            # lives.
            namespace: crossplane-system
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: vlan
              crossplane.io/external-name: {{ $name }}-vlan
          spec:
            providerConfigRef:
              kind: ClusterProviderConfig
              name: unifi
            forProvider:
              source: Inline
              module: |
                terraform {
                  backend "kubernetes" {
                    secret_suffix     = "{{ $name }}-vlan"
                    namespace         = "crossplane-system"
                    in_cluster_config = true
                  }
                }

                # CORRECTED 2026-08-04, caught live: purpose was
                # "vlan-only" ("Third Party Gateway" in the UniFi UI) --
                # confirmed via the live `ryezone-labs-ipv6` (VLAN 100)
                # network's own stored config (`purpose: "corporate"`)
                # that vlan-only means UniFi does ONLY L2 switching for
                # that network, explicitly NOT L3 routing/RA, and expects
                # an external device to be the gateway. Nothing else was
                # positioned to fill that role, so ipv6_ra_enable below
                # was silently a no-op -- no RA was ever sent on this
                # VLAN. This matters beyond "more correct": Talos accepts
                # Router Advertisements by default on a host interface
                # (independent of the machine config's `dhcp: false`,
                # which only disables DHCP address assignment, not RA
                # processing -- images/docker/talos-cluster-bootstrap/
                # bootstrap.sh's rendered machine config has no explicit
                # `::/0` route at all, relying entirely on RA for a
                # default route, same as controlplane's own nodes). With
                # no RA being sent, the nodes had no default route and
                # could not reply to anything outside their own /64 --
                # the concrete cause of the bootstrap Job's connection
                # timeouts, not just a config-hygiene issue.
                #
                # ipv6_interface_type stays "static" (not "pd" like
                # vlan100) rather than replicating vlan100's exact
                # structure (GUA via PD as the primary interface, ULA as
                # a secondary "ipv6_aliases" entry) -- confirmed live that
                # filipowm/unifi's Terraform provider exposes no
                # alias-equivalent resource at all (checked every
                # resource in its docs), so exact replication isn't
                # achievable via Terraform. This network's whole purpose
                # is ULA-based (infraSubnet, node ULAs, apiserverVip --
                # nothing here uses GUA), and controlplane's own running
                # nodes prove a cluster needs no GUA/direct v6 egress at
                # all (same dhcp:false/ULA-only/NAT64-route-only pattern
                # in .bin/create-controlplane-cluster.sh), so skipping PD
                # for this segment is a deliberate scope choice, not a
                # gap being silently accepted.
                #
                # CORRECTED 2026-08-04, caught live (2nd round): purpose
                # "corporate" alone was necessary but not sufficient --
                # the UniFi UI still showed this network's Router as
                # "Third-party Gateway" after that fix, and no RA/dnsmasq
                # process ever started for br200. Confirmed by comparing
                # every network in the live UI: every one showing a real
                # router (usmnblm01.rye.ninja) has an IPv4 `subnet`
                # populated -- including vlan100/vlan101, which are
                # otherwise unused for cluster IPv4 traffic (DHCP: None)
                # -- and this was the only network with no IPv4 subnet at
                # all. UniFi's network-ownership/routing model is
                # IPv4-primary even for an IPv6-focused network: it
                # apparently won't claim router ownership (or start RA)
                # for a network with no IPv4 subnet object, regardless of
                # `purpose`.
                #
                # CORRECTED 2026-08-05, caught in review before merging:
                # the IPv4 subnet was originally derived from vlanId as a
                # "10.<vlanId>.0.1/16" string -- broke for any vlanId over
                # 255 (doesn't fit an IPv4 octet), and coupled two
                # decisions (802.1Q ID, IPv4 addressing) that don't have
                # to move together. Now an explicit, caller-supplied XR
                # spec field (xrd.yaml's ipv4Subnet) instead -- the caller
                # picks something that doesn't collide with anything else
                # in the UniFi network list, same as vlan100/vlan101's own
                # hand-picked, unused, DHCP-disabled IPv4 subnets.
                resource "unifi_network" "segment" {
                  name                = "{{ $name }}"
                  purpose             = "corporate"
                  vlan_id             = {{ $vlanId }}
                  subnet              = "{{ $ipv4Subnet }}"
                  dhcp_enabled        = false
                  ipv6_interface_type = "static"
                  ipv6_static_subnet  = "{{ $infraSubnet }}"
                  ipv6_ra_enable      = true
                }
          {{ end }}

  - step: status-update
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{ $vlanId := .observed.composite.resource.spec.vlanId }}
          {{ $bridgeReady := false }}
          {{ $vlanReady := false }}
          {{ if .observed.resources }}
            {{ range $rname, $resource := .observed.resources }}
              {{ if eq $rname "bridge" }}
                {{ range $cond := $resource.resource.status.conditions }}
                  {{ if and (eq $cond.type "Ready") (eq $cond.status "True") }}
                    {{ $bridgeReady = true }}
                  {{ end }}
                {{ end }}
              {{ end }}
              {{ if eq $rname "vlan" }}
                {{ range $cond := $resource.resource.status.conditions }}
                  {{ if and (eq $cond.type "Ready") (eq $cond.status "True") }}
                    {{ $vlanReady = true }}
                  {{ end }}
                {{ end }}
              {{ end }}
            {{ end }}
          {{ end }}
          ---
          apiVersion: platform.rye.ninja/v1alpha1
          kind: XNetworkSegment
          status:
            bridgeName: {{ printf "br%d" (int $vlanId) }}
            ready: {{ and $bridgeReady $vlanReady }}

  - step: auto-ready
    functionRef:
      name: function-auto-ready
