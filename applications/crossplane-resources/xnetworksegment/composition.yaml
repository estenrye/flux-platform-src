apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: network-segment-kvm-unifi
  labels:
    substrate: kvm-unifi
spec:
  compositeTypeRef:
    apiVersion: platform.rye.ninja/v1alpha1
    kind: XNetworkSegment

  mode: Pipeline
  pipeline:
  - step: environmentConfigs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Reference
          ref:
            name: platform-kvm-hosts

  - step: fetch-unifi-network
    functionRef:
      name: function-extra-resources
    input:
      apiVersion: extra-resources.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        extraResources:
          - kind: XUnifiNetwork
            apiVersion: platform.rye.ninja/v1alpha1
            into: XUnifiNetwork
            type: Selector
            selector:
              maxMatch: 1
              minMatch: 0
              matchLabels:
                - key: platform.rye.ninja/unifi-network-name
                  type: FromCompositeFieldPath
                  valueFromFieldPath: spec.unifiNetworkRef.name
                  fromFieldPathPolicy: Optional
            # Same pattern, and same unverified edge case, as
            # xkubernetescluster-composition's own fetch-network-segment
            # step: a claim with no unifiNetworkRef set means
            # valueFromFieldPath resolves to nothing and Optional drops
            # that label matcher entirely -- with only one label matcher
            # configured, an empty matchLabels list's actual match
            # semantics (matches nothing vs. matches everything) aren't
            # confirmed against a live reconcile yet. Only one
            # XUnifiNetwork is expected to exist at first, so an
            # overmatch would be low-impact even if it happens; re-check
            # this before a second XUnifiNetwork exists.

  - step: validate-unifi-network-match
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{ $vlanId := .observed.composite.resource.spec.vlanId }}
          {{ $unifiNetworkRef := .observed.composite.resource.spec.unifiNetworkRef }}
          {{ $networkFound := false }}
          {{ $vlanIdMatches := true }}
          {{ $problem := "" }}
          {{ if $unifiNetworkRef }}
            {{ $extraResources := index .context "apiextensions.crossplane.io/extra-resources" }}
            {{ if $extraResources }}
              {{ $networks := index $extraResources "XUnifiNetwork" }}
              {{ if and $networks (gt (len $networks) 0) }}
                {{ $networkFound = true }}
                {{ $network := index $networks 0 }}
                {{ if ne $vlanId $network.spec.vlanId }}
                  {{ $vlanIdMatches = false }}
                  {{ $problem = printf "vlanId %v does not match XUnifiNetwork %q's vlanId %v" $vlanId $unifiNetworkRef.name $network.spec.vlanId }}
                {{ end }}
              {{ end }}
            {{ end }}
          {{ end }}
          {{ $ok := and $networkFound $vlanIdMatches }}

          {{/* addresses vs. the referenced XUnifiNetwork's infraSubnet is
               NOT checked here -- that needs real CIDR-subset math, which
               isn't reliably expressible in this Go-template pipeline
               (confirmed live 2026-08-06: ansible.utils.in_network /
               in_any_network work correctly in provider-ansible's runtime,
               so that check lives in create-bridge's playbook instead, as
               a real ansible.builtin.assert -- see there). This step only
               covers vlanId (plain integer equality, no CIDR math needed)
               for fast, host-independent kubectl visibility before any
               AnsibleRun even executes. */}}
          {{ if $unifiNetworkRef }}
          ---
          apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
          kind: ClaimConditions
          conditions:
            - type: UnifiNetworkMatch
              status: {{ if $ok }}"True"{{ else }}"False"{{ end }}
              reason: {{ if $ok }}Matches{{ else if not $networkFound }}NetworkNotFound{{ else }}Mismatch{{ end }}
              message: {{ if $ok }}"vlanId matches the referenced XUnifiNetwork."{{ else if not $networkFound }}{{ printf "%q" (printf "No XUnifiNetwork found matching unifiNetworkRef %q." $unifiNetworkRef.name) }}{{ else }}{{ printf "%q" $problem }}{{ end }}
              target: CompositeAndClaim
          {{ end }}
          # This condition is informational only -- it does not currently
          # gate bridge creation (create-bridge below runs regardless of a
          # vlanId mismatch). Revisit if a real mismatch ever needs to
          # block rather than just be visible via `kubectl describe`.

  - step: create-bridge
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{ $name := .observed.composite.resource.metadata.name }}
          {{ $vlanId := .observed.composite.resource.spec.vlanId }}
          {{ $dhcp4 := .observed.composite.resource.spec.dhcp4 }}
          {{ $dhcp6 := .observed.composite.resource.spec.dhcp6 }}
          {{ $addresses := .observed.composite.resource.spec.addresses }}
          {{ $routes := .observed.composite.resource.spec.routes }}
          {{ $taggedVlan := .observed.composite.resource.spec.taggedVlan }}
          {{ $bondInterface := .observed.composite.resource.spec.bondInterface }}
          {{ $unifiNetworkRef := .observed.composite.resource.spec.unifiNetworkRef }}
          {{ $environment := index .context "apiextensions.crossplane.io/environment" }}
          {{ $bridgeName := printf "br%d" (int $vlanId) }}
          {{ if .observed.composite.resource.spec.bridgeName }}
            {{ $bridgeName = .observed.composite.resource.spec.bridgeName }}
          {{ end }}
          {{ $uplinkIface := printf "%s.%d" $bondInterface (int $vlanId) }}
          {{ if not $taggedVlan }}
            {{ $uplinkIface = $bondInterface }}
          {{ end }}

          {{/* Resolved here (not just in validate-unifi-network-match)
               because this is where it's actually enforced -- see the
               "Assert bridge addresses" task below. Empty string when
               unifiNetworkRef is unset or unresolved, which the task
               itself is gated on (no infraSubnet to check against). */}}
          {{ $unifiInfraSubnet := "" }}
          {{ if $unifiNetworkRef }}
            {{ $extraResources := index .context "apiextensions.crossplane.io/extra-resources" }}
            {{ if $extraResources }}
              {{ $networks := index $extraResources "XUnifiNetwork" }}
              {{ if and $networks (gt (len $networks) 0) }}
                {{ $network := index $networks 0 }}
                {{ $unifiInfraSubnet = $network.spec.infraSubnet }}
              {{ end }}
            {{ end }}
          {{ end }}

          {{ if $environment.hosts }}
          {{ $host := index $environment.hosts 0 }}
          ---
          apiVersion: ansible.crossplane.io/v1alpha1
          kind: AnsibleRun
          metadata:
            name: {{ $name }}-bridge
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: bridge
          spec:
            forProvider:
              inventoryInline: |
                {{ $host.fqdn }} ansible_host={{ $host.ula }} ansible_user=automation-user ansible_ssh_private_key_file=kvm-ssh-key ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
              # Deliberately not byte-identical to providers/kvm/ansible/
              # roles/bridge/tasks/main.yml -- that role uses real Jinja2
              # vars for standalone/reusable runs; here vlan_id/bridge_name
              # are substituted by THIS Go template instead. Go's
              # text/template and Jinja2 use the same double-brace marker
              # for their own expressions (confirmed the hard way: an
              # earlier version of THIS comment typed that marker out
              # literally as an example and broke the template it was
              # explaining -- "missing value for command" -- since Go
              # tokenizes the raw string before any YAML-comment awareness
              # exists). A Jinja2-parameterized playbook embedded verbatim
              # here would hit the identical problem for real. Same
              # accepted-drift tradeoff as talos-cluster's embedded
              # Terraform module vs. the real one.
              playbookInline: |
                - hosts: all
                  become: true
                  tasks:
                    {{ if $unifiInfraSubnet }}
                    # Real CIDR-subset math (ansible.utils.in_any_network,
                    # confirmed live 2026-08-06 to work in
                    # provider-ansible's runtime -- ansible.utils 6.0.1 is
                    # installed, and the test works correctly despite
                    # netaddr not being importable from any Python
                    # interpreter in the pod, so it must resolve via
                    # stdlib ipaddress internally, not netaddr). Hard gate,
                    # unlike validate-unifi-network-match's vlanId check --
                    # a bad address fails this whole AnsibleRun rather than
                    # just setting a ClaimCondition. fail_msg deliberately
                    # doesn't interpolate the loop variable Ansible-side --
                    # writing that literal marker here would collide with
                    # THIS Go template's own delimiters the same way
                    # inventoryInline's big comment above already explains
                    # (confirmed the hard way there, then again writing
                    # THIS comment: an earlier draft spelled that marker
                    # out directly as an example and broke this template
                    # too). The failing address is still visible in this
                    # task's own per-item Ansible result.
                    - name: Assert bridge addresses are within {{ $unifiNetworkRef.name }}'s infraSubnet
                      ansible.builtin.assert:
                        # ansible.utils.in_any_network wants a bare address,
                        # not a CIDR-suffixed one -- confirmed live
                        # 2026-08-06: "<addr>/64" is ansible.utils.in_any_network(...)
                        # silently evaluates false even for a genuinely
                        # in-subnet address (it's comparing the /64
                        # *network* those host bits fall in, not the host
                        # address itself, against the target). item here
                        # is always "<addr>/<prefixlen>" (netplan's own
                        # addresses: format, matching xrd.yaml's addresses
                        # field) -- split off the prefix length first.
                        that: "item.split('/')[0] is ansible.utils.in_any_network(['{{ $unifiInfraSubnet }}'])"
                        fail_msg: "A bridge address is not within {{ $unifiNetworkRef.name }}'s infraSubnet {{ $unifiInfraSubnet }} -- see this task's per-item result for which address failed."
                        success_msg: "All bridge addresses fall within {{ $unifiInfraSubnet }}."
                      loop:
                        {{ range $addr := $addresses }}
                        - "{{ $addr }}"
                        {{ end }}
                    {{ end }}
                    - name: Write netplan config for {{ $bridgeName }}
                      ansible.builtin.copy:
                        dest: /etc/netplan/60-{{ $bridgeName }}.yaml
                        mode: "0600"
                        content: |
                          network:
                            version: 2
                            {{ if $taggedVlan }}
                            vlans:
                              {{ $uplinkIface }}:
                                id: {{ $vlanId }}
                                link: {{ $bondInterface }}
                            {{ end }}
                            bridges:
                              {{ $bridgeName }}:
                                interfaces: ["{{ $uplinkIface }}"]
                                dhcp4: {{ $dhcp4 }}
                                dhcp6: {{ $dhcp6 }}
                                {{ if $addresses }}
                                addresses:
                                  {{ range $addr := $addresses }}
                                  - "{{ $addr }}"
                                  {{ end }}
                                {{ end }}
                                {{ if $routes }}
                                routes:
                                  {{ range $route := $routes }}
                                  - to: "{{ $route.to }}"
                                    {{ if $route.via }}via: "{{ $route.via }}"{{ end }}
                                    {{ if $route.scope }}scope: "{{ $route.scope }}"{{ end }}
                                    {{ if $route.from }}from: "{{ $route.from }}"{{ end }}
                                  {{ end }}
                                {{ end }}
                      register: netplan_config
                    - name: Apply netplan
                      ansible.builtin.command:
                        cmd: netplan apply
                      when: netplan_config.changed
                      changed_when: true
            providerConfigRef:
              name: default
          {{ end }}

  - step: status-update
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{ $vlanId := .observed.composite.resource.spec.vlanId }}
          {{ $bridgeName := printf "br%d" (int $vlanId) }}
          {{ if .observed.composite.resource.spec.bridgeName }}
            {{ $bridgeName = .observed.composite.resource.spec.bridgeName }}
          {{ end }}
          {{ $unifiNetworkRef := .observed.composite.resource.spec.unifiNetworkRef }}
          {{ $bridgeReady := false }}
          {{ if .observed.resources }}
            {{ range $rname, $resource := .observed.resources }}
              {{ if eq $rname "bridge" }}
                {{ range $cond := $resource.resource.status.conditions }}
                  {{ if and (eq $cond.type "Ready") (eq $cond.status "True") }}
                    {{ $bridgeReady = true }}
                  {{ end }}
                {{ end }}
              {{ end }}
            {{ end }}
          {{ end }}

          {{/* Unlike "bridge" above, the UniFi network is no longer
               composed here -- it's fetched via extra-resources
               (fetch-unifi-network step), same as
               xkubernetescluster-composition's own read of this XRD's
               own status.ready. A segment with no unifiNetworkRef set
               is trivially network-ready; one that references an
               XUnifiNetwork waits on that claim's own status.ready. */}}
          {{ $unifiNetworkReady := true }}
          {{ if $unifiNetworkRef }}
            {{ $unifiNetworkReady = false }}
            {{ $extraResources := index .context "apiextensions.crossplane.io/extra-resources" }}
            {{ if $extraResources }}
              {{ $networks := index $extraResources "XUnifiNetwork" }}
              {{ if and $networks (gt (len $networks) 0) }}
                {{ $network := index $networks 0 }}
                {{ if $network.status.ready }}
                  {{ $unifiNetworkReady = true }}
                {{ end }}
              {{ end }}
            {{ end }}
          {{ end }}
          ---
          apiVersion: platform.rye.ninja/v1alpha1
          kind: XNetworkSegment
          status:
            bridgeName: {{ $bridgeName }}
            ready: {{ and $bridgeReady $unifiNetworkReady }}

  - step: auto-ready
    functionRef:
      name: function-auto-ready
