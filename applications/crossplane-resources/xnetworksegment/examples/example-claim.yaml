apiVersion: platform.rye.ninja/v1alpha1
kind: XNetworkSegment
metadata:
  # Cluster-scoped (xrd.yaml's spec.scope: Cluster) -- no namespace field.
  name: observability-vlan
  labels:
    rye.ninja/component: xnetworksegment
    rye.ninja/owner: platform-engineering
    # Matched by cluster-talos-kvm-composition's fetch-network-segment
    # step (function-extra-resources Selector, since Reference-by-name
    # doesn't support field-path templating) against the claiming
    # XKubernetesCluster's spec.vlanRef.name.
    platform.rye.ninja/network-segment-name: observability-vlan
spec:
  vlanId: 200
  # References xunifinetwork/examples/example-claim.yaml, which creates the
  # actual UniFi network/VLAN object -- omit this field entirely for a
  # segment that reuses an already-existing network instead (see
  # xrd.yaml's unifiNetworkRef description).
  unifiNetworkRef:
    name: observability-vlan
