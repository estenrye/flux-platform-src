# Cluster-scoped, deliberately -- NOT namespaced like XKubernetesCluster.
# Exists specifically so its Composition can compose ansible.crossplane.io's
# AnsibleRun (hard cluster-scoped, no namespace-aware variant published --
# confirmed via provider-ansible's apis/ directory, 2026-08-04) and
# tf.m.upbound.io's Workspace, without hitting Crossplane's
# errFmtNamespacedXRClusterResource rule ("if the XR is namespaced then the
# composed resource must be too" -- confirmed against crossplane/
# crossplane's own composition_functions.go). A namespaced XR (like
# XKubernetesCluster) cannot compose either resource directly; a
# Cluster-scoped one can compose resources at any scope. XKubernetesCluster
# references this by name (spec.vlanRef.name) instead of composing it,
# fetched via function-extra-resources -- see cluster-talos-kvm-composition.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xnetworksegments.platform.rye.ninja
spec:
  scope: Cluster
  group: platform.rye.ninja
  names:
    kind: XNetworkSegment
    plural: xnetworksegments
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              vlanId:
                type: integer
                minimum: 1
                maximum: 4094
                description: "802.1Q VLAN ID for this segment's dedicated bridge on the KVM host -- see providers/kvm/ansible/roles/bridge for the reference playbook (the Composition embeds an inlined, kept-in-sync-by-hand copy for the same Go-template/Jinja2 {{ }} delimiter-collision reason talos-cluster's Terraform module is embedded rather than git-sourced)."
              infraSubnet:
                type: string
                description: "ULA /64 for this segment, e.g. \"fd97:45c2:b3a1:200::/64\". Single source of truth for this value -- a claiming XKubernetesCluster's own platform-kvm-network EnvironmentConfig entry has its own infraSubnet field too (used for the Talos bootstrap Job's env vars, which don't fetch this XR); keep the two in sync by hand until that's worth plumbing through extra-resources as well."
              ipv4Subnet:
                type: string
                # ADDED 2026-08-05: an earlier version of this field
                # derived an IPv4 subnet from vlanId ("10.<vlanId>.0.1/16")
                # instead of taking one explicitly, which silently broke
                # for any vlanId over 255 (doesn't fit an IPv4 octet) --
                # caught in review before merging. Explicit and required
                # instead of derived: the derivation coupled two unrelated
                # decisions (802.1Q ID, IPv4 addressing) that don't have
                # to move together, and this way a caller picks a subnet
                # that's actually free rather than trusting a formula not
                # to collide with something hand-configured elsewhere.
                description: "IPv4 subnet + gateway for this segment, CIDR notation, e.g. \"10.200.0.1/16\" -- required even though this fleet's clusters are IPv6-only end to end (confirmed live: UniFi won't claim router/RA ownership of a network with no IPv4 subnet object at all, regardless of `purpose`; matches vlan100/vlan101's own convention of an unused-but-present IPv4 subnet, DHCP disabled). Pick something that doesn't collide with any other network in the UniFi UI's network list -- not validated against live UniFi state here."
            required:
            - vlanId
            - infraSubnet
            - ipv4Subnet
          status:
            type: object
            properties:
              bridgeName:
                type: string
                description: "Derived (br<vlanId>), surfaced here so referencing Compositions don't need to recompute it."
              ready:
                type: boolean
                description: "True once both the bridge (AnsibleRun) and the UniFi VLAN (Workspace) report Ready. Set by this XRD's own Composition status-update step."
