apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vpa-state-metrics
  namespace: vpa-monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
      app.kubernetes.io/instance: vpa-state-metrics
  endpoints:
    - port: http
      interval: 60s
      path: /metrics
