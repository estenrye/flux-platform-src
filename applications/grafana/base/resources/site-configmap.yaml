# Per-cluster Grafana settings, injected as environment variables (they
# override grafana.ini). The values below are placeholders: every cluster
# including grafana must patch both (see clusters/core-infra/patches/grafana.*)
# and .bin/lint-grafana-placeholders.sh fails the build if one is left.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-site
  namespace: grafana
data:
  GF_SERVER_ROOT_URL: https://grafana.k8s.local
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID: JUMPCLOUD_OIDC_PKCE_CLIENT_ID
  GF_AUTH_OKTA_CLIENT_ID: KEYCLOAK_OIDC_PKCE_CLIENT_ID
  GF_AUTH_OKTA_AUTH_URL: https://keycloak.k8s.local/auth
  GF_AUTH_OKTA_TOKEN_URL: https://keycloak.k8s.local/token
  GF_AUTH_OKTA_API_URL: https://keycloak.k8s.local/userinfo
