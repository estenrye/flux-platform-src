# Backs up the generated secret_key to the 1Password vault behind the
# 1password-sdk ClusterSecretStore (item grafana-secret-key, field secret-key).
# Restoring it is manual: copy the field back into the grafana-secret-key
# Secret before starting Grafana against restored data. deletionPolicy: None
# keeps the 1Password item if this object is ever removed.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grafana-secret-key
  namespace: grafana
spec:
  refreshInterval: 1h
  deletionPolicy: None
  updatePolicy: Replace
  secretStoreRefs:
    - name: 1password-sdk
      kind: ClusterSecretStore
  selector:
    secret:
      name: grafana-secret-key
  data:
    - match:
        secretKey: secret-key
        remoteRef:
          remoteKey: grafana-secret-key
          property: secret-key
