# Grafana's secret_key: the key encryption key for the data keys that encrypt
# datasource credentials and other secrets in grafana-db. Generated once.
# CreatedOnce + Owner: never delete or regenerate this Secret. Everything
# Grafana has encrypted in the database becomes unreadable without it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secret-key
  namespace: grafana
spec:
  refreshPolicy: CreatedOnce
  target:
    name: grafana-secret-key
    creationPolicy: Owner
    template:
      data:
        secret-key: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: grafana-secret-key
