apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  namespace: grafana
  annotations:
    ignore-check.kube-linter.io/dangling-networkpolicypeer-podselector: "The Gateway's Envoy proxy pods are created at runtime by the Envoy Gateway controller in this namespace; they are not in the static rendered manifests but exist at runtime."
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The Gateway's Envoy proxy pods run in the Gateway's own namespace under
    # Calico 3.33, so no namespaceSelector.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-name: grafana-gateway
              gateway.envoyproxy.io/owning-gateway-namespace: grafana
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # JumpCloud (OIDC) and grafana.com (plugin download); apiserver for the
    # dashboard sidecar -- Calico evaluates egress post-DNAT
    # (docs/memory/calico-networkpolicy-dnat.md); Talos serves 6443.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: victoria-metrics
      ports:
        - protocol: TCP
          port: 8428
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: netdata
          podSelector:
            matchLabels:
              app: netdata
              role: parent
      ports:
        - protocol: TCP
          port: 19999
