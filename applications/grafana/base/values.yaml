priorityClassName: platform

replicas: 1

# Plugin downloads need egress 443 to grafana.com (see network-policy.yaml).
plugins:
  - netdatacloud-netdata-datasource

# Per-cluster values (root_url, client_id) come from the grafana-site
# ConfigMap as GF_* environment variables, which override grafana.ini. Each
# cluster patches that ConfigMap instead of replicating this config.
envFromConfigMaps:
  - name: grafana-site

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

grafana.ini:
  analytics:
    check_for_updates: false
    reporting_enabled: false
  auth.generic_oauth:
    enabled: true
    name: JumpCloud
    auth_url: https://oauth.id.jumpcloud.com/oauth2/auth
    token_url: https://oauth.id.jumpcloud.com/oauth2/token
    api_url: https://oauth.id.jumpcloud.com/userinfo
    scopes: openid email profile offline_access
    # JumpCloud app type "Public (None PKCE)": no client_secret.
    use_pkce: true
    use_refresh_token: true
    # Evaluated left to right, first match wins.
    role_attribute_path: "contains(groups[*], 'ACL_grafana-admins') && 'Admin' || contains(groups[*], 'ACL_grafana-editors') && 'Editor' || contains(groups[*], 'ACL_grafana-viewers') && 'Viewer'"
    role_attribute_strict: true
    # Block anyone not in one of the three groups at login.
    groups_attribute_path: groups
    allowed_groups: ACL_grafana-admins ACL_grafana-editors ACL_grafana-viewers

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: victoria-metrics
        type: prometheus
        access: proxy
        url: http://victoria-metrics.victoria-metrics.svc.cluster.local:8428
        isDefault: true
        jsonData:
          timeInterval: 30s
          httpMethod: POST
      - name: Netdata
        uid: netdata
        type: netdatacloud-netdata-datasource
        access: proxy
        url: http://netdata.netdata.svc.cluster.local:19999

# Namespaced Role (not ClusterRole): the sidecar only watches this namespace.
# The chart's own Role also grants Secrets access, which the ConfigMap-only
# dashboard sidecar does not need, so bind to resources/role.yaml instead.
rbac:
  namespaced: true
  useExistingRole: grafana-sidecar

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: grafana
    # ConfigMaps only; the default "both" also needs access to Secrets.
    resource: configmap
    provider:
      foldersFromFilesStructure: false
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

persistence:
  enabled: false

route:
  main:
    enabled: true
    hostnames:
      - grafana.k8s.local
    parentRefs:
      - name: grafana-gateway
        namespace: grafana
        sectionName: https

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    memory: 512Mi

testFramework:
  enabled: false

serviceMonitor:
  enabled: true
