# Values for the tigera-operator chart — IPv6-only Talos cluster.
# Addressing derives from providers/kvm/network.yaml (single source of truth);
# nothing here is under the delegated GUA prefix, so ISP renumbering does not
# touch this file.
installation:
  enabled: true
  calicoNetwork:
    bgp: Enabled
    # IPv6-only: no v4 ipPools and no nodeAddressAutodetectionV4 means the
    # operator never enables IPv4 (Talos nodes carry no IPv4 addresses at all).
    ipPools:
      - name: pods-v6
        cidr: fd97:45c2:b3a1:1100::/56 # allocations.pod_cidr
        encapsulation: None # same L2 segment; node-to-node mesh routes pods
        natOutgoing: Enabled # pods are ULA — SNAT to node address for egress
        blockSize: 122
        nodeSelector: all()
    # 2026-09-08 (ADR-22 amendment): BGP peering moved off VLAN 100 onto its
    # own dedicated, client-free VLAN 179 -- fixes a confirmed-live hairpin
    # bug where any VLAN-100-resident client hitting a BGP-advertised
    # LoadBalancer VIP had its ACK/ClientHello silently dropped (same class
    # as the 2026-07-15 VIP-pool move, recurring at the peering-session
    # layer). Every controlplane VM now has a genuine second NIC on VLAN
    # 179 (docs/superpowers/specs/2026-09-08-calico-bgp-peering-vlan179-design.md);
    # this cidrs match is unambiguous because that /64 carries nothing else
    # (no SLAAC GUA, no floating VIP -- VLAN 179 is BGP-peering-only by
    # design), unlike VLAN 100's old NodeInternalIP match which existed
    # specifically to disambiguate from that VLAN's other addresses.
    nodeAddressAutodetectionV6:
      cidrs: ["fd97:45c2:b3a1:179::/64"]
  # Talos: default paths work with operator-managed Calico; kubelet volume
  # plugin path patching is not required on Talos >= 1.5.
apiServer:
  enabled: true
