apiVersion: crd.projectcalico.org/v1
kind: BGPPeer
metadata:
  name: unifi-gateway
spec:
  # 2026-09-08 (ADR-22 amendment): peering moved from the gateway's VLAN
  # 100 GUA to its VLAN 179 ULA gateway address, dedicated and client-free
  # (docs/superpowers/specs/2026-09-08-calico-bgp-peering-vlan179-design.md).
  # The gateway side accepts dynamic neighbors (providers/kvm/unifi-frr.conf),
  # so only this side names a fixed peer address. Not subject to the GUA
  # renumbering caveat that applied to the old address -- this is a
  # site-stable ULA, immune to ISP re-delegation.
  peerIP: fd97:45c2:b3a1:179::1
  asNumber: 64512
