apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: calico-node
  namespace: calico-system
spec:
  selector:
    matchLabels:
      k8s-app: calico-node-metrics
  endpoints:
    - port: metrics
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: calico-typha
  namespace: calico-system
  annotations:
    ignore-check.kube-linter.io/dangling-servicemonitor: The calico-typha-metrics Service is created at runtime by the tigera-operator, so it is not in the static rendered manifests.
spec:
  selector:
    matchLabels:
      k8s-app: calico-typha-metrics
  endpoints:
    - port: calico-typha-metrics
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: calico-kube-controllers
  namespace: calico-system
  annotations:
    ignore-check.kube-linter.io/dangling-servicemonitor: The calico-kube-controllers-metrics Service is created at runtime by the tigera-operator, so it is not in the static rendered manifests.
spec:
  selector:
    matchLabels:
      k8s-app: calico-kube-controllers
  endpoints:
    - port: metrics-port
      interval: 60s
