apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  annotations:
    config.k8s.io/owning-inventory: talos-bootstrap-manifests-inventory
  name: custom-proxy-config
  namespace: envoy-gateway-system
spec:
  ipFamily: IPv6
  logging:
    level:
      default: warn
  mergeGateways: true
  provider:
    kubernetes:
      envoyDeployment:
        pod:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    gateway.envoyproxy.io/owning-gatewayclass: merged-eg
                topologyKey: kubernetes.io/hostname
          tolerations:
          - effect: NoSchedule
            key: node-role.kubernetes.io/control-plane
            operator: Exists
        replicas: 2
        strategy:
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
          type: RollingUpdate
      envoyService:
        annotations:
          projectcalico.org/ipv6pools: '["lb-ingress-routed"]'
        externalTrafficPolicy: Cluster
        # Claimed by Calico's LB IPAM only; a class makes OCCM ignore the Service
        # instead of also creating an Octavia load balancer for it.
        loadBalancerClass: calico
        type: LoadBalancer
    type: Kubernetes
---
