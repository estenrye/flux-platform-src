# Felix (calico-node) metrics. calico-node runs on the host network and declares
# no container ports, so a PodMonitor's portNumber matches nothing (the otel
# target allocator never produced a job for the old PodMonitors). A headless
# Service gives endpoint-based discovery, which does not depend on declared
# container ports.
# The tigera-operator already creates calico-typha-metrics (9093) and
# calico-kube-controllers-metrics (9094) itself, but no Service for Felix, so
# only this one is declared here (see metrics-service-monitors.yaml). The
# Installation is bootstrapped by tofu (pcd-ce-deploy/tofu-pcd-talos-cluster
# calico.tf), which sets nodeMetricsPort / typhaMetricsPort to 9091 / 9093 --
# keep them in sync.
apiVersion: v1
kind: Service
metadata:
  name: calico-node-metrics
  namespace: calico-system
  labels:
    k8s-app: calico-node-metrics
  annotations:
    ignore-check.kube-linter.io/dangling-service: The calico-node DaemonSet is created at runtime by the tigera-operator, so it is not in the static rendered manifests.
spec:
  clusterIP: None
  selector:
    k8s-app: calico-node
  ports:
    - name: metrics
      port: 9091
      targetPort: 9091
