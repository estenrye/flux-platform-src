# Felix (calico-node), Typha and kube-controllers metrics. calico-node and Typha
# run on the host network, so select by port number rather than a named port.
# The Installation is bootstrapped by tofu (pcd-ce-deploy/tofu-pcd-talos-cluster
# calico.tf), which sets nodeMetricsPort / typhaMetricsPort to 9091 / 9093 --
# keep them in sync. kube-controllers serves metrics on 9094 by default.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: calico-node
  namespace: calico-system
spec:
  selector:
    matchLabels:
      k8s-app: calico-node
  podMetricsEndpoints:
    - portNumber: 9091
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: calico-typha
  namespace: calico-system
spec:
  selector:
    matchLabels:
      k8s-app: calico-typha
  podMetricsEndpoints:
    - portNumber: 9093
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: calico-kube-controllers
  namespace: calico-system
spec:
  selector:
    matchLabels:
      k8s-app: calico-kube-controllers
  podMetricsEndpoints:
    - portNumber: 9094
      interval: 60s
