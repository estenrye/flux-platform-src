apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubelet-serving-cert-approver
  annotations:
    checkov.io/skip1: "CKV_K8S_38=The approver uses its service account token to list and approve kubelet serving CertificateSigningRequests through the Kubernetes API."
    checkov.io/skip2: "CKV_K8S_43=Image is pinned to an immutable upstream release tag via the upstream manifest."
    ignore-check.kube-linter.io/minimum-three-replicas: "The approver is a single-instance controller; a brief outage only delays approval of new kubelet serving certificates."
    ignore-check.kube-linter.io/non-isolated-pod: "The approver serves no inbound traffic other than metrics and health checks."
spec:
  strategy:
    type: RollingUpdate
  template:
    spec:
      restartPolicy: Always
      priorityClassName: platform-critical
      containers:
        - name: cert-approver
          # Upstream's 250m CPU / 32Mi limits throttle the controller at start-up
          # (VPA target: 271m CPU, 250Mi): the 1s health probes time out and the
          # kubelet kills it, ~1300 restarts. Raise the limits and loosen the probes.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            timeoutSeconds: 5
