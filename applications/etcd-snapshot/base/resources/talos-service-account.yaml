# Talos API access for the snapshot CronJob. Talos reconciles this into a
# Secret of the same name in this namespace holding a talosconfig limited to
# the os:etcd:backup role.
#
# PREREQUISITE: the control planes must enable
# machine.features.kubernetesTalosAPIAccess with
# allowedRoles: ["os:etcd:backup"] and
# allowedKubernetesNamespaces: ["etcd-backup"]
# (pcd-ce-deploy/tofu-pcd-talos-cluster/talos.tf). Until then the
# serviceaccounts.talos.dev CRD does not exist and this resource cannot be
# applied. See docs/runbooks/etcd-snapshot-core-infra.md.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-snapshot
  namespace: etcd-backup
spec:
  roles:
    - os:etcd:backup
