apiVersion: v1
kind: ServiceAccount
metadata:
  name: vlan100-onlink-routing-fix
  namespace: vlan100-onlink-routing-fix
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vlan100-onlink-routing-fix
rules:
  # Read-only, cluster-scoped, nothing else: dynamic peer discovery
  # (docs/superpowers/specs/2026-09-09-vlan100-onlink-routing-daemonset-design.md
  # §2.3) needs every node's InternalIP.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vlan100-onlink-routing-fix
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vlan100-onlink-routing-fix
subjects:
  - kind: ServiceAccount
    name: vlan100-onlink-routing-fix
    namespace: vlan100-onlink-routing-fix
