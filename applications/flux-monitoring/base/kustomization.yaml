apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system

helmCharts:
  - name: kube-state-metrics
    repo: oci://ghcr.io/prometheus-community/charts
    version: 7.2.2
    releaseName: flux-state-metrics
    namespace: flux-system
    includeCRDs: true
    valuesFile: values.yaml

# Egress and scrape ingress for flux-state-metrics come from the namespace-wide
# allow-egress and allow-scraping policies in applications/flux/base, so
# resources/network-policy.yaml is not included. resources/pod-monitor.yaml
# duplicates the flux-system PodMonitor that applications/flux/base ships.
resources:
  - resources/service-monitor.yaml

patches:
  - target:
      kind: Deployment
    path: patches/deployment.yaml

images:
  - name: registry.k8s.io/kube-state-metrics/kube-state-metrics
    digest: sha256:1545919b72e3ae035454fc054131e8d0f14b42ef6fc5b2ad5c751cafa6b2130e