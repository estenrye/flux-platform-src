# M4 completion step B6 (observability side): ESO -> controlplane's OpenBao,
# over the new mTLS-gated 8443 listener (applications/openbao), using
# SPIFFE-based cert auth instead of Kubernetes-auth (see
# docs/superpowers/specs/2026-08-16-openbao-cross-cluster-auth-design.md
# for why: Kubernetes-auth would need OpenBao to reach INTO this cluster's
# apiserver, a two-directional dependency that doesn't generalize to future
# cloud substrates; cert auth is one-directional and substrate-agnostic).
#
# caProvider only needs the fleet root -- OpenBao's 8443 listener presents
# its FULL chain (leaf + controlplane's own intermediate,
# applications/openbao/base/resources/server-8443-fullchain.bundle.yaml),
# so this cluster's existing root-only trust bundle (from M4 completion
# step B5) is already sufficient. No new cross-cluster cert distribution
# needed for the server-verification direction.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-remote
  namespace: external-secrets-operator
spec:
  conditions:
    - namespaces:
        - external-secrets-operator
  provider:
    vault:
      server: "https://bao.rye.ninja:443"
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: ryezone-labs-root
        key: root.crt
        namespace: external-secrets-operator
      auth:
        cert:
          path: cert
          clientCert:
            name: eso-openbao-client-bundle
            key: client-bundle.pem
            namespace: external-secrets-operator
          secretRef:
            name: eso-openbao-client-tls
            key: tls.key
            namespace: cert-manager
