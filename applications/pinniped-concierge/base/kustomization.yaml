apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pinniped has no Helm chart, only pre-rendered manifests attached to
# GitHub releases. Image is already digest-pinned in the upstream
# manifest itself.
resources:
  - https://github.com/vmware/pinniped/releases/download/v0.47.0/install-pinniped-concierge.yaml
  - resources/jwt-authenticator.yaml
  - resources/rbac-groups.yaml
  - resources/network-policy.yaml

patches:
  - target:
      kind: Deployment
      name: pinniped-concierge
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
      - op: add
        path: /spec/template/spec/restartPolicy
        value: Always
      - op: add
        path: /metadata/annotations
        value: {}
      - op: add
        path: /metadata/annotations/checkov.io~1skip01
        value: "CKV_K8S_38=Concierge manages the kube-cert-agent pod and watches JWTAuthenticator/CredentialIssuer CRs via the K8s API; its ServiceAccount token is required (RBAC already scoped narrowly by the upstream manifest)."
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-node-affinity
        value: "This cluster's nodes carry no zone/rack topology labels to express affinity against; the upstream manifest already sets its own preferred (soft) pod anti-affinity for spread."
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1minimum-three-replicas
        value: "Upstream manifest's own default (replicas: 2); not independently tuned for this step."
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1liveness-port
        value: "Upstream manifest doesn't declare a containerPort list at all (routing works via Service targetPort regardless); the probe's port 10250 is correct and confirmed live."
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1readiness-port
        value: "Upstream manifest doesn't declare a containerPort list at all (routing works via Service targetPort regardless); the probe's port 10250 is correct and confirmed live."

  - target:
      kind: RoleBinding
      name: pinniped-concierge-aggregated-api-server
      namespace: pinniped-concierge
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          ignore-check.kube-linter.io/access-to-secrets: "Upstream RBAC: the Concierge manages its own serving-certificate and impersonation-proxy Secrets as part of its core function; not independently narrowable."
          ignore-check.kube-linter.io/access-to-create-pods: "Upstream RBAC: the kube-cert-agent mechanism (discovering the cluster's signing CA) requires creating a Deployment in kube-system; not independently narrowable."

  - target:
      kind: ClusterRole
      name: pinniped-concierge-impersonation-proxy
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          ignore-check.kube-linter.io/wildcard-in-rules: "Upstream RBAC: the impersonation-proxy mode needs to impersonate arbitrary users/groups it doesn't know in advance; not independently narrowable. (This cluster uses the standard TokenCredentialRequest/client-cert flow, not impersonation proxy, but the upstream manifest ships both.)"

  - target:
      kind: ClusterRoleBinding
      name: pinniped-concierge-impersonation-proxy
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          ignore-check.kube-linter.io/access-to-secrets: "Same impersonation-proxy RBAC as the ClusterRole above; unused in this cluster's configuration (TokenCredentialRequest/client-cert flow) but shipped by the upstream manifest."

  - target:
      kind: ClusterRoleBinding
      name: pinniped-k8s-admin
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          ignore-check.kube-linter.io/cluster-admin-role-binding: "Deliberate, per M3 design A7: the k8s-admin Keycloak group is explicitly meant to grant cluster-admin via Pinniped RBAC."
