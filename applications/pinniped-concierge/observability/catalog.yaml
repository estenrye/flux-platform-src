apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: pinniped-concierge-observability
  description: |-
    Pinniped Concierge on the observability cluster: aggregated API server
    validating tokens issued by the Supervisor (JWTAuthenticator against
    sso.rye.ninja, audience observability-rye-ninja), serving
    TokenCredentialRequest for kubectl. Concierge only — the Supervisor
    itself is controlplane-only (ADR-14).
  tags:
    - identity
    - oidc
    - rbac
    - platform
    - infrastructure
spec:
  type: service
  lifecycle: production
  owner: platform-engineering
