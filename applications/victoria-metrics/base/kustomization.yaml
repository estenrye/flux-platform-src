apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: victoria-metrics

helmCharts:
  - name: victoria-metrics-single
    repo: https://victoriametrics.github.io/helm-charts/
    version: 0.50.0
    releaseName: victoria-metrics
    namespace: victoria-metrics
    valuesFile: values.yaml

resources:
  - resources/namespace.yaml
  - resources/network-policy.yaml
  - resources/vpa.yaml

patches:
  - path: patches/statefulset.yaml
  - target:
      kind: ServiceMonitor
    path: patches/monitor-namespace.yaml

images:
  - name: victoriametrics/victoria-metrics
    digest: sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
