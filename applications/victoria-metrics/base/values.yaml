# Single-node VictoriaMetrics: the PromQL store behind Grafana. The
# otelcol-ds collector pushes every scraped series here over OTLP/HTTP
# (/opentelemetry/v1/metrics) alongside its export to netdata-otel.
server:
  # Stable Service name: victoria-metrics.victoria-metrics.svc:8428
  fullnameOverride: victoria-metrics
  # Months when no unit is given; 30 days.
  retentionPeriod: 30d
  extraArgs:
    envflag.enable: true
    envflag.prefix: VM_
    loggerFormat: json
    # VictoriaMetrics listens on IPv4 only by default; the pod network is IPv6.
    enableTCP6: true
    # Keep Prometheus-style metric names (dots -> underscores, unit/type
    # suffixes) so community dashboards written for Prometheus work.
    opentelemetry.usePrometheusNaming: true
  serviceMonitor:
    enabled: true
  persistentVolume:
    enabled: true
    size: 20Gi
    storageClassName: csi-cinder-sc-delete
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
  securityContext:
    enabled: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
