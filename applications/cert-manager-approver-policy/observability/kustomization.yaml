apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager

resources:
  - network-policy.yaml

helmCharts:
  - name: cert-manager-approver-policy
    repo: oci://quay.io/jetstack/charts
    version: v0.28.0
    releaseName: cert-manager-approver-policy
    namespace: cert-manager
    includeCRDs: true
    valuesFile: values.yaml

patches:
  - target:
      kind: Deployment
    path: patches/deployment.yaml
  - target:
      kind: RoleBinding
    path: patches/rolebinding.yaml

images:
  - name: quay.io/jetstack/cert-manager-approver-policy
    newTag: v0.28.0
    digest: sha256:1a955b0a5c41d319fd56b5f85aaff6f2eaba01d70f3b1adf001eac4d7b1d49e5
