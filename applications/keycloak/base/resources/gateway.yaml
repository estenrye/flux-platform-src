# Keycloak terminates TLS at the Gateway (browser-facing OIDC needs a
# publicly-trusted cert). Calico 3.33's bundled Envoy Gateway: named
# keycloak-gateway, not keycloak, because the proxy deploys into the Gateway's
# namespace with a ServiceAccount named after the Gateway, which would collide
# with the chart's ServiceAccount keycloak/keycloak
# (docs/memory/calico-33-gateway-namespace-mode.md).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: keycloak-gateway
  namespace: keycloak
  annotations:
    # cert-manager's Gateway API shim creates the Certificate for the https
    # listener's certificateRef.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: external-dedicated
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: id.rye.ninja
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: id-rye-ninja-tls
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
