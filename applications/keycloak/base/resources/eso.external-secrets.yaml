# CreatedOnce: generated once and never rotated underneath a running Keycloak.
# Read the first-login values with
#   kubectl -n keycloak get secret <name> -o jsonpath='{.data.password}' | base64 -d
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin-credentials
  namespace: keycloak
spec:
  refreshPolicy: CreatedOnce
  target:
    name: keycloak-admin-credentials
    creationPolicy: Owner
  # Generators emit one key named "password"; rewrite names it for the Secret.
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: keycloak-admin-password
      rewrite:
        - regexp:
            source: "password"
            target: "password"
---
