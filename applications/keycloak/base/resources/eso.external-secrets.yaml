---
# Gitea's OIDC client secret. CreatedOnce + Owner: generated once; Keycloak's
# realm import (keycloak-config-cli) reads it here and the PushSecret below
# publishes it to 1Password, where Gitea's ExternalSecret (gitea-oidc-client)
# reads it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-gitea-client
  namespace: keycloak
spec:
  refreshPolicy: CreatedOnce
  target:
    name: keycloak-gitea-client
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: keycloak-gitea-client-secret
      rewrite:
        - regexp:
            source: "password"
            target: "client-secret"
---
# deletionPolicy: None keeps the 1Password item if this object is removed.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: keycloak-gitea-client
  namespace: keycloak
spec:
  refreshInterval: 1h
  deletionPolicy: None
  updatePolicy: Replace
  secretStoreRefs:
    - name: 1password-sdk
      kind: ClusterSecretStore
  selector:
    secret:
      name: keycloak-gitea-client
  data:
    - match:
        secretKey: client-secret
        remoteRef:
          remoteKey: gitea-oidc-client
          property: client-secret
