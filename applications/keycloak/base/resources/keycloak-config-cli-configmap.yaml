apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config-cli
  namespace: keycloak
data:
  ryezone-labs.yaml: |
    realm: ryezone-labs
    enabled: true
    displayName: "RyeZone Labs"

    # M3 step 9b / A7 group model. `keycloak-admin` gets the built-in
    # realm-management client's realm-admin composite role, granting
    # this realm's admin console. openbao-admin/openbao-operator exist
    # here as groups only -- the OpenBao-side OIDC auth method binding
    # policies to these groups is not in M3's scope (no step references
    # it explicitly).
    groups:
      - name: k8s-admin
      - name: k8s-viewer
      - name: keycloak-admin
        clientRoles:
          realm-management:
            - realm-admin
      - name: openbao-admin
      - name: openbao-operator

    # M3 step 10: groups-as-OIDC-claims, assigned directly to the
    # pinniped-supervisor client below rather than realm-wide
    # defaultDefaultClientScopes (deliberately avoided in step 9b --
    # unclear replace-vs-add semantics there; per-client assignment has
    # no such ambiguity). full.path: false so the claim value is the bare
    # group name ("k8s-admin"), matching the RBAC Group subjects in
    # applications/pinniped-concierge.
    clientScopes:
      - name: groups
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"

    # M3 step 10 [H] verification: first real user, in k8s-admin so the
    # login can be checked end-to-end against Pinniped's ClusterRoleBinding
    # (cluster-admin). Temporary password -- Keycloak forces a reset on
    # first login, same as any real onboarding flow.
    users:
      - username: esten
        email: esten.rye@ryezone.com
        firstName: Esten
        lastName: Rye
        enabled: true
        emailVerified: true
        groups:
          - k8s-admin
        credentials:
          - type: password
            value: "$(env:ESTEN_TEMP_PASSWORD)"
            temporary: true

    # M3 step 10: Pinniped Supervisor's upstream OIDC client. Redirect URI
    # is the Supervisor's fixed callback path convention
    # (https://<issuer-host>/callback). defaultClientScopes enumerated
    # explicitly (queried live from this realm's own "account" client
    # rather than assumed) plus "groups".
    clients:
      - clientId: pinniped-supervisor
        name: "Pinniped Supervisor"
        enabled: true
        clientAuthenticatorType: client-secret
        secret: "$(env:PINNIPED_CLIENT_SECRET)"
        redirectUris:
          - "https://sso.rye.ninja/callback"
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        publicClient: false
        defaultClientScopes:
          - web-origins
          - acr
          - profile
          - roles
          - basic
          - email
          - groups
