apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config-cli
  namespace: keycloak
data:
  ryezone-labs.yaml: |
    realm: ryezone-labs
    enabled: true
    displayName: "RyeZone Labs"

    # `ACL_Keycloak_Administrator` gets the built-in realm-management client's
    # realm-admin composite role, granting this realm's admin console.
    # openbao-admin/openbao-operator exist here as groups only.
    #
    # ACL_* groups drive SeaweedFS S3 access: the seaweedfs-s3 client puts
    # them in the `groups` claim and SeaweedFS's keycloak provider maps each
    # to an IAM role (applications/seaweedfs/base/resources/
    # eso.external-secret.iam-config.yaml).
    groups:
      - name: ACL_Keycloak_Administrator
        clientRoles:
          realm-management:
            - realm-admin
      - name: openbao-admin
      - name: openbao-operator
      - name: ACL_SeaweedFS_AllBucketAdmin
      - name: ACL_SeaweedFS_ListAllBuckets
      - name: ACL_Keycloak_DbBackupOperator

    # Groups-as-OIDC-claims, assigned per client (not realm-wide
    # defaultDefaultClientScopes). full.path: false so the claim value is the
    # bare group name ("ACL_SeaweedFS_AllBucketAdmin").
    clientScopes:
      - name: groups
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"

    # First real user. No `credentials` here on purpose: keycloak-config-cli
    # re-applies declared credentials on every run, which reset the user's
    # password to the one-time value (and re-added UPDATE_PASSWORD) each time the
    # Job was re-run. On a fresh realm, set an initial password from the admin
    # console (Users > esten > Credentials), or temporarily re-add a `credentials`
    # entry using the keycloak-user-esten-credentials Secret (ESTEN_TEMP_PASSWORD).
    users:
      - username: esten
        email: esten.rye@ryezone.com
        firstName: Esten
        lastName: Rye
        enabled: true
        emailVerified: true
        groups:
          - ACL_Keycloak_Administrator
          - ACL_SeaweedFS_AllBucketAdmin
      # Machine identity for SeaweedFS (client-credentials grant). Add it to
      # an ACL_* group to grant access, e.g.
      #   groups: [ACL_SeaweedFS_ListAllBuckets]
      - username: service-account-seaweedfs-s3
        enabled: true
        serviceAccountClientId: seaweedfs-s3

    # SeaweedFS S3 web-identity client. Humans use the device flow
    # (no redirect URI needed), machines client-credentials. The audience
    # mapper makes `aud` = seaweedfs-s3 for both, matching the provider's
    # clientId in the SeaweedFS IAM config.
    clients:
      - clientId: seaweedfs-s3
        name: "SeaweedFS S3"
        enabled: true
        clientAuthenticatorType: client-secret
        secret: "$(env:SEAWEEDFS_S3_CLIENT_SECRET)"
        publicClient: false
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        attributes:
          oauth2.device.authorization.grant.enabled: "true"
        defaultClientScopes:
          - web-origins
          - acr
          - profile
          - roles
          - basic
          - email
          - groups
        protocolMappers:
          - name: seaweedfs-s3-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: seaweedfs-s3
              id.token.claim: "false"
              access.token.claim: "true"
