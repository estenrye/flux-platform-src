apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config-cli
  namespace: keycloak
data:
  ryezone-labs.yaml: |
    realm: ryezone-labs
    enabled: true
    displayName: "RyeZone Labs"

    # `ACL_Keycloak_Administrator` gets the built-in realm-management client's
    # realm-admin composite role, granting this realm's admin console.
    # openbao-admin/openbao-operator exist here as groups only.
    #
    # ACL_* groups drive SeaweedFS S3 access: the seaweedfs-s3 client puts
    # them in the `groups` claim and SeaweedFS's keycloak provider maps each
    # to an IAM role (applications/seaweedfs/base/resources/
    # eso.external-secret.iam-config.yaml).
    groups:
      - name: ACL_Keycloak_Administrator
        clientRoles:
          realm-management:
            - realm-admin
      - name: openbao-admin
      - name: openbao-operator
      - name: ACL_SeaweedFS_AllBucketAdmin
      - name: ACL_SeaweedFS_ListAllBuckets
      - name: ACL_Keycloak_DbBackupOperator
      - name: ACL_Grafana_DbBackupOperator
      # Kubernetes API access (clusters/*/resources/rbac.kubernetes-groups.yaml). The
      # unsuffixed groups apply fleet-wide; the _<cluster> groups to one cluster.
      - name: ACL_Kubernetes_cluster-admin
      - name: ACL_Kubernetes_view
      - name: ACL_Kubernetes_cluster-admin_core-infra
      - name: ACL_Kubernetes_view_core-infra
      # Grafana roles (same names as the JumpCloud groups, so one role mapping
      # works for both logins): applications/grafana/base/values.yaml.
      - name: ACL_grafana-admins
      - name: ACL_grafana-editors
      - name: ACL_grafana-viewers
      # Gitea (git.rye.ninja): sign-in needs ACL_gitea-users, the admin flag
      # follows ACL_gitea-admins (applications/gitea/base/values.yaml). Admins
      # must be in both; the groups do not nest.
      - name: ACL_gitea-users
      - name: ACL_gitea-admins

    # Groups-as-OIDC-claims, assigned per client (not realm-wide
    # defaultDefaultClientScopes). full.path: false so the claim value is the
    # bare group name ("ACL_SeaweedFS_AllBucketAdmin").
    clientScopes:
      - name: groups
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"

    # First real user. No `credentials` here on purpose: keycloak-config-cli
    # re-applies declared credentials on every run, which reset the user's
    # password to the one-time value (and re-added UPDATE_PASSWORD) each time the
    # Job was re-run. On a fresh realm, set an initial password from the admin
    # console (Users > esten > Credentials), or temporarily re-add a `credentials`
    # entry using the keycloak-user-esten-credentials Secret (ESTEN_TEMP_PASSWORD).
    users:
      - username: esten
        email: esten.rye@ryezone.com
        firstName: Esten
        lastName: Rye
        enabled: true
        emailVerified: true
        groups:
          - ACL_Keycloak_Administrator
          - ACL_SeaweedFS_AllBucketAdmin
          - ACL_grafana-admins
          - ACL_gitea-users
          - ACL_gitea-admins
          - ACL_Kubernetes_cluster-admin
          - ACL_Kubernetes_cluster-admin_core-infra
      # Machine identity for SeaweedFS (client-credentials grant). Add it to
      # an ACL_* group to grant access, e.g.
      #   groups: [ACL_SeaweedFS_ListAllBuckets]
      - username: service-account-seaweedfs-s3
        enabled: true
        serviceAccountClientId: seaweedfs-s3

    # SeaweedFS S3 web-identity client. Humans use the device flow
    # (no redirect URI needed), machines client-credentials. The audience
    # mapper makes `aud` = seaweedfs-s3 for both, matching the provider's
    # clientId in the SeaweedFS IAM config.
    clients:
      # Grafana login (OIDC authorization code + PKCE, public client: no
      # secret). The redirect URI is per cluster; add one per Grafana host.
      - clientId: grafana
        name: "Grafana"
        enabled: true
        publicClient: true
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://core-infra.grafana.rye.ninja/login/okta
        webOrigins:
          - https://core-infra.grafana.rye.ninja
        attributes:
          pkce.code.challenge.method: S256
        defaultClientScopes:
          - web-origins
          - acr
          - profile
          - roles
          - basic
          - email
          - groups
      # Gitea login (OIDC authorization code, confidential client). Not a PKCE
      # public client: Gitea 1.27's OIDC client cannot send a code challenge,
      # and enforcing PKCE here would reject its requests. The secret comes
      # from keycloak-gitea-client (shared with Gitea through 1Password).
      - clientId: gitea
        name: "Gitea"
        enabled: true
        clientAuthenticatorType: client-secret
        secret: "$(env:GITEA_CLIENT_SECRET)"
        publicClient: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://git.rye.ninja/user/oauth2/Keycloak/callback
        webOrigins:
          - https://git.rye.ninja
        attributes:
          # RP-initiated logout from the Gitea sign-out link.
          post.logout.redirect.uris: "https://git.rye.ninja/*"
        defaultClientScopes:
          - web-origins
          - acr
          - profile
          - roles
          - basic
          - email
          - groups
      # kubectl login (kubelogin / oidc-login): authorization code + PKCE,
      # public client, loopback redirect. The API server validates the ID token
      # (AuthenticationConfiguration, audience `kubernetes`).
      - clientId: kubernetes
        name: "Kubernetes"
        enabled: true
        publicClient: true
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - http://localhost:8000
          - http://localhost:18000
        attributes:
          pkce.code.challenge.method: S256
        defaultClientScopes:
          - web-origins
          - acr
          - profile
          - roles
          - basic
          - email
          - groups
      - clientId: seaweedfs-s3
        name: "SeaweedFS S3"
        enabled: true
        clientAuthenticatorType: client-secret
        secret: "$(env:SEAWEEDFS_S3_CLIENT_SECRET)"
        publicClient: false
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        attributes:
          oauth2.device.authorization.grant.enabled: "true"
        defaultClientScopes:
          - web-origins
          - acr
          - profile
          - roles
          - basic
          - email
          - groups
        protocolMappers:
          - name: seaweedfs-s3-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: seaweedfs-s3
              id.token.claim: "false"
              access.token.claim: "true"
