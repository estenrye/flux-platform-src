# Credentials are generated in-cluster (never fetched from an external store):
# bootstrap admin, the esten user's one-time password, and the confidential
# seaweedfs-s3 client's secret. symbols: 0 keeps them safe in env vars/YAML.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: keycloak-admin-password
  namespace: keycloak
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: keycloak-user-esten-password
  namespace: keycloak
spec:
  length: 24
  digits: 4
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: keycloak-seaweedfs-s3-client-secret
  namespace: keycloak
spec:
  length: 40
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: keycloak-gitea-client-secret
  namespace: keycloak
spec:
  length: 40
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
