apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opentelemetry-collector

# Shares the opentelemetry-collector namespace created by
# applications/opentelemetry-collector-daemonset; install it after that app.
resources:
  - resources/otelcol-cluster.opentelemetry-collector.yaml
  - resources/opentelemetry-collector-cluster.sa.yaml
  - resources/opentelemetry-collector-cluster.clusterrole.yaml
  - resources/opentelemetry-collector-cluster.clusterrolebinding.yaml
  - resources/otelcol-cluster.vpa.yaml
