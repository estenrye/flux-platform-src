# Static S3 key for the registry, limited to the harbor-registry bucket (identity
# harbor-registry in seaweedfs-s3-config). 1Password: core-infra/harbor-registry-s3.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-registry-s3
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: harbor-registry-s3
    creationPolicy: Owner
  data:
    - secretKey: REGISTRY_STORAGE_S3_ACCESSKEY
      remoteRef:
        key: harbor-registry-s3/accessKey
    - secretKey: REGISTRY_STORAGE_S3_SECRETKEY
      remoteRef:
        key: harbor-registry-s3/secretKey
