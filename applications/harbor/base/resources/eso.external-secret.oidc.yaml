# Harbor's Keycloak OIDC settings as CONFIG_OVERWRITE_JSON (core env, values.yaml),
# built here because it carries the client secret. The secret is generated in the
# keycloak namespace (keycloak-harbor-client), pushed to 1Password
# (harbor-oidc-client/client-secret) and read back here, so Keycloak's realm import
# and Harbor agree on it. Harbor applies the JSON on every start.
# docs/adr/0031-harbor-pull-through-registry.md
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-oidc
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: harbor-oidc
    creationPolicy: Owner
    template:
      data:
        CONFIG_OVERWRITE_JSON: |-
          {
            "auth_mode": "oidc_auth",
            "oidc_name": "Keycloak",
            "oidc_endpoint": "https://id.rye.ninja/realms/ryezone-labs",
            "oidc_client_id": "harbor",
            "oidc_client_secret": "{{ .secret }}",
            "oidc_scope": "openid,email,profile,groups,offline_access",
            "oidc_groups_claim": "groups",
            "oidc_admin_group": "ACL_harbor-admins",
            "oidc_user_claim": "preferred_username",
            "oidc_auto_onboard": true,
            "oidc_verify_cert": true,
            "oidc_logout": true,
            "project_creation_restriction": "adminonly"
          }
  data:
    - secretKey: secret
      remoteRef:
        key: harbor-oidc-client/client-secret
