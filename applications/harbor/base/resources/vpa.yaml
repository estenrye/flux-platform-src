# Recommendations only; copy them into values.yaml by hand.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: harbor-core
  namespace: harbor
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: harbor-core
  updatePolicy:
    updateMode: "Off"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: harbor-registry
  namespace: harbor
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: harbor-registry
  updatePolicy:
    updateMode: "Off"
