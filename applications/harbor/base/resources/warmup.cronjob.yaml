# Pulls the images in warmup.images.txt through Harbor so they are cached before
# the internet is needed (resources/warmup.py). Daily, after the bootstrap job.
# PING_URL: Healthchecks check for this job; create it (pcd-ce-deploy
# ansible/files/healthchecks-bootstrap.py, docs/runbooks/harbor.md) and sync the URL
# with the healthchecks-ping-harbor ExternalSecret; the job runs without it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: harbor-warmup
  namespace: harbor
  annotations:
    ignore-check.kube-linter.io/no-liveness-probe: "Short-lived batch script."
    ignore-check.kube-linter.io/no-readiness-probe: "Short-lived batch script; nothing sends it traffic."
    ignore-check.kube-linter.io/no-node-affinity: "Homelab cluster; no zone or role topology to express affinity against."
    ignore-check.kube-linter.io/env-value-from: "Credentials and the ping URL come from ESO-managed Secrets."
    ignore-check.kube-linter.io/read-secret-from-env-var: "The script reads its credentials from the environment."
    checkov.io/skip01: "CKV_K8S_35=The script reads its credentials from the environment."
    checkov.io/skip02: "CKV_K8S_11=Memory limit set; CPU limits only throttle."
    checkov.io/skip03: "CKV_K8S_10=CPU requests are set below; limits only throttle."
spec:
  schedule: "47 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: harbor-warmup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          priorityClassName: application
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: warmup
              image: docker.io/library/python
              imagePullPolicy: IfNotPresent
              command: ["python", "/script/warmup.py"]
              env:
                - name: ROBOT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: harbor-robot-runner
                      key: secret
                - name: PING_URL
                  valueFrom:
                    secretKeyRef:
                      name: healthchecks-ping-harbor
                      key: warmup
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
                - name: images
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: harbor-warmup
                items:
                  - key: warmup.py
                    path: warmup.py
            - name: images
              configMap:
                name: harbor-warmup
                items:
                  - key: images.txt
                    path: images.txt
