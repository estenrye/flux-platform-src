# Private CA that signs the registry token certificate (harbor-token).
#   harbor-selfsigned (Issuer) -> harbor-ca (Certificate, isCA)
#     -> harbor-ca (Issuer) -> harbor-token (Certificate)
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: harbor-selfsigned
  namespace: harbor
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: harbor-ca
  namespace: harbor
spec:
  ca:
    secretName: harbor-ca
