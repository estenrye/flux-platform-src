# Reconciles the proxy-cache registry endpoints and projects and the runners' robot
# account (resources/bootstrap.py). Daily; after changing the script run
#   kubectl -n harbor create job --from=cronjob/harbor-bootstrap harbor-bootstrap-manual
# Docker Hub credentials (avoid anonymous rate limits): create the Secret
# harbor-dockerhub with keys username and token; the job picks it up when present.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: harbor-bootstrap
  namespace: harbor
  annotations:
    ignore-check.kube-linter.io/no-liveness-probe: "Short-lived batch script."
    ignore-check.kube-linter.io/no-readiness-probe: "Short-lived batch script; nothing sends it traffic."
    ignore-check.kube-linter.io/no-node-affinity: "Homelab cluster; no zone or role topology to express affinity against."
    ignore-check.kube-linter.io/env-value-from: "Credentials come from ESO-managed Secrets."
    ignore-check.kube-linter.io/read-secret-from-env-var: "The script reads its credentials from the environment."
    checkov.io/skip01: "CKV_K8S_35=The script reads its credentials from the environment."
    checkov.io/skip02: "CKV_K8S_11=Memory limit set; CPU limits only throttle."
    checkov.io/skip03: "CKV_K8S_10=CPU requests are set below; limits only throttle."
spec:
  schedule: "17 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: harbor-bootstrap
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          priorityClassName: application
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: bootstrap
              image: docker.io/library/python
              imagePullPolicy: IfNotPresent
              command: ["python", "/script/bootstrap.py"]
              env:
                - name: HARBOR_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: harbor-secrets
                      key: HARBOR_ADMIN_PASSWORD
                - name: ROBOT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: harbor-robot-runner
                      key: secret
                - name: DOCKERHUB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: harbor-dockerhub
                      key: username
                      optional: true
                - name: DOCKERHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: harbor-dockerhub
                      key: token
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: harbor-bootstrap-script
