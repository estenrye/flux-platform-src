# One Secret carrying every key the chart's existingSecret options expect
# (values.yaml points them all at harbor-secrets). Generated once and never
# rotated: secretKey encrypts data in the database, and the others are shared
# between the Harbor components. The break-glass local admin password is
# HARBOR_ADMIN_PASSWORD (user "admin"); sign-in with Keycloak is configured
# in a later phase.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-secrets
  namespace: harbor
spec:
  refreshPolicy: CreatedOnce
  target:
    name: harbor-secrets
    creationPolicy: Owner
    template:
      data:
        HARBOR_ADMIN_PASSWORD: "{{ .adminPassword }}"
        secretKey: "{{ .secretKey }}"
        secret: "{{ .coreSecret | trunc 16 }}"
        CSRF_KEY: "{{ .csrfKey | trunc 32 }}"
        JOBSERVICE_SECRET: "{{ .jobserviceSecret }}"
        REGISTRY_HTTP_SECRET: "{{ .registrySecret }}"
        REGISTRY_PASSWD: "{{ .registryPassword }}"
        REGISTRY_HTPASSWD: '{{ htpasswd "harbor_registry_user" .registryPassword }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: harbor-admin-password
      rewrite:
        - regexp: { source: "password", target: "adminPassword" }
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: harbor-secret-key
      rewrite:
        - regexp: { source: "password", target: "secretKey" }
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: harbor-component-secret
      rewrite:
        - regexp: { source: "password", target: "coreSecret" }
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: harbor-component-secret
      rewrite:
        - regexp: { source: "password", target: "csrfKey" }
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: harbor-component-secret
      rewrite:
        - regexp: { source: "password", target: "jobserviceSecret" }
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: harbor-component-secret
      rewrite:
        - regexp: { source: "password", target: "registrySecret" }
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: harbor-component-secret
      rewrite:
        - regexp: { source: "password", target: "registryPassword" }
