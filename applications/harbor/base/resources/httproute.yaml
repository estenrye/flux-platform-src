# The routes the chart's nginx would apply, straight to core and portal: the
# Gateway terminates TLS for the public name, the chart's nginx (Service
# harbor, private CA) stays for in-cluster clients. Image pushes and pulls
# stream large blobs, so no request timeout.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
  namespace: harbor
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: harbor-gateway
      sectionName: https
  hostnames:
    - harbor.rye.ninja
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/ }
        - path: { type: PathPrefix, value: /service/ }
        - path: { type: PathPrefix, value: /v2/ }
        - path: { type: PathPrefix, value: /c/ }
        - path: { type: PathPrefix, value: /chartrepo/ }
      backendRefs:
        - name: harbor-core
          port: 80
      timeouts:
        request: 0s
        backendRequest: 0s
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: harbor-portal
          port: 80
