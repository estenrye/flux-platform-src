# Projects the ServiceAccount token SeaweedFS STS expects (audience
# seaweedfs-s3) into the registry container; the AWS_* variables in
# values.yaml point at it. The chart disables automounting, so the token is a
# projected volume rather than the default one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-registry
  namespace: harbor
spec:
  template:
    spec:
      containers:
        - name: registry
          volumeMounts:
            - name: seaweedfs-sts-token
              mountPath: /projected
              readOnly: true
      volumes:
        - name: seaweedfs-sts-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: seaweedfs-s3
                  expirationSeconds: 3600
                  path: token
