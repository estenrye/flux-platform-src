apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-db-ca
  namespace: harbor
spec:
  isCA: true
  commonName: harbor-db-ca
  secretName: harbor-db-ca
  duration: 87600h # 10 years
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - cert sign
    - crl sign
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: harbor-db-selfsigned
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-db-server-tls
  namespace: harbor
spec:
  isCA: false
  commonName: harbor-db-rw
  secretName: harbor-db-server-tls
  duration: 2160h # 90 days
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
  dnsNames:
    - harbor-db-rw
    - harbor-db-rw.harbor
    - harbor-db-rw.harbor.svc
    - harbor-db-rw.harbor.svc.cluster.local
    - harbor-db-r
    - harbor-db-r.harbor
    - harbor-db-r.harbor.svc
    - harbor-db-r.harbor.svc.cluster.local
    - harbor-db-ro
    - harbor-db-ro.harbor
    - harbor-db-ro.harbor.svc
    - harbor-db-ro.harbor.svc.cluster.local
  # CNPG reloads the server certificate when the Secret carries this label.
  secretTemplate:
    labels:
      cnpg.io/reload: ""
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: harbor-db-ca
---
# Client certificate for the streaming_replica role. Supplying it (with the CA
# as clientCASecret) stops CNPG from generating its own client CA from
# serverCASecret, which would need a ca.key this Secret does not carry.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-db-replication
  namespace: harbor
spec:
  isCA: false
  commonName: streaming_replica
  secretName: harbor-db-replication-tls
  duration: 2160h # 90 days
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - client auth
  secretTemplate:
    labels:
      cnpg.io/reload: ""
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: harbor-db-ca
