apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: harbor-db-backup
  namespace: harbor
spec:
  # Staggered from step-ca-db (03:00), keycloak-db (03:15), openbao-db (03:30),
  # grafana-db (03:45) and gitea-db (04:00).
  schedule: "0 15 4 * * *"
  backupOwnerReference: self
  cluster:
    name: harbor-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  target: primary
  immediate: true
