apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pdns4-shim for the core-infra cluster (migration off controlplane, which is
# being decommissioned). Plan: docs/superpowers/plans/2026-11-10-pdns4-shim-to-core-infra.md
#
# Differences from ../base (controlplane):
#  - Gateway class internal-dedicated (Calico 3.33's bundled Envoy Gateway,
#    LB IP from the lb-internal-routed ULA pool) instead of internal-eg.
#  - The Gateway is named pdns4-shim-gateway, not pdns4-shim: Calico 3.33
#    creates each Gateway's proxy ServiceAccount/Deployment/Service in the
#    Gateway's own namespace *named after the Gateway*, which would collide
#    with the shim's own objects (docs/memory/calico-33-gateway-namespace-mode.md).
#  - The shim's NetworkPolicy admits those proxy pods (same namespace, selected
#    by owning-gateway-name) instead of envoy-gateway-system.
#  - STAGED: the Gateway and routes carry external-dns.alpha.kubernetes.io/
#    controller: disabled so no external-dns instance publishes
#    pdns4-shim.rye.ninja to the new VIP yet. Removed at cutover.
#  - The API key comes from 1Password via ESO
#    (clusters/core-infra/resources/eso.external-secret.pdns4-shim-api-key.yaml).

resources:
  - ../base

patches:
  - path: patches/gateway.yaml
    target:
      kind: Gateway
      name: pdns4-shim
  - path: patches/http-route.yaml
    target:
      kind: HTTPRoute
      name: pdns4-shim
  - path: patches/udp-route.yaml
    target:
      kind: UDPRoute
      name: pdns4-shim
  - path: patches/network-policy.yaml
    target:
      kind: NetworkPolicy
      name: pdns4-shim
