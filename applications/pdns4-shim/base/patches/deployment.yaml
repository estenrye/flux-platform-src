- op: add
  path: /metadata/annotations
  value: {}
- op: add
  path: /metadata/annotations/checkov.io~1skip1
  value: "CKV_K8S_38=pdns4-shim requires the service account token to create/update DNSEndpoint objects via the Kubernetes API."
- op: add
  path: /metadata/annotations/checkov.io~1skip2
  value: "CKV_K8S_35=The shim consumes the Designate API key via an environment variable sourced from a Kubernetes Secret (pdns4-shim-api-key); this is the chart's only supported mechanism and credentials are not hardcoded in manifests."
- op: add
  path: /metadata/annotations/checkov.io~1skip3
  value: "CKV_K8S_40=The chart's podSecurityContext doesn't expose a runAsUser; it relies on the upstream image's baked-in non-root user via runAsNonRoot, which isn't independently configurable through this chart's values."
- op: add
  path: /metadata/annotations/checkov.io~1skip4
  value: "CKV_K8S_15=Image is pinned by digest (see kustomization.yaml's images: override); pull policy is immaterial for immutable digest references."
- op: add
  path: /metadata/annotations/ignore-check.kube-linter.io~1read-secret-from-env-var
  value: "The Designate API key has no file-based alternative in this chart; API_KEY via env from a Kubernetes Secret is the only supported mechanism."
- op: add
  path: /metadata/annotations/ignore-check.kube-linter.io~1env-value-from
  value: "pdns4-shim-api-key is a SOPS-encrypted secret applied at bootstrap; not present as a static resource in this application-level render (see clusters/controlplane/secrets)."
- op: add
  path: /metadata/annotations/ignore-check.kube-linter.io~1minimum-three-replicas
  value: "Single-instance homelab workload behind its own Gateway; replicas: 1 is the chart's own default and DNSEndpoint writes are idempotent."
- op: add
  path: /metadata/annotations/ignore-check.kube-linter.io~1no-node-affinity
  value: "Single-host homelab cluster; no zone or role topology to express affinity against."
- op: add
  path: /spec/strategy
  value:
    type: RollingUpdate
- op: add
  path: /spec/template/spec/restartPolicy
  value: Always
