apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-dns

# pdns4-shim impersonates the PowerDNS Authoritative Server REST API (v1) so
# Rackspace's OpenStack Designate pdns4 backend target can drive DNSEndpoint
# objects instead of talking to a real PowerDNS server. Shares the
# `external-dns` namespace with external-dns/unifi and external-dns/cloudflare
# (both already in this cluster's kustomization) since ExternalDNS's `crd`
# source watches DNSEndpoint objects cluster-wide regardless of namespace.
# Exposed publicly at pdns4-shim.rye.ninja (Designate calls in from outside
# the home network) via its own Gateway, same one-Gateway-per-app pattern as
# keycloak's id.rye.ninja.

helmCharts:
  - name: pdns4-shim
    repo: oci://registry-1.docker.io/estenrye
    version: 0.2.0
    releaseName: pdns4-shim
    namespace: external-dns
    valuesFile: values.yaml

resources:
  # No resources/certificate.yaml -- the Gateway's cert-manager.io/cluster-
  # issuer annotation (resources/gateway.yaml) auto-provisions it instead.
  - resources/gateway.yaml
  - resources/http-route.yaml
  - resources/udp-route.yaml
  - resources/network-policy.yaml

patches:
  - target:
      kind: Deployment
      name: pdns4-shim
    path: patches/deployment.yaml

images:
  # Pinned by digest for real (see values.yaml's comment on why the tag
  # alone can't be "0.2.0" here, same collision as every version before
  # it) -- also satisfies CKV_K8S_43 regardless of the tag string the
  # chart renders. amd64/arm64 image index published 2026-09-11 under the
  # "0.2"/"0"/"latest"/"main" tags (`docker buildx imagetools inspect
  # docker.io/estenrye/pdns4-shim:0.2.0` confirms that exact tag now
  # resolves to this chart's own OCI Helm artifact instead of the image --
  # the CI/CD helm job's `helm package --version "$chart_version"` reuses
  # the same tag string as the image's `type=semver,pattern={{version}}`
  # tag and runs after the docker job, so it wins the tag. The floating
  # "0.2" tag isn't touched by the helm job and resolves correctly --
  # `docker buildx imagetools inspect docker.io/estenrye/pdns4-shim:0.2`
  # is what produced the digest below.
  - name: docker.io/estenrye/pdns4-shim
    digest: sha256:748ee21d00a95e2f7b0c04eaba0a8ec036dd0aa9bf19d6ef59aa0f2f3e302cfb
