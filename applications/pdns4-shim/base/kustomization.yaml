apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-dns

# pdns4-shim impersonates the PowerDNS Authoritative Server REST API (v1) so
# Rackspace's OpenStack Designate pdns4 backend target can drive DNSEndpoint
# objects instead of talking to a real PowerDNS server. Shares the
# `external-dns` namespace with external-dns/unifi and external-dns/cloudflare
# (both already in this cluster's kustomization) since ExternalDNS's `crd`
# source watches DNSEndpoint objects cluster-wide regardless of namespace.
# Exposed publicly at pdns4-shim.rye.ninja (Designate calls in from outside
# the home network) via its own Gateway, same one-Gateway-per-app pattern as
# keycloak's id.rye.ninja.

helmCharts:
  - name: pdns4-shim
    repo: oci://registry-1.docker.io/estenrye
    version: 0.1.0
    releaseName: pdns4-shim
    namespace: external-dns
    valuesFile: values.yaml

resources:
  - resources/certificate.yaml
  - resources/gateway.yaml
  - resources/http-route.yaml
  - resources/network-policy.yaml
