apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pdns4-shim
  namespace: external-dns
  annotations:
    ignore-check.kube-linter.io/dangling-networkpolicypeer-podselector: "The Gateway's Envoy proxy pods are created at runtime by the Envoy Gateway controller in this namespace (Calico 3.33 GatewayNamespace mode); they are not in the static rendered manifest."
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pdns4-shim
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The Gateway's proxy (pdns4-shim.rye.ninja HTTPS-terminate listener)
    # forwarding to the shim's Service. Calico 3.33 runs each Gateway's proxy in
    # the Gateway's own namespace, selected by owning-gateway-name (there is no
    # envoy-gateway-system proxy).
    - from:
        - podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: pdns4-shim-gateway
              gateway.envoyproxy.io/owning-gateway-namespace: external-dns
      ports:
        - protocol: TCP
          port: 8081
    # Designate's pdns4 backend NOTIFY/SOA-poll traffic (pdns4-shim 0.1.1+,
    # exposed via UDPRoute -- resources/udp-route.yaml -- since 0.1.2),
    # forwarded by the same proxy as the rule above, just over UDP/53 instead
    # of TCP/8081. Port 10053, not 53 -- NetworkPolicy
    # ports match the pod's actual containerPort post-Service-DNAT (see the
    # apiserver egress rule below for the same convention), and the DNS
    # listener binds an unprivileged port precisely so this container never
    # needs NET_BIND_SERVICE.
    - from:
        - podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: pdns4-shim-gateway
              gateway.envoyproxy.io/owning-gateway-namespace: external-dns
      ports:
        - protocol: UDP
          port: 10053
  egress:
    # apiserver targetPort — post-DNAT rule, see the Calico DNAT memory —
    # for writing DNSEndpoint objects.
    - ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
        # AXFR pull from a zone's configured master (pdns4-shim 0.2.0+,
        # src/dns/axfr.rs) -- outbound TCP the shim itself initiates,
        # unlike every other rule above which is inbound-forwarded or
        # DNS/apiserver traffic. designate-mdns's AXFR listener
        # (docs/specs/2026-09-10-axfr-zone-transfer.md in the
        # pdns4-external-dns-rest-http-cr-shim repo) is port 5354, not 53.
        # No `to:` restriction, matching this block's existing pattern —
        # the destination is whatever host a zone's `masters` names.
        - protocol: TCP
          port: 5354
