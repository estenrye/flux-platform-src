# HTTPS-terminate, same reasoning as keycloak's id.rye.ninja: Rackspace's
# Designate calls in from outside the home network, so it needs a
# publicly-trusted cert rather than step-ca's self-signed chain.
# gatewayClassName: merged-eg shares the same Envoy proxy fleet/external
# address as every other app's own Gateway object.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pdns4-shim
  namespace: external-dns
spec:
  gatewayClassName: merged-eg
  listeners:
    - name: https
      hostname: pdns4-shim.rye.ninja
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: pdns4-shim-rye-ninja-tls
      allowedRoutes:
        namespaces:
          from: Same
