# HTTPS-terminate, same certificate reasoning as keycloak's id.rye.ninja
# (publicly-trusted cert rather than step-ca's self-signed chain, so
# pcd-ce-lab -- the only current consumer -- doesn't need to trust step-ca).
# Issuance is DNS-01 via Cloudflare (letsencrypt-prod ClusterIssuer), so this
# doesn't require the service to be internet-reachable.
#
# gatewayClassName: internal-dedicated (Calico 3.33's bundled Envoy Gateway on
# core-infra): pdns4-shim is only called by pcd-ce-lab, which is
# VLAN-100-resident, so it never needs a GUA-ingress VIP -- the Gateway's own
# LoadBalancer Service takes an address from Calico's lb-internal-routed ULA
# pool, sidestepping the on-link reply bug root-caused in
# docs/memory/node-gua-onlink-reply-unreliable.md (a GUA-sourced VLAN-100
# client's connection to a GUA VIP has its post-handshake packets silently
# dropped).
#
# Named pdns4-shim-gateway, not pdns4-shim: Calico 3.33 creates each Gateway's
# proxy ServiceAccount/Deployment/Service in the Gateway's own namespace named
# after the Gateway, which would collide with the shim's own objects
# (docs/memory/calico-33-gateway-namespace-mode.md).
# cert-manager.io/cluster-issuer here (not a standalone Certificate
# resource, unlike keycloak/step-ca's Gateways in this repo) -- cert-manager's
# gateway-shim controller is enabled cluster-wide
# (applications/cert-manager/base/values.yaml's `config.enableGatewayAPI:
# true`) and watches Gateways for this exact annotation, auto-creating a
# Certificate per TLS listener from its `certificateRefs`/`hostname`. This
# is a one-off for pdns4-shim, not a repo-wide convention change -- the
# other Gateways' standalone Certificate resources are untouched.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pdns4-shim-gateway
  namespace: external-dns
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: internal-dedicated
  listeners:
    - name: https
      hostname: pdns4-shim.rye.ninja
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: pdns4-shim-rye-ninja-tls
      allowedRoutes:
        namespaces:
          from: Same
    # Designate's pdns4 backend NOTIFY/SOA-poll traffic (pdns4-shim 0.1.2+,
    # see docs/specs/2026-09-09-dns-notify-soa-responder.md in the
    # pdns4-external-dns-rest-http-cr-shim repo), bound via UDPRoute
    # (resources/udp-route.yaml). No `hostname` or `tls` -- neither is
    # supported for a non-HTTP(S) protocol; Designate points at
    # pdns4-shim.rye.ninja:53, the same hostname/VIP as the https listener
    # above, just a different port -- this listener shares that VIP
    # deliberately (the Gateway's Service is pinned to Calico's
    # lb-internal-routed IPPool, which is what keeps VLAN-100-resident
    # clients like pcd-ce-lab off the on-link reply bug documented on the
    # https listener above; a standalone LoadBalancer Service for this
    # would need that same pinning independently re-verified).
    - name: dns
      port: 53
      protocol: UDP
      allowedRoutes:
        namespaces:
          from: Same
