apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao
  namespace: openbao
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 8201
    # Helm test hook (openbao-server-test) polls `bao status`.
    - from:
        - podSelector:
            matchLabels:
              helm.sh/hook: test
      ports:
        - protocol: TCP
          port: 8200
    # M3 step 6: ESO reads the crossplane-system ExternalSecrets (KV read +
    # kubernetes auth login) from this namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets-operator
      ports:
        - protocol: TCP
          port: 8200
    # M4 step 5: the talos-cluster-bootstrap Job (crossplane-system) reads/
    # writes Talos machine secrets directly via `bao` CLI + its own
    # kubernetes-auth login, not through ESO -- needs its own ingress rule.
    # Caught live: the Job's own egress policy was correct, but OpenBao's
    # ingress side had never granted crossplane-system at all, regardless
    # of egress correctness. Scoped to the specific pod label, not the
    # whole (broad, shared) crossplane-system namespace, matching the
    # helm-test-hook rule's precision above rather than the
    # external-secrets-operator rule's namespace-wide one (that namespace
    # is single-purpose; crossplane-system hosts many unrelated pods).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: crossplane-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: talos-cluster-bootstrap
      ports:
        - protocol: TCP
          port: 8200
  egress:
    # HA leader-election coordination + request forwarding between pods.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 8201
    # CNPG openbao-db storage backend.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: openbao-db
      ports:
        - protocol: TCP
          port: 5432
    # apiserver — service_registration "kubernetes" patches this pod's own
    # labels to reflect active/standby status. Calico evaluates egress
    # post-DNAT (docs/memory/calico-networkpolicy-dnat.md); Talos serves
    # 6443.
    - ports:
        - protocol: TCP
          port: 6443
    - ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
