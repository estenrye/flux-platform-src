# M4 completion step B6: the 8200 listener's server cert
# (openbao-server-tls's own tls.crt) is a bare leaf -- cert-manager does
# not automatically bundle the issuing intermediate into it. That's fine
# for same-cluster clients, which already trust controlplane's intermediate
# directly. Remote clusters (e.g. observability) only carry the fleet
# ROOT in their own trust bundle (applications/cert-manager-trust-manager's
# root-bundle.yaml, identical on every cluster) -- verifying a bare leaf
# from THEIR side would additionally require distributing controlplane's
# intermediate cert to every remote cluster, a real cross-cluster
# public-data distribution problem this avoids entirely by having the
# SERVER present its full chain instead, the standard TLS answer: any
# client that already trusts the root can verify a leaf + intermediate
# chain presented at handshake time, no extra trust material needed on
# the client side.
#
# Combines openbao-server-tls's own tls.crt (leaf) with controlplane's own
# intermediate (csi-driver-spiffe-ca's tls.crt) into one file, used ONLY
# by the NEW 8443 listener's tls_cert_file (see values.yaml) -- the
# existing 8200 listener keeps using openbao-server-tls's bare leaf
# directly, completely unchanged.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: openbao-server-8443-fullchain
spec:
  sources:
    - secret:
        name: openbao-server-tls
        key: tls.crt
    - secret:
        name: csi-driver-spiffe-ca
        key: tls.crt
  target:
    secret:
      key: tls.crt
