# S3 identity config for the filer's embedded gateway (filer.s3.existingConfigSecret).
# Keys are generated once and live only in this Secret; read the admin
# credentials from it to configure clients. "Admin" implies every S3 action,
# including the versioning and object-lock (retention / legal hold) APIs.
# Add per-bucket identities here (e.g. "Read:locked", "Write:versioned").
# harbor-registry: static key limited to the harbor-registry bucket for Harbor's
# registry, whose aws-sdk-go v1 credential chain has no web-identity provider
# (so the HarborRegistry STS role cannot be used). The key lives in 1Password
# (core-infra/harbor-registry-s3, fields accessKey and secretKey) and is read
# back in the harbor namespace. This Secret is CreatedOnce: on the live cluster
# the identity was added by patching the Secret, this template only matters for
# a fresh bootstrap. ReadAcp/WriteAcp are needed because Harbor's registry always
# sends x-amz-acl: private, which SeaweedFS rejects (AccessDenied) without them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-config
  namespace: seaweedfs
spec:
  refreshPolicy: CreatedOnce
  # The harbor-registry identity's key is read from 1Password.
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: seaweedfs-s3-config
    creationPolicy: Owner
    template:
      data:
        admin-access-key-id: "{{ .accessKey }}"
        admin-secret-access-key: "{{ .secretKey }}"
        seaweedfs_s3_config: |
          {
            "identities": [
              {
                "name": "admin",
                "credentials": [
                  { "accessKey": "{{ .accessKey }}", "secretKey": "{{ .secretKey }}" }
                ],
                "actions": ["Admin", "Read", "Write", "List", "Tagging"]
              },
              {
                "name": "harbor-registry",
                "credentials": [
                  { "accessKey": "{{ .harborAccessKey }}", "secretKey": "{{ .harborSecretKey }}" }
                ],
                "actions": ["Read:harbor-registry", "Write:harbor-registry", "List:harbor-registry", "ReadAcp:harbor-registry", "WriteAcp:harbor-registry"]
              }
            ]
          }
  # Each Password generator emits a single key named "password"; rewrite gives
  # them distinct names for the template. (spec.data[] cannot take a generator:
  # it requires remoteRef.)
  data:
    - secretKey: harborAccessKey
      remoteRef:
        key: harbor-registry-s3/accessKey
    - secretKey: harborSecretKey
      remoteRef:
        key: harbor-registry-s3/secretKey
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: seaweedfs-s3-admin-access-key
      rewrite:
        - regexp:
            source: "password"
            target: "accessKey"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: seaweedfs-s3-admin-secret-key
      rewrite:
        - regexp:
            source: "password"
            target: "secretKey"
