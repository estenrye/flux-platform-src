# S3 identity config for the filer's embedded gateway (filer.s3.existingConfigSecret).
# Keys are generated once and live only in this Secret; read the admin
# credentials from it to configure clients. "Admin" implies every S3 action,
# including the versioning and object-lock (retention / legal hold) APIs.
# Add per-bucket identities here (e.g. "Read:locked", "Write:versioned").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-config
  namespace: seaweedfs
spec:
  refreshPolicy: CreatedOnce
  target:
    name: seaweedfs-s3-config
    creationPolicy: Owner
    template:
      # Each Password generator emits a single key named "password"; rewrite gives
  # them distinct names for the template. (spec.data[] cannot take a generator:
  # it requires remoteRef.)
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: seaweedfs-s3-admin-access-key
      rewrite:
        - regexp:
            source: "password"
            target: "accessKey"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: seaweedfs-s3-admin-secret-key
      rewrite:
        - regexp:
            source: "password"
            target: "secretKey"
