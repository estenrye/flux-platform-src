# HMAC key SeaweedFS uses to sign its stateless STS session tokens
# (resources/eso.external-secret.iam-config.yaml). Must be identical on every
# filer replica, hence generated once here and shared through the Secret.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: seaweedfs-sts-signing-key
  namespace: seaweedfs
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
