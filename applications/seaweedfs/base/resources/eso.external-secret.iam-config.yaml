# SeaweedFS STS / OIDC configuration for the filer's embedded S3 gateway
# (filer.extraArgs -s3.iam.config, mounted from values.yaml). Static admin
# identity in seaweedfs-s3-config is unaffected.
#
# Two web-identity providers:
#   kubernetes -- the core-infra kube-apiserver as OIDC issuer. Pods (e.g. the
#     keycloak-db barman sidecar) present a projected ServiceAccount token with
#     audience "seaweedfs-s3"; roles are pinned to a ServiceAccount via oidc:sub.
#   keycloak   -- id.rye.ninja, realm ryezone-labs. Roles are chosen from the
#     "groups" claim through the provider's roleMapping.
#
# The kubernetes issuer is the in-cluster DNS name, so the core-infra
# apiserver is configured with
#   --service-account-issuer=https://kubernetes.default.svc.cluster.local
# (pcd-ce-deploy/tofu-pcd-talos-cluster/kms.tf). The apiserver runs with
# --anonymous-auth=false, so the JWKS is fetched through resources/jwks-proxy.yaml
# (an authenticated `kubectl proxy` that serves only /openid/v1/jwks) instead of
# directly from the apiserver.
#
# Keycloak role trust policies carry a ForAnyValue:StringEquals condition on the
# `groups` claim. The provider's roleMapping only picks a role when the caller
# names none; a caller that passes RoleArn is checked by the trust policy alone,
# so without the condition any realm user holding a seaweedfs-s3 token could
# assume AllBucketAdmin (verified live).
#
# This Secret is CreatedOnce (the STS signing key is generated into it and must
# not rotate), and ESO reverts manual edits to it. To roll out a change to this
# file: delete the Secret so ESO recreates it, then restart the filers:
#   kubectl -n seaweedfs delete secret seaweedfs-iam-config
#   kubectl -n seaweedfs rollout restart statefulset/seaweedfs-filer
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-iam-config
  namespace: seaweedfs
spec:
  refreshPolicy: CreatedOnce
  target:
    name: seaweedfs-iam-config
    creationPolicy: Owner
    template:
      data:
        iam.json: |
          {
            "sts": {
              "tokenDuration": "1h",
              "maxSessionLength": "12h",
              "issuer": "seaweedfs-sts",
              "signingKey": "{{ .signingKey | b64enc }}"
            },
            "providers": [
              {
                "name": "kubernetes",
                "type": "oidc",
                "enabled": true,
                "config": {
                  "issuer": "https://kubernetes.default.svc.cluster.local",
                  "clientId": "seaweedfs-s3",
                  "jwksUri": "http://jwks-proxy.seaweedfs.svc.cluster.local:8001/openid/v1/jwks",
                  "jtiReplayProtectionEnabled": false
                }
              },
              {
                "name": "keycloak",
                "type": "oidc",
                "enabled": true,
                "config": {
                  "issuer": "https://id.rye.ninja/realms/ryezone-labs",
                  "clientId": "seaweedfs-s3",
                  "jwksUri": "http://keycloak-http.keycloak.svc.cluster.local/realms/ryezone-labs/protocol/openid-connect/certs",
                  "roleMapping": {
                    "rules": [
                      { "claim": "groups", "value": "ACL_SeaweedFS_AllBucketAdmin", "role": "arn:aws:iam::role/AllBucketAdmin" },
                      { "claim": "groups", "value": "ACL_SeaweedFS_ListAllBuckets", "role": "arn:aws:iam::role/ListAllBuckets" },
                      { "claim": "groups", "value": "ACL_Keycloak_DbBackupOperator", "role": "arn:aws:iam::role/KeycloakDbBackupOperator" },
                      { "claim": "groups", "value": "ACL_Grafana_DbBackupOperator", "role": "arn:aws:iam::role/GrafanaDbBackupOperator" }
                    ]
                  }
                }
              }
            ],
            "policies": [
              {
                "name": "AllBucketAdmin",
                "document": {
                  "Version": "2012-10-17",
                  "Statement": [{ "Effect": "Allow", "Action": ["s3:*"], "Resource": ["arn:aws:s3:::*"] }]
                }
              },
              {
                "name": "ListAllBuckets",
                "document": {
                  "Version": "2012-10-17",
                  "Statement": [{ "Effect": "Allow", "Action": ["s3:ListAllMyBuckets", "s3:ListBucket"], "Resource": ["arn:aws:s3:::*"] }]
                }
              },
              {
                "name": "KeycloakDbBackupOperator",
                "document": {
                  "Version": "2012-10-17",
                  "Statement": [{
                    "Effect": "Allow",
                    "Action": ["s3:ListBucket", "s3:GetObject"],
                    "Resource": ["arn:aws:s3:::keycloak-db-barman", "arn:aws:s3:::keycloak-db-barman/*"]
                  }]
                }
              },
              {
                "name": "GrafanaDbBackupOperator",
                "document": {
                  "Version": "2012-10-17",
                  "Statement": [{
                    "Effect": "Allow",
                    "Action": ["s3:ListBucket", "s3:GetObject"],
                    "Resource": ["arn:aws:s3:::grafana-db-barman", "arn:aws:s3:::grafana-db-barman/*"]
                  }]
                }
              },
              {
                "name": "KeycloakDbBarman",
                "document": {
                  "Version": "2012-10-17",
                  "Statement": [{
                    "Effect": "Allow",
                    "Action": ["s3:ListBucket", "s3:GetBucketLocation", "s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
                    "Resource": ["arn:aws:s3:::keycloak-db-barman", "arn:aws:s3:::keycloak-db-barman/*"]
                  }]
                }
              },
              {
                "name": "GrafanaDbBarman",
                "document": {
                  "Version": "2012-10-17",
                  "Statement": [{
                    "Effect": "Allow",
                    "Action": ["s3:ListBucket", "s3:GetBucketLocation", "s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
                    "Resource": ["arn:aws:s3:::grafana-db-barman", "arn:aws:s3:::grafana-db-barman/*"]
                  }]
                }
              }
            ],
            "roles": [
              {
                "roleName": "AllBucketAdmin",
                "roleArn": "arn:aws:iam::role/AllBucketAdmin",
                "attachedPolicies": ["AllBucketAdmin"],
                "trustPolicy": {
                  "Version": "2012-10-17",
                  "Statement": [{
                    "Effect": "Allow",
                    "Principal": { "Federated": "keycloak" },
                    "Action": "sts:AssumeRoleWithWebIdentity",
                    "Condition": { "ForAnyValue:StringEquals": { "oidc:groups": ["ACL_SeaweedFS_AllBucketAdmin"] } }
                  }]
                }
              },
              {
                "roleName": "ListAllBuckets",
                "roleArn": "arn:aws:iam::role/ListAllBuckets",
                "attachedPolicies": ["ListAllBuckets"],
                "trustPolicy": {
                  "Version": "2012-10-17",
                  "Statement": [{
                    "Effect": "Allow",
                    "Principal": { "Federated": "keycloak" },
                    "Action": "sts:AssumeRoleWithWebIdentity",
                    "Condition": { "ForAnyValue:StringEquals": { "oidc:groups": ["ACL_SeaweedFS_ListAllBuckets"] } }
                  }]
                }
              },
              {
                "roleName": "KeycloakDbBackupOperator",
                "roleArn": "arn:aws:iam::role/KeycloakDbBackupOperator",
                "attachedPolicies": ["KeycloakDbBackupOperator"],
                "trustPolicy": {
                  "Version": "2012-10-17",
                  "Statement": [{
                    "Effect": "Allow",
                    "Principal": { "Federated": "keycloak" },
                    "Action": "sts:AssumeRoleWithWebIdentity",
                    "Condition": { "ForAnyValue:StringEquals": { "oidc:groups": ["ACL_Keycloak_DbBackupOperator"] } }
                  }]
                }
              },
              {
                "roleName": "GrafanaDbBackupOperator",
                "roleArn": "arn:aws:iam::role/GrafanaDbBackupOperator",
                "attachedPolicies": ["GrafanaDbBackupOperator"],
                "trustPolicy": {
                  "Version": "2012-10-17",
                  "Statement": [{
                    "Effect": "Allow",
                    "Principal": { "Federated": "keycloak" },
                    "Action": "sts:AssumeRoleWithWebIdentity",
                    "Condition": { "ForAnyValue:StringEquals": { "oidc:groups": ["ACL_Grafana_DbBackupOperator"] } }
                  }]
                }
              },
              {
                "roleName": "KeycloakDbBarman",
                "roleArn": "arn:aws:iam::role/KeycloakDbBarman",
                "attachedPolicies": ["KeycloakDbBarman"],
                "trustPolicy": {
                  "Version": "2012-10-17",
                  "Statement": [{
                    "Effect": "Allow",
                    "Principal": { "Federated": "kubernetes" },
                    "Action": "sts:AssumeRoleWithWebIdentity",
                    "Condition": { "StringEquals": { "oidc:sub": "system:serviceaccount:keycloak:keycloak-db" } }
                  }]
                }
              },
              {
                "roleName": "GrafanaDbBarman",
                "roleArn": "arn:aws:iam::role/GrafanaDbBarman",
                "attachedPolicies": ["GrafanaDbBarman"],
                "trustPolicy": {
                  "Version": "2012-10-17",
                  "Statement": [{
                    "Effect": "Allow",
                    "Principal": { "Federated": "kubernetes" },
                    "Action": "sts:AssumeRoleWithWebIdentity",
                    "Condition": { "StringEquals": { "oidc:sub": "system:serviceaccount:grafana:grafana-db" } }
                  }]
                }
              }
            ]
          }
  # The Password generator emits a single key named "password"; rewrite names
  # it for the template. (spec.data[] cannot take a generator.)
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: seaweedfs-sts-signing-key
      rewrite:
        - regexp:
            source: "password"
            target: "signingKey"
