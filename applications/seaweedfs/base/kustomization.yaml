apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# SeaweedFS 4.51 (chart 4.51.0) with S3 versioning + Object Lock. Filer
# metadata lives in the seaweedfs-db CNPG cluster (applications/seaweedfs-db),
# which also owns the seaweedfs namespace. Volumes are on csi-cinder-sc-retain.
# S3 identities come from an ESO-generated Secret (resources/eso.*), not the
# chart's, whose credentials are generated with Helm `lookup` and so are not
# stable across `helm template` renders.

namespace: seaweedfs

resources:
  - resources/network-policy.yaml
  - resources/podmonitor.yaml
  - resources/eso.password-generator.s3-access-key.yaml
  - resources/eso.password-generator.s3-secret-key.yaml
  - resources/eso.external-secret.s3-config.yaml

helmCharts:
- name: seaweedfs
  repo: https://seaweedfs.github.io/seaweedfs/helm
  version: 4.51.0
  releaseName: seaweedfs
  namespace: seaweedfs
  valuesFile: values.yaml

# Pin by tag + digest so Renovate tracks the version and the digest is
# immutable (the chart's default is the floating chrislusf/seaweedfs:4.51).
images:
  - name: chrislusf/seaweedfs
    newTag: "4.51"
    digest: sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8

patches:
  # The bucket-creation hook is rendered as a plain Job (no Helm to run
  # hooks). Jobs are immutable, so let Flux delete and recreate it when the
  # spec changes (e.g. a chart bump or a new bucket).
  - target:
      kind: Job
      name: seaweedfs-bucket-hook
    patch: |-
      - op: add
        path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1force
        value: enabled
  # kustomize's namespace transformer skips the chart's Job (no metadata in the
  # template); set it explicitly. The hook only talks to the master and filer,
  # so it needs no apiserver token.
  - target:
      kind: Job
      name: seaweedfs-bucket-hook
    patch: |-
      - op: add
        path: /metadata/namespace
        value: seaweedfs
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false

  # Linter suppressions on chart-generated workloads.
  - target:
      kind: StatefulSet
      name: seaweedfs-(master|volume|filer)
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: not-used
        annotations:
          ignore-check.kube-linter.io/no-node-affinity: "Single-site homelab cluster; no zone or role topology to express affinity against."
          ignore-check.kube-linter.io/no-rolling-update-strategy: "StatefulSets use the default RollingUpdate update strategy (spec.updateStrategy); the linter only inspects spec.strategy."
          checkov.io/skip01: "CKV_K8S_38=Chart default (global.seaweedfs.automountServiceAccountToken: true) with its seaweedfs ServiceAccount; not yet confirmed safe to disable."
  - target:
      kind: StatefulSet
      name: seaweedfs-filer
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: seaweedfs-filer
        annotations:
          ignore-check.kube-linter.io/minimum-three-replicas: "Filers are stateless (metadata is in seaweedfs-db); two replicas is the intended HA floor for this size."
          ignore-check.kube-linter.io/env-value-from: "seaweedfs-db-app is generated by the CNPG operator from the seaweedfs-db Cluster (applications/seaweedfs-db); it is not in this app's static render."
          ignore-check.kube-linter.io/read-secret-from-env-var: "The filer store is configured only through WEED_POSTGRES2_* environment variables (filer.toml env overrides); there is no file-based credential option."
          checkov.io/skip02: "CKV_K8S_35=The filer store is configured only through WEED_POSTGRES2_* environment variables; there is no file-based credential option."
  - target:
      kind: Job
      name: seaweedfs-bucket-hook
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: seaweedfs-bucket-hook
        annotations:
          ignore-check.kube-linter.io/no-liveness-probe: "Run-to-completion Job; probes do not apply."
          ignore-check.kube-linter.io/job-ttl-seconds-after-finished: "No TTL on purpose: with the force-recreate annotation, Flux recreates a Job that disappears, so a TTL re-ran the bucket hook hourly. The finished Job stays until its spec changes (chart bump or new bucket)."
          ignore-check.kube-linter.io/no-readiness-probe: "Run-to-completion Job; probes do not apply."
          ignore-check.kube-linter.io/restart-policy: "Run-to-completion Job; restartPolicy Never is upstream's choice and backoffLimit retries failed pods."
          ignore-check.kube-linter.io/no-node-affinity: "Single-site homelab cluster; no zone or role topology to express affinity against."
  - target:
      kind: ClusterRoleBinding
      name: seaweedfs-rw-crb
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: seaweedfs-rw-crb
        annotations:
          ignore-check.kube-linter.io/access-to-create-pods: "Upstream chart ClusterRole (seaweedfs-rw-cr); scoped to the seaweedfs service account."
