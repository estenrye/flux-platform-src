apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
  labels:
    app.kubernetes.io/name: ntfy
  annotations:
    reloader.stakater.com/auto: "true"
    ignore-check.kube-linter.io/no-node-affinity: No zone or role topology to express node affinity against.
    ignore-check.kube-linter.io/minimum-three-replicas: ntfy holds live subscriber connections and visitor rate limits in process, so a second replica would split them; state is in ntfy-db.
    ignore-check.kube-linter.io/env-value-from: ntfy-db-app is generated by CNPG and ntfy-admin by ESO; neither is a static resource in this render.
    ignore-check.kube-linter.io/read-secret-from-env-var: ntfy reads database-url and auth-users from NTFY_* environment variables; it has no file-based option for them.
    ignore-check.kube-linter.io/restart-policy: Deployments always use restartPolicy Always.
    checkov.io/skip1: CKV_K8S_11=Memory limits are set and the VPA recommends CPU; CPU limits only add throttling.
    checkov.io/skip2: CKV_K8S_35=ntfy reads database-url and auth-users from NTFY_* environment variables; it has no file-based option for them.
spec:
  # One replica: ntfy keeps per-visitor rate limits and live subscriber
  # connections in process, so a second replica would split subscribers and
  # miss messages published to the other. State is in ntfy-db, so the pod
  # itself is disposable and a rolling update is safe.
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
    spec:
      restartPolicy: Always
      priorityClassName: platform
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ntfy
          image: docker.io/binwiederhier/ntfy
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NTFY_BASE_URL
              value: https://ntfy.rye.ninja
            - name: NTFY_LISTEN_HTTP
              value: ":8080"
            # Visitor IPs (rate limits) come from X-Forwarded-For, set by Envoy.
            - name: NTFY_BEHIND_PROXY
              value: "true"
            # Nothing is readable or writable until an ACL or a user grants it.
            - name: NTFY_AUTH_DEFAULT_ACCESS
              value: deny-all
            - name: NTFY_ENABLE_LOGIN
              value: "true"
            # No attachments (attachment-cache-dir unset) and no iOS upstream
            # (upstream-base-url unset): the pod needs no writable volume.
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: ntfy-db-app
                  key: uri
            # CNPG's `uri` has no TLS parameters; verify-full against the
            # private CA from the server Secret.
            - name: NTFY_DATABASE_URL
              value: $(DB_URI)?sslmode=verify-full&sslrootcert=/etc/ntfy-db-ca/ca.crt&pool_max_conns=10&pool_conn_max_idle_time=5m
            # `<user>:<bcrypt>:admin`, created or updated at start.
            - name: NTFY_AUTH_USERS
              valueFrom:
                secretKeyRef:
                  name: ntfy-admin
                  key: auth-users
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: db-ca
              mountPath: /etc/ntfy-db-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: db-ca
          secret:
            secretName: ntfy-db-server-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
