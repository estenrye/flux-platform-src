# Random values so nothing secret is rendered into git. Each emits one key,
# "password".
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ntfy-admin-password
  namespace: ntfy
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# oauth2-proxy's cookie secret must be 16, 24 or 32 bytes: 32 ASCII characters.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ntfy-oauth2-proxy-cookie-secret
  namespace: ntfy
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
