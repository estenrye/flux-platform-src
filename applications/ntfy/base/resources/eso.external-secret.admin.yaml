# Break-glass ntfy admin. CreatedOnce: the bcrypt hash is salted, so a refresh
# would change the Secret every time and restart the pod. Read the password with
#   kubectl -n ntfy get secret ntfy-admin -o jsonpath='{.data.password}' | base64 -d
# Further users and access tokens are created with `ntfy user` / `ntfy token`
# (kubectl -n ntfy exec deploy/ntfy -- ntfy token add <user>); the admin here
# is re-asserted on every start, other users are untouched.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-admin
  namespace: ntfy
spec:
  refreshPolicy: CreatedOnce
  target:
    name: ntfy-admin
    creationPolicy: Owner
    template:
      data:
        username: admin
        password: "{{ .password }}"
        auth-users: "admin:{{ .password | bcrypt }}:admin"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ntfy-admin-password
