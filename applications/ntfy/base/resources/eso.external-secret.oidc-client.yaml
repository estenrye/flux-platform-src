# ntfy's Keycloak client secret for oauth2-proxy. Generated in the keycloak
# namespace (applications/keycloak: keycloak-ntfy-client), backed up to the
# core-infra 1Password vault by a PushSecret and read back here, so Keycloak's
# realm import and oauth2-proxy always agree on it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-oidc-client
  namespace: ntfy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: ntfy-oidc-client
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: ntfy-oidc-client/client-secret
