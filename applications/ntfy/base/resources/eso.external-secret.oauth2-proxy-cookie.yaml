apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-oauth2-proxy-cookie
  namespace: ntfy
spec:
  refreshPolicy: CreatedOnce
  target:
    name: ntfy-oauth2-proxy-cookie
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ntfy-oauth2-proxy-cookie-secret
      rewrite:
        - regexp:
            source: "password"
            target: "cookie-secret"
