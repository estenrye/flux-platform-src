apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ntfy-db
  description: |-
    Highly available PostgreSQL cluster for ntfy (message cache, users, access control),
    managed by the CloudNativePG operator. TLS comes from a cert-manager
    self-signed CA.
  tags:
    - database
    - postgresql
    - platform
    - infrastructure
spec:
  type: service
  lifecycle: production
  owner: platform-engineering
