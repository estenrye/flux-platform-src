# Replaces the old chart extraDeploy OnePasswordItem of the same name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: curse-forge-api-key
spec:
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  target:
    name: curse-forge-api-key
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: credential
      remoteRef:
        key: minecraft-api-key.curseforge.rye.ninja/credential
