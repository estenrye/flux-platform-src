# Replaces the old chart extraDeploy OnePasswordItem of the same name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rcon-password
spec:
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  target:
    name: rcon-password
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: password
      remoteRef:
        key: rcon-password/password
