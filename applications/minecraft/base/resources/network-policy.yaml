apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minecraft
  annotations:
    ignore-check.kube-linter.io/dangling-networkpolicy: "The server pods come from the per-instance Helm chart in each overlay; the standalone base render has none to select."
    ignore-check.kube-linter.io/dangling-networkpolicypeer-podselector: "The Gateway's Envoy proxy pods are created at runtime by the Envoy Gateway controller; they are not in the static rendered manifests."
spec:
  # Server pod only (server + backup sidecar). Not podSelector: {} -- that would
  # also select the Gateways' Envoy proxy pods in this namespace and cut off
  # their xDS connection to envoy-gateway-system.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minecraft
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Players, via the game Gateway's Envoy proxy.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-name: game-gateway
      ports:
        - protocol: TCP
          port: 25565
    # BlueMap, from the Gateway's Envoy proxy (runs in this namespace under
    # Calico 3.33, so no namespaceSelector).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-name: map-gateway
      ports:
        - protocol: TCP
          port: 8100
    # TickScope (9101) and mc-monitor (8080), scraped by the per-node
    # OpenTelemetry collector (target allocator, PodMonitor in this directory).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otelcol-ds-collector
      ports:
        - protocol: TCP
          port: 9101
        - protocol: TCP
          port: 8080
  egress:
    # DNS; HTTPS/HTTP for Mojang, Modrinth, CurseForge, Spiget, Wasabi (world
    # download + rclone backups) and the init container's mod downloads.
    - ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
