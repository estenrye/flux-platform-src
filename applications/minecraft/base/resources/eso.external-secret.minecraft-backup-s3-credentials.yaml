# Replaces the old chart extraDeploy OnePasswordItem of the same name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minecraft-backup-s3-credentials
spec:
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  target:
    name: minecraft-backup-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Delete
  dataFrom:
    - extract:
        key: backup.minecraft.rye.ninja
