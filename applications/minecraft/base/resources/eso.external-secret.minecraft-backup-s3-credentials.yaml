# Replaces the old chart extraDeploy OnePasswordItem of the same name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minecraft-backup-s3-credentials
spec:
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  target:
    name: minecraft-backup-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    # rclone.conf is a file attached to the 1Password item, not a field, so
    # `dataFrom.extract` does not return it. The chart mounts exactly this key.
    - secretKey: rclone.conf
      remoteRef:
        key: backup.minecraft.rye.ninja/rclone.conf
