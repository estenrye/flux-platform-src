! FRR configuration for the UniFi gateway — `controlplane` cluster BGP peering,
! plus BGP advertisement of each other talos-kvm cluster's own dedicated
! infra subnet (XNetworkSegment, M4 -- see INFRA-SUBNETS-OUT below).
! Upload by hand via UniFi Network > Settings > Routing > BGP (M1 design §4.4,
! execution step 1). This file is the source of truth; the network chainsaw
! suite drift-checks the running config against it.
!
! Gateway AS 64512 peers with Calico AS 64513 over IPv6 on VLAN 100.
! Talos nodes initiate sessions toward the gateway's VLAN 100 GUA
! (2607:3640:1064:270::1). Node source addresses are SLAAC-derived and not
! statically predictable, so the gateway accepts dynamic neighbors from the
! VLAN 100 GUA /64 (and the ULA /64, in case peering moves to ULA later).
!
! Safety properties encoded here:
!   - Inbound: only the two Calico VIP pools are accepted (internal ULA pool
!     fd97:45c2:b3a1:f00::/112 and ingress GUA pool
!     2607:3640:1064:27f::/112), as the /112 or more-specific routes. Both
!     are routed, not-on-link, dedicated blocks (services-network design,
!     2026-07-15) — no VLAN, no RA; the gateway's BGP-learned routes are the
!     only path to them. This replaces the prior on-link-carved pools
!     (fd97:45c2:b3a1:100:ffff::/112, 2607:3640:1064:270:ffff::/112), which
!     lived inside VLAN 100's connected /64s and caused client NDP
!     flakiness plus a gateway-side forwarding failure for BGP routes
!     nested in a connected subnet (root-caused 2026-07-15).
!   - Outbound: only each dedicated per-cluster infra subnet is announced
!     (INFRA-SUBNETS-OUT, e.g. fd97:45c2:b3a1:200::/64 for `observability`'s
!     own VLAN 200 -- XNetworkSegment, M4) -- explicit allowlist, same
!     pattern as CALICO-VIPS-IN, not a blanket redistribute-connected (this
!     gateway has other VLANs/WAN not meant for Calico's routing table).
!     Everything else is still denied, including the ULA + GUA VIP prefixes,
!     which must never leave the site — the gateway has no upstream BGP
!     peers, but the explicit deny-all fallback guards against a future peer
!     inheriting an unfiltered session. Verification includes a WAN-side
!     check that neither VIP pool is reachable (M1 design step 11).
!
! GUA RENUMBER: the 2607:3640:1064:27f:: ingress VIP block is a manual pick
! from gua_pd_prefix in providers/kvm/network.yaml (the TFiber PD, currently
! a /60), not a formula — regenerate this file per
! docs/runbooks/gua-prefix-renumber.md on ISP re-delegation. The BGP peering
! ranges below (listen range) are unaffected — peering stays on VLAN 100's
! gua_prefix/ULA /64s regardless of where the VIP pools live.
!
frr defaults traditional
!
! REVISED 2026-08-05 (M4, caught live): `observability` used to reach the
! gateway via a static on-link route over VLAN 100's shared bridge, back
! when its VMs actually lived on that bridge. Now that it has its own
! dedicated VLAN 200 (XNetworkSegment), that assumption is false -- the old
! `ipv6 route fd97:45c2:b3a1:200::/64 br100` entry pointed at the wrong
! interface and was removed. fd97:45c2:b3a1:200::/64 is now directly
! connected on the gateway's own br200 interface; controlplane's Calico
! just needs to learn it over the existing BGP session instead of via a
! static route, same as it would for any future XNetworkSegment-provisioned
! cluster. See the `network` statement under address-family below, and
! INFRA-SUBNETS-OUT, which is what actually permits it outbound.
!
router bgp 64512
 bgp router-id 10.45.0.1
 no bgp ebgp-requires-policy
 bgp listen limit 16
 neighbor CALICO peer-group
 neighbor CALICO remote-as 64513
 neighbor CALICO description Talos controlplane cluster (Calico)
 bgp listen range 2607:3640:1064:270::/64 peer-group CALICO
 bgp listen range fd97:45c2:b3a1:100::/64 peer-group CALICO
 !
 address-family ipv6 unicast
  neighbor CALICO activate
  neighbor CALICO prefix-list CALICO-VIPS-IN in
  neighbor CALICO prefix-list INFRA-SUBNETS-OUT out
  ! `observability`'s VLAN 200 infra subnet (XNetworkSegment) -- directly
  ! connected on this gateway's own br200 interface, so `network` here is
  ! enough to put it in the BGP RIB; INFRA-SUBNETS-OUT below is what
  ! actually permits it outbound to Calico. Add one `network` line per
  ! future XNetworkSegment-provisioned cluster's infraSubnet.
  network fd97:45c2:b3a1:200::/64
 exit-address-family
!
ipv6 prefix-list CALICO-VIPS-IN seq 10 permit fd97:45c2:b3a1:f00::/112 le 128
ipv6 prefix-list CALICO-VIPS-IN seq 20 permit 2607:3640:1064:27f::/112 le 128
ipv6 prefix-list CALICO-VIPS-IN seq 90 deny ::/0 le 128
!
! Explicit allowlist of per-cluster infra subnets Calico is allowed to
! learn from this gateway -- same narrow-allowlist pattern as
! CALICO-VIPS-IN, not a blanket redistribute-connected (this gateway has
! other VLANs/WAN not meant for Calico's routing table). Add one `permit`
! line per future XNetworkSegment-provisioned cluster's infraSubnet,
! ordered before the deny-all fallback.
ipv6 prefix-list INFRA-SUBNETS-OUT seq 10 permit fd97:45c2:b3a1:200::/64
ipv6 prefix-list INFRA-SUBNETS-OUT seq 90 deny ::/0 le 128
!
