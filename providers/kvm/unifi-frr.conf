! FRR configuration for the UniFi gateway — `controlplane` cluster BGP peering,
! plus BGP advertisement of each other talos-kvm cluster's own dedicated
! infra subnet (XNetworkSegment, M4 -- see INFRA-SUBNETS-OUT below).
! Upload by hand via UniFi Network > Settings > Routing > BGP (M1 design §4.4,
! execution step 1). This file is the source of truth; the network chainsaw
! suite drift-checks the running config against it.
!
! Gateway AS 64512 peers with Calico AS 64513 over IPv6 on VLAN 179, a
! dedicated client-free peering VLAN (cut over from VLAN 100 on 2026-09-09;
! see the `router bgp` block below). Talos nodes initiate sessions toward
! the gateway's VLAN 179 address. Node source addresses are SLAAC-derived and
! not statically predictable, so the gateway accepts dynamic neighbors from
! the VLAN 179 ULA /64 (fd97:45c2:b3a1:179::/64) via `bgp listen range`.
! There are no per-node `neighbor` statements; the listen range is the only
! thing that admits peers.
!
! A second peering VLAN, 1179 (fd97:45c2:b3a1:1179::/64, gateway address
! fd97:45c2:b3a1:1179::1), is OpenStack-managed and hosts Talos clusters
! provisioned in OpenStack. Each cluster brings its own AS number, so the
! OPENSTACK peer-group uses `remote-as external` (any AS except 64512) instead
! of a fixed AS. Isolation between BGP speakers on that VLAN is enforced by
! OpenStack security groups (speakers may reach only the gateway address), not
! by this file. Inbound is the same CALICO-VIPS-IN allowlist; outbound is
! deny-all (DENY-ALL). Note the allowlist is per-block, not per-AS: any
! OPENSTACK peer may announce any /112 in the VIP blocks, so give each
! cluster a distinct /112 (overlapping announcements from different ASes are
! resolved by ordinary BGP best-path, not rejected).
!
! Safety properties encoded here:
!   - Inbound: only the two Calico VIP blocks are accepted (internal ULA block
!     fd97:45c2:b3a1:f00::/64 and ingress GUA block 2607:3640:1064:27f::/64),
!     and only as /112 or more-specific routes, so each peer/cluster can be
!     handed its own /112 from either block (currently f00::/112 and
!     27f::/112 are the pools in use). Both
!     are routed, not-on-link, dedicated blocks (services-network design,
!     2026-07-15) — no VLAN, no RA; the gateway's BGP-learned routes are the
!     only path to them. This replaces the prior on-link-carved pools
!     (fd97:45c2:b3a1:100:ffff::/112, 2607:3640:1064:270:ffff::/112), which
!     lived inside VLAN 100's connected /64s and caused client NDP
!     flakiness plus a gateway-side forwarding failure for BGP routes
!     nested in a connected subnet (root-caused 2026-07-15).
!   - Outbound: only each dedicated per-cluster infra subnet is announced
!     (INFRA-SUBNETS-OUT, e.g. fd97:45c2:b3a1:200::/64 for `observability`'s
!     own VLAN 200 -- XNetworkSegment, M4) -- explicit allowlist, same
!     pattern as CALICO-VIPS-IN, not a blanket redistribute-connected (this
!     gateway has other VLANs/WAN not meant for Calico's routing table).
!     Everything else is still denied, including the ULA + GUA VIP prefixes,
!     which must never leave the site — the gateway has no upstream BGP
!     peers, but the explicit deny-all fallback guards against a future peer
!     inheriting an unfiltered session. Verification includes a WAN-side
!     check that neither VIP pool is reachable (M1 design step 11).
!
! GUA RENUMBER: the 2607:3640:1064:27f:: ingress VIP block is a manual pick
! from gua_pd_prefix in providers/kvm/network.yaml (the TFiber PD, currently
! a /60), not a formula — regenerate this file per
! docs/runbooks/gua-prefix-renumber.md on ISP re-delegation. The only GUA
! prefix in this file is the ingress VIP pool on CALICO-VIPS-IN seq 20; update
! it there (plus network.yaml ingress_vip_*, applications/calico/controlplane
! ippool-lb-ingress-routed.yaml and bgp-configuration.yaml) when the PD changes. The
! BGP peering listen range below is ULA-only (VLAN 179) and is unaffected,
! regardless of where the VIP pools live.
!
frr defaults traditional
!
! REVISED 2026-08-05 (M4, caught live): `observability` used to reach the
! gateway via a static on-link route over VLAN 100's shared bridge, back
! when its VMs actually lived on that bridge. Now that it has its own
! dedicated VLAN 200 (XNetworkSegment), that assumption is false -- the old
! `ipv6 route fd97:45c2:b3a1:200::/64 br100` entry pointed at the wrong
! interface and was removed. fd97:45c2:b3a1:200::/64 is now directly
! connected on the gateway's own br200 interface; controlplane's Calico
! just needs to learn it over the existing BGP session instead of via a
! static route, same as it would for any future XNetworkSegment-provisioned
! cluster. See the `network` statement under address-family below, and
! INFRA-SUBNETS-OUT, which is what actually permits it outbound.
!
router bgp 64512
 bgp router-id 10.45.0.1
 no bgp ebgp-requires-policy
 bgp listen limit 32
 neighbor CALICO peer-group
 neighbor CALICO remote-as 64513
 neighbor CALICO description Talos controlplane cluster (Calico)
 ! 2026-09-08: dedicated, client-free VLAN 179 for the peering session
 ! itself (docs/superpowers/specs/2026-09-08-calico-bgp-peering-vlan179-design.md)
 ! -- fixes the same on-link-hairpin bug class as the 2026-07-15 VIP-pool
 ! move, this time for the BGP session addresses. Final cutover 2026-09-09
 ! (plan Task 9 of the same design; see docs/adr/0022-unifi-bgp-load-balancer-vips.md's
 ! amendment): the two VLAN 100 listen ranges this peer-group used to carry
 ! (2607:3640:1064:270::/64, fd97:45c2:b3a1:100::/64) are removed now that
 ! all 6 nodes are confirmed peering from VLAN 179 (verified live,
 ! 2026-09-09: `show bgp ipv6 unicast summary` showed all 6 sessions
 ! sourced from fd97:45c2:b3a1:179::/64, hours of stable uptime, zero
 ! flapping). This cutover was itself blocked pending a separate, now-fixed
 ! bug (docs/memory/node-gua-onlink-reply-unreliable.md, ADR-28: a Talos
 ! node's reply to a genuinely VLAN-100-resident client was silently
 ! dropped on-link) -- that bug is fixed by ADR-28's routing DaemonSet, a
 ! node-side fix unrelated to this peering address; this cutover just
 ! removes VLAN 100's now-unneeded peering ranges once the real blocker
 ! was resolved.
 bgp listen range fd97:45c2:b3a1:179::/64 peer-group CALICO
 !
 ! OpenStack-managed VLAN 1179: dynamic AS per Talos cluster (see header).
 neighbor OPENSTACK peer-group
 neighbor OPENSTACK remote-as external
 neighbor OPENSTACK description Talos clusters in OpenStack (VLAN 1179, dynamic AS)
 bgp listen range fd97:45c2:b3a1:1179::/64 peer-group OPENSTACK
 !
 address-family ipv6 unicast
  neighbor CALICO activate
  neighbor CALICO prefix-list CALICO-VIPS-IN in
  neighbor CALICO prefix-list INFRA-SUBNETS-OUT out
  neighbor OPENSTACK activate
  neighbor OPENSTACK prefix-list CALICO-VIPS-IN in
  neighbor OPENSTACK prefix-list DENY-ALL out
  ! `observability`'s VLAN 200 infra subnet (XNetworkSegment) -- directly
  ! connected on this gateway's own br200 interface, so `network` here is
  ! enough to put it in the BGP RIB; INFRA-SUBNETS-OUT below is what
  ! actually permits it outbound to Calico. Add one `network` line per
  ! future XNetworkSegment-provisioned cluster's infraSubnet.
  network fd97:45c2:b3a1:200::/64
 exit-address-family
!
! Each VIP block is accepted as any /112 (or more specific) inside its /64, so
! a new peer/cluster can be given its own /112 without touching this file.
! There is no per-peer isolation: any peer in the listen range may announce any
! /112 in these blocks (acceptable -- VLAN 179 is client-free and operator-owned).
ipv6 prefix-list CALICO-VIPS-IN seq 10 permit fd97:45c2:b3a1:f00::/64 ge 112 le 128
! seq 20 is the only GUA-derived prefix in this file: update on PD renumber
! (docs/runbooks/gua-prefix-renumber.md).
ipv6 prefix-list CALICO-VIPS-IN seq 20 permit 2607:3640:1064:27f::/64 ge 112 le 128
ipv6 prefix-list CALICO-VIPS-IN seq 90 deny ::/0 le 128
!
! Explicit allowlist of per-cluster infra subnets Calico is allowed to
! learn from this gateway -- same narrow-allowlist pattern as
! CALICO-VIPS-IN, not a blanket redistribute-connected (this gateway has
! other VLANs/WAN not meant for Calico's routing table). Add one `permit`
! line per future XNetworkSegment-provisioned cluster's infraSubnet,
! ordered before the deny-all fallback.
ipv6 prefix-list INFRA-SUBNETS-OUT seq 10 permit fd97:45c2:b3a1:200::/64
ipv6 prefix-list INFRA-SUBNETS-OUT seq 90 deny ::/0 le 128
!
! Announce nothing to the OPENSTACK peer-group.
ipv6 prefix-list DENY-ALL seq 10 deny ::/0 le 128
!
