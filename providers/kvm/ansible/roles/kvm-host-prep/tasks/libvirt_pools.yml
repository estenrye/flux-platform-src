---
# Defines libvirt storage pools of type zfs over the vms/appliances
# datasets. Ports prep-kvm-host.sh's define_pool() function.

- name: Compute the libvirt ZFS pool definitions for this host
  ansible.builtin.set_fact:
    kvm_host_prep_pools:
      - name: vms
        dataset: "{{ kvm_host_prep_pool }}/vms"
      - name: appliances
        dataset: "{{ kvm_host_prep_pool }}/appliances"

- name: Check whether the libvirt storage pools are already defined
  ansible.builtin.command:
    cmd: "virsh pool-info {{ item.name }}"
  loop: "{{ kvm_host_prep_pools }}"
  loop_control:
    label: "{{ item.name }}"
  register: kvm_host_prep_pool_check
  changed_when: false
  failed_when: false

- name: Define the missing libvirt ZFS storage pools
  ansible.builtin.command:
    cmd: virsh pool-define /dev/stdin
    stdin: |
      <pool type='zfs'>
        <name>{{ item.item.name }}</name>
        <source>
          <name>{{ item.item.dataset }}</name>
        </source>
      </pool>
  loop: "{{ kvm_host_prep_pool_check.results }}"
  when: item.rc != 0
  loop_control:
    label: "{{ item.item.name }}"

- name: Autostart the libvirt storage pools
  ansible.builtin.command:
    cmd: "virsh pool-autostart {{ item.name }}"
  loop: "{{ kvm_host_prep_pools }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true

- name: Check whether the libvirt storage pools are running
  ansible.builtin.command:
    cmd: "virsh pool-info {{ item.name }}"
  loop: "{{ kvm_host_prep_pools }}"
  loop_control:
    label: "{{ item.name }}"
  register: kvm_host_prep_pool_running_check
  changed_when: false

- name: Start any libvirt storage pool that isn't running
  ansible.builtin.command:
    cmd: "virsh pool-start {{ item.item.name }}"
  loop: "{{ kvm_host_prep_pool_running_check.results }}"
  when: "'running' not in item.stdout"
  loop_control:
    label: "{{ item.item.name }}"
