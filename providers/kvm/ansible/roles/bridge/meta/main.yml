galaxy_info:
  role_name: bridge
  description: >-
    Creates a VLAN-tagged Linux bridge on a KVM host, for talos-kvm
    clusters that need L2 isolation from `controlplane`'s own VLAN 100
    (br0) instead of sharing its physical bridge -- see the M4
    services-network hairpin-routing investigation
    (docs/memory/m4-step-tracker.md) for why this exists.
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - "22.04"
dependencies: []
