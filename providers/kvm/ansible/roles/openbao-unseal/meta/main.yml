galaxy_info:
  role_name: openbao_unseal
  description: >-
    Unseals every openbao-N pod on the controlplane cluster after a cold
    start or pod restart -- OpenBao's Shamir seal is per-pod-process, not
    shared via its postgresql storage backend, so this must run every time
    regardless of how many replicas were already unsealed before. Applies
    key shares only; never runs `bao operator init` (one-time operator
    ceremony, out of scope for a routine reboot). See
    docs/runbooks/openbao-unseal.md.
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - "22.04"
dependencies: []
