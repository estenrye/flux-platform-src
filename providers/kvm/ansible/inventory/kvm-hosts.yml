---
# Ad-hoc inventory for KVM host maintenance playbooks, run by hand from an
# operator's machine (SSH agent forwarding an authorized key for
# automation-user) -- not wired into provider-ansible/AnsibleRun, and not
# reconciled by Crossplane. Host facts (cpu/ram/disks/zfs layout) stay in
# providers/kvm/hosts.yaml, which remains the single source of truth per
# its own header comment; this file only adds what ansible-playbook itself
# needs: the SSH target, and per-host domain lists for kvm-host-maintenance.
all:
  children:
    kvm_hosts:
      hosts:
        mf-ms-a2-01:
          ansible_host: mf-ms-a2-01.usmnblm01.rye.ninja
          ansible_user: automation-user

          # Fleet as of 2026-08-15. kvm-host-maintenance treats these as
          # the desired running set on restart, not just "what happened to
          # be running when the playbook started" -- update this list when
          # domains are added/removed/renamed.
          kvm_maintenance_nat64_domains:
            - nat64-01
          # The controlplane cluster was decommissioned (2026-11-11).
          kvm_maintenance_controlplane_domains: []
          kvm_maintenance_worker_domains: []
          # The observability cluster was decommissioned (2026-11-11), so there
          # are no workload-cluster domains to shut down or start.
          kvm_maintenance_observability_domains: []

          # Unmanaged, pre-dates this repo (uvtool-provisioned, not on the
          # vmpool ZFS dataset) -- confirmed disposable 2026-08-15. Shut
          # down and autostart disabled by kvm-host-maintenance; never
          # restarted by it. Remove this entry entirely once it's deleted
          # from the host for good.
          kvm_maintenance_legacy_domains:
            - qf-r64-v6-tun.usmnblm01.rye.ninja
